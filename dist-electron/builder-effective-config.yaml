directories:
  output: dist-electron
  buildResources: build
appId: com.safenet.dns
productName: SafeNet DNS
extraMetadata:
  main: electron/main.cjs
files:
  - filter:
      - dist/public/**/*
      - electron/**/*.cjs
      - '!node_modules/**/*'
asar: true
win:
  icon: build/icon.ico
  target:
    - target: msi
      arch:
        - x64
    - target: nsis
      arch:
        - x64
msi:
  oneClick: false
  perMachine: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SafeNet DNS
mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
electronVersion: 39.2.7
