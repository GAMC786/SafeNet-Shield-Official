name: Build Android APK and Windows MSI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Windows
          path: dist-electron/*.msi
          retention-days: 30

  build-complete:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check build results
        run: |
          echo "Build Android Status: ${{ needs.build-android.result }}"
          echo "Build Windows Status: ${{ needs.build-windows.result }}"
          
          android_status="${{ needs.build-android.result }}"
          windows_status="${{ needs.build-windows.result }}"
          
          if [ "$android_status" == "success" ] && [ "$windows_status" == "success" ]; then
            echo "✅ All builds completed successfully!"
            exit 0
          elif [ "$android_status" == "cancelled" ] || [ "$windows_status" == "cancelled" ]; then
            echo "⚠️ One or more builds were cancelled!"
            exit 1
          elif [ "$android_status" == "skipped" ] || [ "$windows_status" == "skipped" ]; then
            echo "⚠️ One or more builds were skipped!"
            exit 1
          else
            echo "❌ One or more builds failed!"
            exit 1
          fi

  release:
    needs: [build-complete]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android
          path: artifacts/android

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Windows
          path: artifacts/windows

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/android/*.apk
            artifacts/windows/*.msi
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
