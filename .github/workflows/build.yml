      - name: Upload release instrumentation APK
        id: upload-release-instrumentation-apk
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Android-instrumentation
          path: android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk

      - name: Run Android DNS smoke tests on emulator (${{ env.ANDROID_SMOKE_COVERAGE }})
        id: android-dns-smoke
        if: "!startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')"
        continue-on-error: ${{ github.event_name == 'schedule' || env.DNS_ALERT_VALIDATION == 'lifecycle' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 34 avoids the hosted API 35 image's intermittent offline boot
          # and storage-service failures while still exercising the minSdk 24 app.
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -writable-system
          # Release/tag smoke checks use the local fixture by default so a
          # public resolver outage cannot fail the release lane. Scheduled
          # checks intentionally use public resolvers and are non-blocking.
          script: ./scripts/android-smoke-test.sh --apk "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk" --test-apk "$GITHUB_WORKSPACE/android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk"
        env:
          AUTH_SMOKE_STORAGE_STATE: ${{ secrets.AUTH_SMOKE_STORAGE_STATE }}
          ANDROID_EMULATOR_API_LEVEL: 34
          ANDROID_EMULATOR_TARGET: google_apis
          ANDROID_EMULATOR_ARCH: x86_64
          ANDROID_EMULATOR_SYSTEM_IMAGE: system-images;android-34;google_apis;x86_64

      - name: Upload Android DNS smoke evidence
        id: upload-android-dns-smoke-evidence
        if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Android-smoke-evidence-${{ env.ANDROID_SMOKE_COVERAGE }}
          path: android/app/build/reports/android-smoke/latest
          if-no-files-found: warn

      - name: Alert maintainers about public DNS smoke failure
        # workflow_dispatch is only enabled for the explicit lifecycle choice.
        # Ordinary fixture dispatches retain the schedule-only production path.
        if: always() && ((github.event_name == 'schedule' && env.ANDROID_SMOKE_COVERAGE == 'external-network' && steps.android-dns-smoke.outcome == 'failure') || (github.event_name == 'workflow_dispatch' && env.DNS_ALERT_VALIDATION == 'lifecycle'))
        uses: actions/github-script@v7
        env:
          ALERT_TITLE: "[Maintainer alert] Scheduled public DNS smoke failure"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVIDENCE_URL: ${{ steps.upload-android-dns-smoke-evidence.outputs.artifact-url || format('{0}/{1}/actions/runs/{2}#artifacts', github.server_url, github.repository, github.run_id) }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = process.env.ALERT_TITLE;
            const runUrl = process.env.RUN_URL;
            const evidenceUrl = process.env.EVIDENCE_URL;
            const body = [
              'The scheduled public-network Android DNS smoke check failed.',
              '',
              `Workflow run: [View run](${runUrl})`,
              `Evidence artifact: ${evidenceUrl ? `[Download smoke evidence](${evidenceUrl})` : 'The evidence artifact URL was not returned; see the run artifacts.'}`,
              '',
              'This alert is informational and does not block releases.'
            ].join('\n');

            const labelName = 'maintainer-alert';
            const labelColor = 'b60205';
            const maxAttempts = 3;
            const isTransientGitHubError = (error) => {
              const status = Number(error?.status);
              const transientCodes = ['ECONNRESET', 'ETIMEDOUT', 'EAI_AGAIN', 'ENOTFOUND'];
              const rateLimitRemaining = error?.response?.headers?.['x-ratelimit-remaining'];
              return status === 408 ||
                status === 429 ||
                status >= 500 ||
                transientCodes.includes(error?.code) ||
                (status === 403 && rateLimitRemaining === '0');
            };
            const withGitHubRetry = async (operation, request, reconcile) => {
              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                try {
                  const result = await request();
                  if (attempt > 1) {
                    core.info(`${operation} succeeded after ${attempt} attempts.`);
                  }
                  return result;
                } catch (error) {
                  if (!isTransientGitHubError(error)) {
                    throw error;
                  }
                  if (reconcile) {
                    try {
                      const reconciled = await reconcile();
                      if (reconciled) {
                        core.info(`${operation} response was ambiguous; reconciled with GitHub.`);
                        return reconciled;
                      }
                    } catch {
                      core.warning(`${operation} reconciliation check failed; retrying original request.`);
                    }
                  }
                  if (attempt === maxAttempts) {
                    core.error(`${operation} failed after ${attempt} attempt(s).`);
                    throw error;
                  }
                  core.warning(
                    `${operation} hit a transient GitHub API failure on attempt ${attempt}/${maxAttempts}; retrying.`,
                  );
                  await new Promise((resolve) => setTimeout(resolve, 1000 * 2 ** (attempt - 1)));
                }
              }
              throw new Error(`${operation} exhausted its retry attempts.`);
            };

            try {
              await withGitHubRetry('Failure alert: check maintainer-alert label', () =>
                github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName
                })
              );
            } catch (error) {
              if (error.status !== 404) throw error;
              await withGitHubRetry('Failure alert: create maintainer-alert label', () =>
                github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName,
                  color: labelColor,
                  description: 'Action required from maintainers'
                })
              );
            }

            const listOpenAlerts = () => withGitHubRetry('Failure alert: list open maintainer alerts', () =>
              github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: labelName,
                per_page: 100
              })
            );
            const { data: openAlerts } = await listOpenAlerts();
            const alert = openAlerts.find((issue) => issue.title === title);

            if (alert) {
              await withGitHubRetry(
                'Failure alert: comment on existing alert',
                () => github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: alert.number,
                  body
                }),
                async () => {
                  const { data: comments } = await withGitHubRetry('Failure alert: reconcile existing alert comment', () =>
                    github.rest.issues.listComments({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: alert.number,
                      per_page: 100
                    })
                  );
                  const existingComment = comments.find((comment) => comment.body === body);
                  return existingComment ? { data: existingComment } : undefined;
                }
              );
              core.info(`Updated existing maintainer alert #${alert.number}.`);
            } else {
              const { data: created } = await withGitHubRetry(
                'Failure alert: create issue',
                () => github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: [labelName]
                }),
                async () => {
                  const { data: currentOpenAlerts } = await listOpenAlerts();
                  const existingAlert = currentOpenAlerts.find((issue) => issue.title === title);
                  return existingAlert ? { data: existingAlert } : undefined;
                }
              );
              core.info(`Created maintainer alert #${created.number}.`);
            }

      - name: Close recovered public DNS smoke alert
        if: always() && ((github.event_name == 'schedule' && env.ANDROID_SMOKE_COVERAGE == 'external-network' && steps.android-dns-smoke.outcome == 'success') || (github.event_name == 'workflow_dispatch' && env.DNS_ALERT_VALIDATION == 'lifecycle'))
        uses: actions/github-script@v7
        env:
          ALERT_TITLE: "[Maintainer alert] Scheduled public DNS smoke failure"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = process.env.ALERT_TITLE;
            const runUrl = process.env.RUN_URL;
            const labelName = 'maintainer-alert';
            const body = [
              'The scheduled public-network Android DNS smoke check recovered successfully.',
              '',
              `Successful workflow run: [View run](${runUrl})`,
              '',
              'Closing this alert while preserving the previous failure history.'
            ].join('\n');
            const maxAttempts = 3;
            const isTransientGitHubError = (error) => {
              const status = Number(error?.status);
              const transientCodes = ['ECONNRESET', 'ETIMEDOUT', 'EAI_AGAIN', 'ENOTFOUND'];
              const rateLimitRemaining = error?.response?.headers?.['x-ratelimit-remaining'];
              return status === 408 ||
                status === 429 ||
                status >= 500 ||
                transientCodes.includes(error?.code) ||
                (status === 403 && rateLimitRemaining === '0');
            };
            const withGitHubRetry = async (operation, request, reconcile) => {
              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                try {
                  const result = await request();
                  if (attempt > 1) {
                    core.info(`${operation} succeeded after ${attempt} attempts.`);
                  }
                  return result;
                } catch (error) {
                  if (!isTransientGitHubError(error)) {
                    throw error;
                  }
                  if (reconcile) {
                    try {
                      const reconciled = await reconcile();
                      if (reconciled) {
                        core.info(`${operation} response was ambiguous; reconciled with GitHub.`);
                        return reconciled;
                      }
                    } catch {
                      core.warning(`${operation} reconciliation check failed; retrying original request.`);
                    }
                  }
                  if (attempt === maxAttempts) {
                    core.error(`${operation} failed after ${attempt} attempt(s).`);
                    throw error;
                  }
                  core.warning(
                    `${operation} hit a transient GitHub API failure on attempt ${attempt}/${maxAttempts}; retrying.`,
                  );
                  await new Promise((resolve) => setTimeout(resolve, 1000 * 2 ** (attempt - 1)));
                }
              }
              throw new Error(`${operation} exhausted its retry attempts.`);
            };

            const listOpenAlerts = () => withGitHubRetry('Recovery alert: list open maintainer alerts', () =>
              github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: labelName,
                per_page: 100
              })
            );
            let alert;
            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const { data: openAlerts } = await listOpenAlerts();
              alert = openAlerts.find((issue) => issue.title === title);
              if (alert || attempt === maxAttempts) break;
              core.warning(`Recovery alert: no open alert found yet; retrying lookup (${attempt}/${maxAttempts}).`);
              await new Promise((resolve) => setTimeout(resolve, 1000 * attempt));
            }

            if (!alert) {
              core.info('No open public DNS smoke alert found; nothing to close.');
              return;
            }

            await withGitHubRetry(
              'Recovery alert: comment on recovered alert',
              () => github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: alert.number,
                body
              }),
              async () => {
                const { data: comments } = await withGitHubRetry('Recovery alert: reconcile recovered alert comment', () =>
                  github.rest.issues.listComments({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: alert.number,
                    per_page: 100
                  })
                );
                const existingComment = comments.find((comment) => comment.body === body);
                return existingComment ? { data: existingComment } : undefined;
              }
            );
            await withGitHubRetry(
              'Recovery alert: close recovered alert',
              () => github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: alert.number,
                state: 'closed',
                state_reason: 'completed'
              }),
              async () => {
                const { data: currentAlert } = await withGitHubRetry('Recovery alert: reconcile recovered alert closure', () =>
                  github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: alert.number
                  })
                );
                return currentAlert.state === 'closed' ? { data: currentAlert } : undefined;
              }
            );
            core.info(`Closed recovered maintainer alert #${alert.number}.`);

  android-billing-preflight:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.android_billing_validation == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    env:
      AUTH_SMOKE_STORAGE_STATE: ${{ secrets.AUTH_SMOKE_STORAGE_STATE }}
    steps:
      - name: Check Clerk billing session configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AUTH_SMOKE_STORAGE_STATE}" ]]; then
            echo "::error::AUTH_SMOKE_STORAGE_STATE repository secret is required before Android billing validation can run."
            exit 1
          fi
          AUTH_SMOKE_STORAGE_STATE="$AUTH_SMOKE_STORAGE_STATE" node --input-type=module - <<'NODE'
          const raw = process.env.AUTH_SMOKE_STORAGE_STATE;
          let state;
          try {
            state = JSON.parse(raw);
          } catch {
            console.error("AUTH_SMOKE_STORAGE_STATE must be valid JSON for the Clerk billing session.");
            process.exit(1);
          }
          const cookies = Array.isArray(state?.cookies) ? state.cookies : [];
          const hasCookie = cookies.some(
            (cookie) =>
              typeof cookie?.name === "string" &&
              cookie.name.length > 0 &&
              typeof cookie?.value === "string" &&
              cookie.value.length > 0,
          );
          if (!hasCookie) {
            console.error(
              "AUTH_SMOKE_STORAGE_STATE must contain a Clerk browser cookie for the billing session.",
            );
            process.exit(1);
          }
          console.log("Clerk billing session configuration: ready.");
          NODE

      - name: Check dedicated Play billing runner
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const requiredLabel = 'android-play-billing';
            const { data } = await github.rest.actions.listSelfHostedRunnersForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const readyRunner = (data.runners || []).find((runner) =>
              runner.status === 'online' &&
              runner.busy === false &&
              (runner.labels || []).some((label) => label.name === requiredLabel)
            );
            if (!readyRunner) {
              core.setFailed(
                `No online idle self-hosted runner has the "${requiredLabel}" label. ` +
                `Register or start that runner before dispatching Android billing validation.`
              );
              return;
            }
            core.info(`Ready Android billing runner found with the ${requiredLabel} label.`);

  android-billing-proof:
    needs: [build-android, android-billing-preflight]
    if: >-
      always() &&
      needs.build-android.result == 'success' &&
      needs.android-billing-preflight.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.android_billing_validation == true
    # This runner must be a configured Google Play device or Play-enabled
    # emulator with a license-tester account. The ordinary hosted google_apis
    # image cannot open a real Play Billing purchase dialog.
    runs-on: [self-hosted, linux, x64, android-play-billing]
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ANDROID_BILLING_CLERK_ORIGIN: ${{ secrets.AUTH_SMOKE_BASE_URL || 'https://safe-net-shield-official.replit.app' }}
      AUTH_SMOKE_STORAGE_STATE: ${{ secrets.AUTH_SMOKE_STORAGE_STATE }}
      ANDROID_BILLING_OUTPUT_DIR: android/app/build/reports/android-billing/latest
      ANDROID_BILLING_PREFLIGHT_TIMEOUT_SECONDS: 20
    steps:
      - name: Checkout billing proof
        uses: actions/checkout@v4

      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android
          path: artifacts/android

      - name: Download release instrumentation APK
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android-instrumentation
          path: artifacts/android-test

      - name: Verify signed release APK identity
        shell: bash
        run: |
          set -euo pipefail
          apk="artifacts/android/app-release.apk"
          test_apk="artifacts/android-test/app-release-androidTest.apk"
          test -s "$apk"
          test -s "$test_apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -n 1)"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -perm -u+x | sort -V | tail -n 1)"
          test -n "$apksigner"
          test -n "$aapt"
          "$apksigner" verify --verbose "$apk"
          "$aapt" dump badging "$apk" |
            grep -F "package: name='com.safenet.dns'"

      - name: Run signed purchase, restore, and entitlement proof
        id: android-billing-proof
        shell: bash
        run: bash scripts/android-billing-proof.sh

      - name: Publish Android billing proof summary
        if: always()
        shell: bash
        env:
          PROOF_OUTCOME: ${{ steps.android-billing-proof.outcome }}
        run: |
          set -euo pipefail
          result_file="$ANDROID_BILLING_OUTPUT_DIR/result.txt"
          result="$(awk -F= '$1 == "result" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          result="${result:-NOT_RECORDED}"
          preflight="$(awk -F= '$1 == "configuration_preflight" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          preflight="${preflight:-NOT_RECORDED}"
          {
            echo "## Android RevenueCat billing proof"
            echo
            echo "- **Runner:** \`dedicated Play-enabled runner\`"
            echo "- **Configuration preflight:** \`$preflight\`"
            echo "- **Signed APK proof:** \`$result\`"
            echo "- **Purchase/restore instrumentation:** \`${PROOF_OUTCOME:-NOT_RECORDED}\`"
            echo "- **Authenticated server entitlement:** \`$result\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android billing proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Android-billing-proof
          path: android/app/build/reports/android-billing/latest
          if-no-files-found: warn

  android-runner-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Keep this independent from the build and release jobs so a broken
    # runner is visible even when no release is waiting for it.
    runs-on: [self-hosted, linux, x64, android-writable-system]
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ANDROID_EMULATOR_API_LEVEL: 35
      ANDROID_AVD_NAME: safenet-writable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check dedicated Android release runner
        shell: bash
        run: |
          set -o pipefail
          ./scripts/provision-android-runner.sh --check 2>&1 |
            tee "$RUNNER_TEMP/android-runner-health.log"

  workflow-lint-history-watchdog:
    name: Verify monthly workflow lint record
    # The weekday schedule gives this check a chance to notice that the
    # first-of-month schedule was skipped, while keeping it independent from
    # both the matrix and the history commit job.
    if: github.event_name == 'schedule' && github.event.schedule == '17 4 * * 1-5'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Capture watchdog timestamp
        id: watchdog-time
        shell: bash
        run: echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Alert when the monthly workflow lint record is missing
        uses: actions/github-script@v7
        env:
          ALERT_TITLE: "[Maintainer alert] Monthly workflow lint record missing"
          CHECKED_AT: ${{ steps.watchdog-time.outputs.checked_at }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HISTORY_PATH: ".github/workflow-lint-history.json"
          MATRIX_CONTRACT_PATH: ".github/workflow-lint-matrix.json"
          HISTORY_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/.github/workflow-lint-history.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_FILE: "build.yml"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const checkedAt = new Date(process.env.CHECKED_AT);
            if (Number.isNaN(checkedAt.getTime())) {
              throw new Error(`Invalid watchdog timestamp: ${process.env.CHECKED_AT}`);
            }

            // The daily schedule runs before the monthly schedule on the
            // first day. Defer until the next weekday so that the expected
            // monthly run has had time to start and publish its artifacts.
            if (checkedAt.getUTCDate() === 1) {
              core.info('Deferring monthly workflow lint verification until after the first day of the month.');
              return;
            }

            const month = checkedAt.toISOString().slice(0, 7);
            const boundedScheduleWindow = `${month}-03`;
            const currentRunUrl = process.env.RUN_URL;
            const historyUrl = process.env.HISTORY_URL;
            const { owner, repo } = context.repo;
             let expected;
             const contractPath = process.env.MATRIX_CONTRACT_PATH;
             try {
               const { data: matrixFile } = await github.rest.repos.getContent({
                 owner,
                 repo,
                 path: contractPath,
                 ref: process.env.DEFAULT_BRANCH
               });
               if (Array.isArray(matrixFile) || !matrixFile.content) {
                 throw new Error('matrix contract path did not return a file');
               }
               expected = JSON.parse(
                 Buffer.from(matrixFile.content, matrixFile.encoding || 'base64').toString('utf8'),
               );
               if (!Array.isArray(expected) || expected.length === 0 || expected.some((entry) =>
                 !entry || typeof entry.platform !== 'string' ||
                 typeof entry.architecture !== 'string' ||
                 typeof entry.runner !== 'string' ||
                 typeof entry.name !== 'string'
               )) {
                 throw new Error('matrix contract has an invalid entry');
               }
             } catch (error) {
               throw new Error(`The workflow lint matrix contract ${contractPath} could not be read or parsed: ${error.message}`);
             }
             const expectedOutcomes = expected.map(
               (entry) => `${entry.platform}/${entry.architecture}`,
             );

            const { data: runList } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: process.env.WORKFLOW_FILE,
              event: 'schedule',
              branch: process.env.DEFAULT_BRANCH,
              per_page: 100
            });

            // A monthly run is distinguished from the weekday schedule by
            // the presence of the conditional cross-platform lint matrix.
            // Only inspect the first three UTC days, keeping API work bounded
            // even if the workflow runs frequently for other reasons.
            const candidateRuns = runList.workflow_runs
              .filter((run) => {
                const createdDate = String(run.created_at).slice(0, 10);
                return createdDate >= `${month}-01` && createdDate <= boundedScheduleWindow;
              })
              .sort((left, right) =>
                String(right.created_at).localeCompare(String(left.created_at)),
              )
              .slice(0, 10);

            let monthlyRun;
            for (const candidate of candidateRuns) {
              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: candidate.id,
                per_page: 100
              });
               if (jobs.jobs.some((job) =>
                 expected.some((entry) => entry.name === job.name)
               )) {
                monthlyRun = candidate;
                break;
              }
            }

            const findings = [];
            if (!monthlyRun) {
              const nearestRun = candidateRuns[0];
              findings.push(
                `No scheduled workflow run containing the cross-platform lint matrix was found for ${month}.`,
              );
              if (nearestRun?.html_url) {
                findings.push(`The nearest scheduled run was [${nearestRun.id}](${nearestRun.html_url}); inspect why the monthly matrix was skipped.`);
              }
            }

            let history;
            try {
              const { data: historyFile } = await github.rest.repos.getContent({
                owner,
                repo,
                path: process.env.HISTORY_PATH,
                ref: process.env.DEFAULT_BRANCH
              });
              if (Array.isArray(historyFile) || !historyFile.content) {
                throw new Error('history path did not return a file');
              }
              history = JSON.parse(
                Buffer.from(historyFile.content, historyFile.encoding || 'base64').toString('utf8'),
              );
            } catch (error) {
              const reason = error.status === 404
                ? 'the file was not found'
                : 'the file could not be read or parsed';
              findings.push(`The history file ${process.env.HISTORY_PATH} ${reason}.`);
            }

            if (monthlyRun && history) {
              const historyRun = Array.isArray(history.runs)
                ? history.runs.find((run) => String(run.run_id) === String(monthlyRun.id))
                : undefined;
              if (!historyRun) {
                findings.push(`The history file has no record for monthly workflow run ${monthlyRun.id}.`);
              } else if (!Array.isArray(historyRun.results)) {
                findings.push(`Monthly workflow run ${monthlyRun.id} has no outcome records in the history file.`);
              } else {
                const recordedOutcomes = new Set(
                  historyRun.results.map((result) =>
                    `${result?.platform}/${result?.architecture}`,
                  ),
                );
                const missingOutcomes = expectedOutcomes.filter(
                  (outcome) => !recordedOutcomes.has(outcome),
                );
                if (historyRun.results.length !== expectedOutcomes.length || missingOutcomes.length > 0) {
                  findings.push(
                    `Monthly workflow run ${monthlyRun.id} is missing outcome records: ${
                      missingOutcomes.length > 0
                        ? missingOutcomes.join(', ')
                        : `the expected ${expectedOutcomes.length}-record set`
                    }.`,
                  );
                }
              }
            }

            const labelName = 'maintainer-alert';
            if (findings.length === 0) {
              core.info(`Monthly workflow lint run ${monthlyRun.id} and all ${expectedOutcomes.length} history outcomes are present.`);

              const { data: openAlerts } = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'open',
                labels: labelName,
                per_page: 100
              });
              const alert = openAlerts.find((issue) => issue.title === process.env.ALERT_TITLE);

              if (!alert) {
                core.info('No open monthly workflow lint history alert found; nothing to close.');
                return;
              }

              const recoveryBody = [
                'The monthly hosted-runner workflow lint record recovered successfully.',
                '',
                `Successful workflow run: [${monthlyRun.id}](${monthlyRun.html_url || currentRunUrl})`,
                `History file: [Open ${process.env.HISTORY_PATH}](${historyUrl})`,
                '',
                'Closing this alert while preserving the previous finding history.'
              ].join('\n');
              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: alert.number,
                per_page: 100
              });
              if (!comments.some((comment) => comment.body === recoveryBody)) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: alert.number,
                  body: recoveryBody
                });
              }
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: alert.number,
                state: 'closed',
                state_reason: 'completed'
              });
              core.info(`Closed recovered monthly workflow lint history alert #${alert.number}.`);
              return;
            }

            const affectedRun = monthlyRun || candidateRuns[0];
            const affectedRunLink = affectedRun?.html_url
              ? `[View affected workflow run](${affectedRun.html_url})`
              : `No monthly run was found; [view the watchdog run](${currentRunUrl})`;
            const body = [
              'The monthly hosted-runner workflow lint record is missing or incomplete.',
              '',
              `Affected workflow run: ${affectedRunLink}`,
              `Watchdog run: [View check run](${currentRunUrl})`,
              `History file: [Open ${process.env.HISTORY_PATH}](${historyUrl})`,
              '',
              '**Findings:**',
              ...findings.map((finding) => `- ${finding}`),
              '',
              `No synthetic history entry was created. Rerun or repair the monthly schedule and verify the ${expectedOutcomes.join(', ')} outcome records.`
            ].join('\n');

            try {
              await github.rest.issues.getLabel({
                owner,
                repo,
                name: labelName
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: labelName,
                color: 'b60205',
                description: 'Action required from maintainers'
              });
            }

            const { data: openAlerts } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: labelName,
              per_page: 100
            });
            const alert = openAlerts.find((issue) => issue.title === process.env.ALERT_TITLE);

            if (!alert) {
              await github.rest.issues.create({
                owner,
                repo,
                title: process.env.ALERT_TITLE,
                body,
                labels: [labelName]
              });
              core.warning(`Created monthly workflow lint history alert for ${month}.`);
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: alert.number,
              per_page: 100
            });
            if (comments.some((comment) => comment.body === body)) {
              core.info(`Monthly workflow lint history alert #${alert.number} already contains this finding.`);
              return;
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: alert.number,
              body
            });
            core.warning(`Updated monthly workflow lint history alert #${alert.number}.`);

  android-release-smoke:
    needs: build-android
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build-android.result != 'cancelled'
    # Hosted fallback for public repositories: this validates APK installation,
    # WebView relaunch, instrumentation, and public-network
    # DNS behavior, but cannot validate
    # writable-system trust changes or adb-root-only behavior.
    runs-on: ubuntu-latest
    # Keep a hung hosted emulator from holding the release job indefinitely.
    # The release job explicitly accepts this job's bounded failure after the
    # signed APK build has succeeded.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ANDROID_SMOKE_RESOLVER_MODE: public
      ANDROID_SMOKE_COVERAGE: hosted-emulator
      ANDROID_SMOKE_VALIDATION_MODE: hosted-emulator-reduced
      ANDROID_SMOKE_DEVICE_KIND: hosted-emulator
      ANDROID_AVD_NAME: safenet-hosted
      BUILD_ANDROID_RESULT: ${{ needs.build-android.result }}
      ANDROID_SDK_SETUP_CATEGORY: ${{ needs.build-android.outputs.android_sdk_setup_category || 'NOT_RECORDED' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download signed release APK
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android
          path: artifacts/android

      - name: Download release instrumentation APK
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android-instrumentation
          path: artifacts/android-test

      - name: Verify release APK inputs
        if: needs.build-android.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/artifacts/android/app-release.apk"
          test_apk="$GITHUB_WORKSPACE/artifacts/android-test/app-release-androidTest.apk"
          test -s "$apk" || { echo "::error::Signed release APK is missing: $apk"; exit 1; }
          test -s "$test_apk" || { echo "::error::Release instrumentation APK is missing: $test_apk"; exit 1; }
          echo "Verified release APK inputs."

      - name: Run hosted-emulator smoke test (reduced validation)
        id: android-release-dns-smoke
        if: needs.build-android.result == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Hosted Google APIs images do not provide the writable-system and
          # adb-root guarantees required by the dedicated runner lane.
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: ${{ env.ANDROID_AVD_NAME }}
          force-avd-creation: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./scripts/android-smoke-test.sh --apk "$GITHUB_WORKSPACE/artifacts/android/app-release.apk" --test-apk "$GITHUB_WORKSPACE/artifacts/android-test/app-release-androidTest.apk" --output "$GITHUB_WORKSPACE/android/app/build/reports/android-smoke/latest"
        env:
          ANDROID_EMULATOR_API_LEVEL: 34
          ANDROID_EMULATOR_TARGET: google_apis
          ANDROID_EMULATOR_ARCH: x86_64
          ANDROID_EMULATOR_SYSTEM_IMAGE: system-images;android-34;google_apis;x86_64

      - name: Publish release Android smoke summary
        if: always()
        shell: bash
        env:
          SMOKE_STEP_OUTCOME: ${{ steps.android-release-dns-smoke.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVIDENCE_URL: ${{ format('{0}/{1}/actions/runs/{2}#artifacts', github.server_url, github.repository, github.run_id) }}
          RELEASE_EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/SafeNet-DNS-Android-smoke-evidence.tar.gz
          RELEASE_RESULT_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/SafeNet-DNS-Android-smoke-result.txt
        run: |
          set -euo pipefail
          evidence_dir="$GITHUB_WORKSPACE/android/app/build/reports/android-smoke/latest"
          mkdir -p "$evidence_dir"
          release_evidence_url="${RELEASE_EVIDENCE_URL:-unavailable}"
          release_result_url="${RELEASE_RESULT_URL:-unavailable}"
          category_file="$evidence_dir/failure-category.txt"
          category="EMULATOR_RUNNER_FAILURE"
          resolver_proof_status="NOT_RECORDED"
          resolver_proof_block_reason="none"
          build_android_result="${BUILD_ANDROID_RESULT:-success}"
          android_sdk_setup_category="${ANDROID_SDK_SETUP_CATEGORY:-NOT_RECORDED}"

          if [[ "$build_android_result" != "success" ]]; then
            if [[ "$android_sdk_setup_category" == "ANDROID_SDK_SETUP_FAILURE" ]]; then
              category="ANDROID_SDK_SETUP_FAILURE"
              resolver_proof_status="NOT_RUN"
              resolver_proof_block_reason="ANDROID_SDK_SETUP_FAILURE"
            else
              category="ANDROID_BUILD_FAILURE"
              resolver_proof_status="NOT_RUN"
              resolver_proof_block_reason="ANDROID_BUILD_FAILURE"
            fi
          fi

          # The emulator action can fail before its script starts. Keep the
          # summary useful in that case, and only publish categories emitted
          # by the smoke script rather than arbitrary evidence-file content.
          if [[ "$build_android_result" == "success" && -f "$category_file" ]]; then
            candidate="$(head -n 1 "$category_file" | tr -d '\r')"
            case "$candidate" in
              PASS|FIXTURE_FAILURE|ENETUNREACH|UNRELATED_NETWORK_FAILURE|NON_NETWORK_FAILURE)
                category="$candidate"
                ;;
              *)
                category="UNKNOWN_FAILURE"
                ;;
            esac
            resolver_proof_status="RECORDED"
          fi

          # Keep a small, stable result record even when the emulator action
          # fails before the smoke script starts. The full directory remains
          # useful for diagnostics, while this file is the release-linked
          # verifier entry point.
          if [[ ! -f "$evidence_dir/result.txt" ]]; then
            cat > "$evidence_dir/result.txt" <<EOF
          target=unavailable
          apk=unavailable
          validation_mode=hosted-emulator-reduced
          device_kind=hosted-emulator
          resolver_mode=public
          coverage=hosted-emulator
          instrumentation_status=not-started
          connectivity_recovery=not-started
          resolver_recovery=not-started
          doh_recovery=not-started
          dot_recovery=not-started
          doh_recovery_failure_category=NOT_RECORDED
          doh_recovery_failure_phase=NOT_RECORDED
          doh_recovery_failure_elapsed_ms=NOT_RECORDED
          dot_recovery_failure_category=NOT_RECORDED
          dot_recovery_failure_phase=NOT_RECORDED
          dot_recovery_failure_elapsed_ms=NOT_RECORDED
          failure_category=$category
          EOF
          fi
          recovery_status="$(awk -F= '$1 == "connectivity_recovery" { print $2; exit }' "$evidence_dir/result.txt" 2>/dev/null || true)"
          recovery_status="${recovery_status:-NOT_RECORDED}"
          resolver_recovery_status="$(awk -F= '$1 == "resolver_recovery" { print $2; exit }' "$evidence_dir/result.txt" 2>/dev/null || true)"
          resolver_recovery_status="${resolver_recovery_status:-NOT_RECORDED}"
          doh_recovery_status="$(awk -F= '$1 == "doh_recovery" { print $2; exit }' "$evidence_dir/result.txt" 2>/dev/null || true)"
          doh_recovery_status="${doh_recovery_status:-NOT_RECORDED}"
          dot_recovery_status="$(awk -F= '$1 == "dot_recovery" { print $2; exit }' "$evidence_dir/result.txt" 2>/dev/null || true)"
          dot_recovery_status="${dot_recovery_status:-NOT_RECORDED}"
          doh_failure_category="$(awk -F= '$1 == "doh_recovery_failure_category" { print $2; exit }' "$evidence_dir/result.txt" 2>/dev/null || true)"
          doh_failure_category="${doh_failure_category:-NOT_RECORDED}"
          doh_failure_phase="$(awk -F= '$1 == "doh_recovery_failure_phase" { print $2; exit }' "$evidence_dir/result.txt" 2>/dev/null || true)"
          doh_failure_phase="${doh_failure_phase:-NOT_RECORDED}"
          doh_failure_elapsed_ms="$(awk -F= '$1 == "doh_recovery_failure_elapsed_ms" { print $2; exit }' "$evidence_dir/result.txt" 2>/dev/null || true)"
          doh_failure_elapsed_ms="${doh_failure_elapsed_ms:-NOT_RECORDED}"
          dot_failure_category="$(awk -F= '$1 == "dot_recovery_failure_category" { print $2; exit }' "$evidence_dir/result.txt" 2>/dev/null || true)"
          dot_failure_category="${dot_failure_category:-NOT_RECORDED}"
          dot_failure_phase="$(awk -F= '$1 == "dot_recovery_failure_phase" { print $2; exit }' "$evidence_dir/result.txt" 2>/dev/null || true)"
          dot_failure_phase="${dot_failure_phase:-NOT_RECORDED}"
          dot_failure_elapsed_ms="$(awk -F= '$1 == "dot_recovery_failure_elapsed_ms" { print $2; exit }' "$evidence_dir/result.txt" 2>/dev/null || true)"
          dot_failure_elapsed_ms="${dot_failure_elapsed_ms:-NOT_RECORDED}"
          cp "$evidence_dir/result.txt" "$evidence_dir/android-smoke-result.txt"
          {
            echo "android_sdk_setup_category=$android_sdk_setup_category"
            echo "resolver_proof_status=$resolver_proof_status"
            echo "resolver_proof_block_reason=$resolver_proof_block_reason"
          } >> "$evidence_dir/android-smoke-result.txt"
          {
            echo "validation_mode=hosted-emulator-reduced"
            echo "device_kind=hosted-emulator"
            echo "coverage=hosted-emulator"
            echo "resolver_mode=public"
            echo "android_sdk_setup_category=$android_sdk_setup_category"
            echo "failure_category=$category"
            echo "resolver_proof_status=$resolver_proof_status"
            echo "resolver_proof_block_reason=$resolver_proof_block_reason"
            echo "resolver_recovery=$resolver_recovery_status"
            echo "doh_recovery=$doh_recovery_status"
            echo "dot_recovery=$dot_recovery_status"
            echo "doh_recovery_failure_category=$doh_failure_category"
            echo "doh_recovery_failure_phase=$doh_failure_phase"
            echo "doh_recovery_failure_elapsed_ms=$doh_failure_elapsed_ms"
            echo "dot_recovery_failure_category=$dot_failure_category"
            echo "dot_recovery_failure_phase=$dot_failure_phase"
            echo "dot_recovery_failure_elapsed_ms=$dot_failure_elapsed_ms"
            echo "smoke_step_outcome=$SMOKE_STEP_OUTCOME"
            echo "workflow_run=$RUN_URL"
            echo "release_evidence_url=$release_evidence_url"
            echo "release_result_url=$release_result_url"
          } > "$evidence_dir/release-record.txt"

          {
            echo "## Android release smoke"
            echo
            echo "- **Validation mode:** \`hosted emulator / public network\` (writable-system trust preflight is not run)"
            echo "- **Failure category:** \`$category\`"
            echo "- **Android SDK setup:** \`$android_sdk_setup_category\`"
            if [[ "$resolver_proof_status" == "NOT_RUN" ]]; then
              echo "- **Resolver smoke proof:** \`NOT_RUN\` — blocked by \`$resolver_proof_block_reason\`"
            else
              echo "- **Resolver smoke proof:** \`$resolver_proof_status\`"
            fi
            echo "- **Internet loss and recovery:** \`$recovery_status\` (offline banner, offline DNS filtering, and post-reconnect API status are recorded in the evidence archive)"
            echo "- **DoH outage recovery:** \`$doh_recovery_status\`"
            echo "- **DoT outage recovery:** \`$dot_recovery_status\`"
            echo "- **DoH failure detail:** \`$doh_failure_category\` in \`$doh_failure_phase\` after \`${doh_failure_elapsed_ms}ms\`"
            echo "- **DoT failure detail:** \`$dot_failure_category\` in \`$dot_failure_phase\` after \`${dot_failure_elapsed_ms}ms\`"
            echo "- **Smoke step:** \`$SMOKE_STEP_OUTCOME\`"
            echo "- **Workflow run:** [Open run]($RUN_URL)"
            echo "- **Evidence artifact:** [Download smoke evidence]($EVIDENCE_URL)"
            echo "- **Release-linked evidence:** [Download evidence archive]($release_evidence_url)"
            echo "- **Release-linked result:** [Download smoke result]($release_result_url)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release Android smoke evidence
        id: upload-release-android-smoke-evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Android-smoke-evidence-release
          path: android/app/build/reports/android-smoke/latest
          if-no-files-found: warn

  android-release-startup:
    needs: build-android
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.android_startup_validation == true
    # A hosted emulator can miss the physical-device-only blank WebView
    # regression. Run the signed APK on the dedicated Android runner and keep
    # this gate separate from the network-heavy DNS smoke lane.
    runs-on: [self-hosted, linux, x64, android-writable-system]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ANDROID_AVD_NAME: safenet-writable
      ANDROID_SMOKE_VALIDATION_MODE: real-device
      ANDROID_SMOKE_DEVICE_KIND: dedicated-device-runner
      ANDROID_SMOKE_OUTPUT_DIR: android/app/build/reports/android-startup/latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android
          path: artifacts/android

      - name: Download release instrumentation APK for startup sampling
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android-instrumentation
          path: artifacts/android-test

      - name: Verify signed release APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/artifacts/android/app-release.apk"
          test -s "$apk" || {
            echo "::error::Signed release APK is missing: $apk"
            exit 1
          }
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -n 1)"
          test -n "$apksigner" && "$apksigner" verify --verbose "$apk"

      - name: Check dedicated Android release runner
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          ./scripts/provision-android-runner.sh --check

      - name: Start dedicated Android device
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/android/app/build/reports/android-startup/latest"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          export PATH="$sdk_root/platform-tools:$sdk_root/emulator:$PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk_root/emulator" >> "$GITHUB_PATH"
          adb start-server
          adb devices | awk 'NR > 1 && $2 == "device" { print $1 }' |
            while read -r serial; do
              adb -s "$serial" emu kill >/dev/null 2>&1 || true
            done
          emulator -avd "$ANDROID_AVD_NAME" \
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio \
            -no-boot-anim -writable-system \
            > "$GITHUB_WORKSPACE/android/app/build/reports/android-startup/latest/emulator.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/safenet-android-emulator.pid"
          adb -s emulator-5554 wait-for-device
          for _ in {1..180}; do
            if [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              break
            fi
            sleep 1
          done
          test "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = "1"

      - name: Run signed APK startup checks
        id: android-release-startup-check
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/android-smoke-test.sh \
            --startup-only \
            --compact-startup \
            --apk "$GITHUB_WORKSPACE/artifacts/android/app-release.apk" \
            --test-apk "$GITHUB_WORKSPACE/artifacts/android-test/app-release-androidTest.apk" \
            --output "$GITHUB_WORKSPACE/android/app/build/reports/android-startup/latest" \
            --serial emulator-5554

      - name: Stop dedicated Android device
        if: always()
        shell: bash
        run: |
          set +e
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          export PATH="$sdk_root/platform-tools:$PATH"
          adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
          if [[ -f "$RUNNER_TEMP/safenet-android-emulator.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/safenet-android-emulator.pid")" >/dev/null 2>&1 || true
          fi

      - name: Upload Android startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Android-startup-evidence-release
          path: android/app/build/reports/android-startup/latest
          if-no-files-found: error

  android-ai-shield-physical:
    needs: build-android
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.android_ai_shield_physical_validation == true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each label must identify a dedicated runner with the named phone
          # attached. Keeping labels distinct prevents matrix jobs from racing
          # over one USB target and makes OEM failures independently visible.
          - profile: pixel-android-14
            runner_label: android-physical-device-pixel
          - profile: samsung-android-13
            runner_label: android-physical-device-samsung
          - profile: motorola-android-12
            runner_label: android-physical-device-motorola
    # Hosted emulators are intentionally rejected by the focused test script.
    runs-on: [self-hosted, linux, x64, "${{ matrix.runner_label }}"]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ANDROID_AI_SHIELD_DEVICE_PROFILE: ${{ matrix.profile }}
      ANDROID_AI_SHIELD_OUTPUT_DIR: android/app/build/reports/android-ai-shield-device/${{ matrix.profile }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android
          path: artifacts/android

      - name: Download release instrumentation APK
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android-instrumentation
          path: artifacts/android-test

      - name: Run physical-device AI Shield switching checks
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/android-ai-shield-device-test.sh \
            --apk "$GITHUB_WORKSPACE/artifacts/android/app-release.apk" \
            --test-apk "$GITHUB_WORKSPACE/artifacts/android-test/app-release-androidTest.apk" \
            --profile "$ANDROID_AI_SHIELD_DEVICE_PROFILE" \
            --output "$GITHUB_WORKSPACE/$ANDROID_AI_SHIELD_OUTPUT_DIR"

      - name: Upload physical-device AI Shield evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Android-ai-shield-physical-evidence-${{ matrix.profile }}
          path: android/app/build/reports/android-ai-shield-device/${{ matrix.profile }}
          if-no-files-found: warn

  android-connectivity-physical:
    needs: build-android
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.android_connectivity_physical_validation == true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each label identifies a dedicated runner with the named phone
          # attached. Separate jobs prevent USB targets from racing and make
          # OEM-specific VPN ownership and WebView timing independently visible.
          - profile: pixel-android-14
            runner_label: android-physical-device-pixel
          - profile: samsung-android-13
            runner_label: android-physical-device-samsung
          - profile: motorola-android-12
            runner_label: android-physical-device-motorola
    # Hosted emulators are intentionally rejected by the focused test script.
    runs-on: [self-hosted, linux, x64, "${{ matrix.runner_label }}"]
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      ANDROID_SMOKE_CLERK_ORIGIN: ${{ secrets.AUTH_SMOKE_BASE_URL || 'https://safe-net-shield-official.replit.app' }}
      ANDROID_SMOKE_RESOLVER_MODE: public
      ANDROID_SMOKE_VALIDATION_MODE: real-device
      ANDROID_SMOKE_DEVICE_KIND: physical-device
      ANDROID_PHYSICAL_CONNECTIVITY_PROFILE: ${{ matrix.profile }}
      ANDROID_PHYSICAL_CONNECTIVITY_OUTPUT_DIR: android/app/build/reports/android-physical-connectivity/${{ matrix.profile }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android
          path: artifacts/android

      - name: Download release instrumentation APK
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android-instrumentation
          path: artifacts/android-test

      - name: Run signed physical-device connectivity recovery
        id: physical-connectivity-smoke
        continue-on-error: true
        shell: bash
        env:
          AUTH_SMOKE_STORAGE_STATE: ${{ secrets.AUTH_SMOKE_STORAGE_STATE }}
        run: |
          set -o pipefail
          ./scripts/android-physical-connectivity-test.sh \
            --apk "$GITHUB_WORKSPACE/artifacts/android/app-release.apk" \
            --test-apk "$GITHUB_WORKSPACE/artifacts/android-test/app-release-androidTest.apk" \
            --profile "$ANDROID_PHYSICAL_CONNECTIVITY_PROFILE" \
            --output "$GITHUB_WORKSPACE/$ANDROID_PHYSICAL_CONNECTIVITY_OUTPUT_DIR"

      - name: Publish physical-device connectivity summary
        if: always()
        shell: bash
        env:
          DEVICE_PROFILE: ${{ matrix.profile }}
          SMOKE_STEP_OUTCOME: ${{ steps.physical-connectivity-smoke.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          device_profile="${DEVICE_PROFILE:-latest}"
          evidence_dir="$GITHUB_WORKSPACE/android/app/build/reports/android-physical-connectivity/$device_profile"
          result_file="$evidence_dir/result.txt"
          result="$(awk -F= '$1 == "result" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          result="${result:-NOT_RECORDED}"
          device_profile="$(awk -F= '$1 == "device_profile" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          device_profile="${device_profile:-${DEVICE_PROFILE:-latest}}"
          profile_status="$(awk -F= '$1 == "profile_status" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          profile_status="${profile_status:-NOT_RECORDED}"
          failure_class="$(awk -F= '$1 == "failure_class" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          failure_class="${failure_class:-NOT_RECORDED}"
          failure_category="$(awk -F= '$1 == "failure_category" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          failure_category="${failure_category:-NOT_RECORDED}"
          connectivity_recovery="$(awk -F= '$1 == "connectivity_recovery" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          connectivity_recovery="${connectivity_recovery:-NOT_RECORDED}"
          dns_plain="$(awk -F= '$1 == "dns_plain" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          dns_plain="${dns_plain:-NOT_RECORDED}"
          dns_doh="$(awk -F= '$1 == "dns_doh" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          dns_doh="${dns_doh:-NOT_RECORDED}"
          dns_dot="$(awk -F= '$1 == "dns_dot" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          dns_dot="${dns_dot:-NOT_RECORDED}"
          wireguard_internet="$(awk -F= '$1 == "wireguard_internet" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          wireguard_internet="${wireguard_internet:-NOT_RECORDED}"
          vpn_handoff="$(awk -F= '$1 == "vpn_handoff" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          vpn_handoff="${vpn_handoff:-NOT_RECORDED}"
          ordinary_https="$(awk -F= '$1 == "ordinary_https" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          ordinary_https="${ordinary_https:-NOT_RECORDED}"
          application_apk_sha256="$(awk -F= '$1 == "application_apk_sha256" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          application_apk_sha256="${application_apk_sha256:-NOT_RECORDED}"
          device_evidence="$(awk -F= '$1 == "device_evidence" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          device_evidence="${device_evidence:-NOT_RECORDED}"
          gateway_handshake_observed="$(awk -F= '$1 == "gateway_handshake_observed" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          gateway_handshake_observed="${gateway_handshake_observed:-NOT_RECORDED}"
          physical_evidence="$(awk -F= '$1 == "physical_evidence" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          physical_evidence="${physical_evidence:-NOT_RECORDED}"
          wireguard_gateway_dns="$(awk -F= '$1 == "wireguard_gateway_dns" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          wireguard_gateway_dns="${wireguard_gateway_dns:-NOT_RECORDED}"
          wireguard_tunnel="$(awk -F= '$1 == "wireguard_tunnel" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          wireguard_tunnel="${wireguard_tunnel:-NOT_RECORDED}"
          wireguard_handshake="$(awk -F= '$1 == "wireguard_handshake" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          wireguard_handshake="${wireguard_handshake:-NOT_RECORDED}"
          wireguard_dns="$(awk -F= '$1 == "wireguard_dns" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          wireguard_dns="${wireguard_dns:-NOT_RECORDED}"
          wireguard_https="$(awk -F= '$1 == "wireguard_https" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          wireguard_https="${wireguard_https:-NOT_RECORDED}"
          wireguard_handoff="$(awk -F= '$1 == "wireguard_handoff" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          wireguard_handoff="${wireguard_handoff:-NOT_RECORDED}"
          wifi_to_mobile_handoff="$(awk -F= '$1 == "wifi_to_mobile_handoff" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          wifi_to_mobile_handoff="${wifi_to_mobile_handoff:-NOT_RECORDED}"
          mobile_to_wifi_handoff="$(awk -F= '$1 == "mobile_to_wifi_handoff" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          mobile_to_wifi_handoff="${mobile_to_wifi_handoff:-NOT_RECORDED}"
          wifi_to_mobile_failure_category="$(awk -F= '$1 == "wifi_to_mobile_failure_category" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          wifi_to_mobile_failure_category="${wifi_to_mobile_failure_category:-NOT_RECORDED}"
          mobile_to_wifi_failure_category="$(awk -F= '$1 == "mobile_to_wifi_failure_category" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          mobile_to_wifi_failure_category="${mobile_to_wifi_failure_category:-NOT_RECORDED}"
          wireguard_handoff_unavailable_category="$(awk -F= '$1 == "wireguard_handoff_unavailable_category" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          wireguard_handoff_unavailable_category="${wireguard_handoff_unavailable_category:-NOT_RECORDED}"
          dashboard_handoff="$(awk -F= '$1 == "dashboard_handoff" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          dashboard_handoff="${dashboard_handoff:-NOT_RECORDED}"
          wireguard_failure_category="$(awk -F= '$1 == "wireguard_failure_category" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          wireguard_failure_category="${wireguard_failure_category:-NOT_RECORDED}"
          wireguard_handshake_fixture="$(awk -F= '$1 == "wireguard_handshake_failure_fixture" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          wireguard_handshake_fixture="${wireguard_handshake_fixture:-NOT_RECORDED}"
          wireguard_route_fixture="$(awk -F= '$1 == "wireguard_route_failure_fixture" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          wireguard_route_fixture="${wireguard_route_fixture:-NOT_RECORDED}"
          wireguard_dns_fixture="$(awk -F= '$1 == "wireguard_dns_failure_fixture" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          wireguard_dns_fixture="${wireguard_dns_fixture:-NOT_RECORDED}"
          wireguard_nat_fixture="$(awk -F= '$1 == "wireguard_nat_failure_fixture" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          wireguard_nat_fixture="${wireguard_nat_fixture:-NOT_RECORDED}"
          {
            echo "## Physical Android connectivity and VPN verification"
            echo
            echo "- **Device profile:** \`$device_profile\` (\`$profile_status\`)"
            echo "- **Result:** \`$result\`"
            echo "- **Physical evidence:** \`$physical_evidence\` (device evidence: \`$device_evidence\`)"
            echo "- **Failure class:** \`$failure_class\`"
            echo "- **Failure category:** \`$failure_category\`"
            echo "- **Application APK SHA-256:** \`$application_apk_sha256\`"
            echo "- **Internet loss recovery:** \`$connectivity_recovery\`"
            echo "- **Plain DNS plus HTTPS:** \`$dns_plain\`"
            echo "- **DoH plus HTTPS:** \`$dns_doh\`"
            echo "- **DoT plus HTTPS:** \`$dns_dot\`"
            echo "- **Ordinary HTTPS across DNS modes:** \`$ordinary_https\`"
            echo "- **WireGuard tunnel transport and default route:** \`$wireguard_tunnel\`"
            echo "- **WireGuard gateway handshake:** \`$wireguard_handshake\`"
            echo "- **Gateway handshake observed:** \`$gateway_handshake_observed\`"
            echo "- **WireGuard gateway DNS response:** \`$wireguard_dns\`"
            echo "- **WireGuard ordinary HTTPS:** \`$wireguard_https\`"
            echo "- **WireGuard gateway DNS plus ordinary HTTPS:** \`$wireguard_internet\`"
            echo "- **WireGuard gateway DNS:** \`$wireguard_gateway_dns\`"
            echo "- **Wi-Fi to mobile WireGuard handoff:** \`$wifi_to_mobile_handoff\`"
            echo "- **Mobile to Wi-Fi WireGuard handoff:** \`$mobile_to_wifi_handoff\`"
            echo "- **WireGuard handoff overall:** \`$wireguard_handoff\`"
            echo "- **Wi-Fi to mobile failure category:** \`$wifi_to_mobile_failure_category\`"
            echo "- **Mobile to Wi-Fi failure category:** \`$mobile_to_wifi_failure_category\`"
            echo "- **Handoff unavailable category:** \`$wireguard_handoff_unavailable_category\`"
            echo "- **Dashboard WireGuard control:** \`$vpn_handoff\`"
            echo "- **Dashboard control evidence:** \`$dashboard_handoff\`"
            echo "- **WireGuard diagnostic category:** \`$wireguard_failure_category\`"
            echo "- **WireGuard handshake failure fixture:** \`$wireguard_handshake_fixture\`"
            echo "- **WireGuard route failure fixture:** \`$wireguard_route_fixture\`"
            echo "- **WireGuard DNS failure fixture:** \`$wireguard_dns_fixture\`"
            echo "- **WireGuard NAT failure fixture:** \`$wireguard_nat_fixture\`"
            echo "- **Smoke step:** \`$SMOKE_STEP_OUTCOME\`"
            echo "- **Workflow run:** [Open run]($RUN_URL)"
            echo "- **Evidence:** download the physical-device artifact from this run"
            echo
            echo "The artifact includes resolver-mode markers, WireGuard route/DNS/HTTPS diagnostics, Wi-Fi/mobile transition evidence, dashboard handoff evidence, Android network state, and logcat."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$failure_class" == "DEVICE_ACCESS" ]]; then
            echo "::warning::Physical-device recovery was blocked by runner/device access ($failure_category); this is not an application result."
          elif [[ "$result" != "PASS" ]]; then
            echo "::error::Physical-device recovery failed in the application smoke ($failure_category)."
            exit 1
          fi

      - name: Upload physical-device connectivity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Android-connectivity-physical-evidence-${{ matrix.profile }}
          path: android/app/build/reports/android-physical-connectivity/${{ matrix.profile }}
          if-no-files-found: warn

  android-internet-share-physical:
    needs: build-android
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.android_internet_share_physical_validation == true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each label identifies a dedicated runner with the named phone
          # attached. Separate jobs keep Wi-Fi Direct state isolated per OEM.
          - profile: pixel-android-14
            runner_label: android-physical-device-pixel
          - profile: samsung-android-13
            runner_label: android-physical-device-samsung
          - profile: motorola-android-12
            runner_label: android-physical-device-motorola
    runs-on: [self-hosted, linux, x64, "${{ matrix.runner_label }}"]
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ANDROID_INTERNET_SHARE_DEVICE_PROFILE: ${{ matrix.profile }}
      ANDROID_INTERNET_SHARE_CLIENT_SERIALS_INPUT: ${{ inputs.android_internet_share_client_serials }}
      ANDROID_INTERNET_SHARE_OUTPUT_DIR: android/app/build/reports/android-internet-share/${{ matrix.profile }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android
          path: artifacts/android

      - name: Download release instrumentation APK
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android-instrumentation
          path: artifacts/android-test

      - name: Run physical-device Internet Share proxy check
        id: internet-share-smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          client_serial="$(jq -r --arg profile "$ANDROID_INTERNET_SHARE_DEVICE_PROFILE" \
            '.[$profile] // empty' <<< "${ANDROID_INTERNET_SHARE_CLIENT_SERIALS_INPUT:-{}}" \
            2>/dev/null || true)"
          client_serial_args=()
          if [[ -n "$client_serial" ]]; then
            client_serial_args=(--client-serial "$client_serial")
          fi
          ./scripts/android-internet-share-device-test.sh \
            --apk "$GITHUB_WORKSPACE/artifacts/android/app-release.apk" \
            --test-apk "$GITHUB_WORKSPACE/artifacts/android-test/app-release-androidTest.apk" \
            --profile "$ANDROID_INTERNET_SHARE_DEVICE_PROFILE" \
            "${client_serial_args[@]}" \
            --output "$GITHUB_WORKSPACE/$ANDROID_INTERNET_SHARE_OUTPUT_DIR"

      - name: Publish Internet Share physical-device summary
        if: always()
        shell: bash
        env:
          DEVICE_PROFILE: ${{ matrix.profile }}
          SMOKE_STEP_OUTCOME: ${{ steps.internet-share-smoke.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          evidence_dir="$GITHUB_WORKSPACE/android/app/build/reports/android-internet-share/$DEVICE_PROFILE"
          result_file="$evidence_dir/result.txt"
          result="$(awk -F= '$1 == "result" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          result="${result:-NOT_RECORDED}"
          profile_status="$(awk -F= '$1 == "profile_status" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          profile_status="${profile_status:-NOT_RECORDED}"
          apk_sha256="$(awk -F= '$1 == "application_apk_sha256" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          apk_sha256="${apk_sha256:-NOT_RECORDED}"
          instrumentation_apk_sha256="$(awk -F= '$1 == "instrumentation_apk_sha256" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          instrumentation_apk_sha256="${instrumentation_apk_sha256:-NOT_RECORDED}"
          failure_class="$(awk -F= '$1 == "failure_class" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          failure_class="${failure_class:-NOT_RECORDED}"
          failure_category="$(awk -F= '$1 == "failure_category" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          failure_category="${failure_category:-NOT_RECORDED}"
          message="$(awk -F= '$1 == "message" { print substr($0, index($0, "=") + 1); exit }' "$result_file" 2>/dev/null || true)"
          message="${message:-NOT_RECORDED}"
          client_target="$(awk -F= '$1 == "client_target" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          client_target="${client_target:-NOT_RECORDED}"
          start_result="$(awk -F= '$1 == "start_result" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          start_result="${start_result:-NOT_RECORDED}"
          start_outcome="$(awk -F= '$1 == "start_outcome" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          start_outcome="${start_outcome:-NOT_RECORDED}"
          stop_result="$(awk -F= '$1 == "stop_result" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          stop_result="${stop_result:-NOT_RECORDED}"
          notification_cleanup="$(awk -F= '$1 == "notification_cleanup" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          notification_cleanup="${notification_cleanup:-NOT_RECORDED}"
          group_cleanup="$(awk -F= '$1 == "wifi_direct_group_cleanup" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          group_cleanup="${group_cleanup:-NOT_RECORDED}"
          client_connection="$(awk -F= '$1 == "client_connection" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          client_connection="${client_connection:-NOT_RECORDED}"
          proxy_configuration="$(awk -F= '$1 == "proxy_configuration" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          proxy_configuration="${proxy_configuration:-NOT_RECORDED}"
          proxy_https_response="$(awk -F= '$1 == "proxy_https_response" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          proxy_https_response="${proxy_https_response:-NOT_RECORDED}"
          proxy_http_diagnostic="$(awk -F= '$1 == "proxy_http_diagnostic" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          proxy_http_diagnostic="${proxy_http_diagnostic:-NOT_RECORDED}"
          client_proxy_cleanup="$(awk -F= '$1 == "client_proxy_cleanup" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          client_proxy_cleanup="${client_proxy_cleanup:-NOT_RECORDED}"
          client_wifi_cleanup="$(awk -F= '$1 == "client_wifi_cleanup" { print $2; exit }' "$result_file" 2>/dev/null || true)"
          client_wifi_cleanup="${client_wifi_cleanup:-NOT_RECORDED}"
          {
            echo "## Physical Android Internet Share verification"
            echo
            echo "- **Device profile:** \`$DEVICE_PROFILE\` (\`$profile_status\`)"
            echo "- **Result:** \`$result\`"
            echo "- **Failure classification:** \`$failure_class\` / \`$failure_category\`"
            echo "- **Details:** \`$message\`"
            echo "- **Signed application APK SHA-256:** \`$apk_sha256\`"
            echo "- **Signed instrumentation APK SHA-256:** \`$instrumentation_apk_sha256\`"
            echo "- **Start result:** \`$start_result\` (\`$start_outcome\`)"
            echo "- **Stop result:** \`$stop_result\`"
            echo "- **Foreground notification cleanup:** \`$notification_cleanup\`"
            echo "- **Wi-Fi Direct group cleanup:** \`$group_cleanup\`"
            echo "- **Client target:** \`$client_target\`"
            echo "- **Client connection:** \`$client_connection\`"
            echo "- **Proxy configuration:** \`$proxy_configuration\`"
            echo "- **HTTPS proxy response:** \`$proxy_https_response\`"
            echo "- **HTTP diagnostic response:** \`$proxy_http_diagnostic\`"
            echo "- **Client cleanup:** proxy \`$client_proxy_cleanup\`; Wi-Fi \`$client_wifi_cleanup\`"
            echo "- **Smoke step:** \`$SMOKE_STEP_OUTCOME\`"
            echo "- **Workflow run:** [Open run]($RUN_URL)"
            echo "- **Evidence:** download the physical-device artifact from this run"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$failure_class" == "DEVICE_ACCESS" ]]; then
            echo "::warning::Physical-device Internet Share validation was blocked by host/client access ($failure_category); this is not an application result."
          elif [[ "$result" != "PASS" ]]; then
            echo "::error::Physical-device Internet Share lifecycle check did not pass ($result; $failure_category)."
            exit 1
          fi

      - name: Upload physical-device Internet Share evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Android-internet-share-physical-evidence-${{ matrix.profile }}
          path: android/app/build/reports/android-internet-share/${{ matrix.profile }}
          if-no-files-found: warn

  release:
    needs: [build-android, android-release-smoke]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-android.result == 'success' &&
      (needs.android-release-smoke.result == 'success' ||
      needs.android-release-smoke.result == 'failure')
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android
          path: artifacts/android

      - name: Download Android instrumentation artifact
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android-instrumentation
          path: artifacts/android-test

      - name: Download Android smoke evidence
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android-smoke-evidence-release
          path: artifacts/android-smoke-evidence

      - name: Resolve expected Android release metadata
        id: android_release_metadata
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${GITHUB_REF_NAME#v}"
          if [[ -z "$expected_version" ]]; then
            echo 'Could not resolve the release version from GITHUB_REF_NAME.' >&2
            exit 1
          fi
          bash scripts/resolve-android-release-metadata.sh \
            --expected-version "$expected_version" \
            --expected-label tag \
            --mismatch-prefix "Release version mismatch" \
            --output "$GITHUB_OUTPUT"

      - name: Verify Android release APKs
        id: verify-android-release-apks
        shell: bash
        env:
          ANDROID_VERSION_NAME: ${{ steps.android_release_metadata.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.android_release_metadata.outputs.version_code }}
        run: |
          set -euo pipefail

          apk="artifacts/android/app-release.apk"
          test_apk="artifacts/android-test/app-release-androidTest.apk"
          checksum_file="artifacts/android/app-release.apk.sha256"
          test_checksum_file="artifacts/android-test/app-release-androidTest.apk.sha256"
          apk_count=$(find artifacts/android -maxdepth 1 -type f -name 'app-release.apk' | wc -l)
          test_apk_count=$(find artifacts/android-test -maxdepth 1 -type f -name 'app-release-androidTest.apk' | wc -l)

          if [[ "$apk_count" -eq 0 ]]; then
            echo "::error::Android APK installer is missing from artifacts/android"
            exit 1
          fi
          if [[ "$test_apk_count" -eq 0 ]]; then
            echo "::error::Android instrumentation APK is missing from artifacts/android-test"
            exit 1
          fi

          test "$apk_count" -eq 1
          test -s "$apk"
          test "$test_apk_count" -eq 1
          test -s "$test_apk"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -n 1)"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -perm -u+x | sort -V | tail -n 1)"
          test -n "$apksigner"
          test -n "$aapt"
          "$apksigner" verify --verbose "$apk"
          "$apksigner" verify --verbose "$test_apk"

          require_badging() {
            local artifact="$1"
            local expected="$2"
            local description="$3"
            local badging

            badging="$("$aapt" dump badging "$artifact")"
            if ! grep -Fq "$expected" <<< "$badging"; then
              echo "::error::$description metadata mismatch. Expected badging: $expected"
              printf 'Actual badging for %s:\n%s\n' "$artifact" "$badging" >&2
              exit 1
            fi
          }

          require_badging \
            "$apk" \
            "package: name='com.safenet.dns' versionCode='$ANDROID_VERSION_CODE' versionName='$ANDROID_VERSION_NAME'" \
            "Android application APK"
          require_badging \
            "$test_apk" \
            "package: name='com.safenet.dns.test'" \
            "Android instrumentation APK package"

          checksum="$(sha256sum "$apk" | cut -d ' ' -f1)"
          test_checksum="$(sha256sum "$test_apk" | cut -d ' ' -f1)"
          printf '%s  app-release.apk\n' "$checksum" > "$checksum_file"
          printf '%s  app-release-androidTest.apk\n' "$test_checksum" > "$test_checksum_file"
          (
            cd artifacts/android
            sha256sum --check app-release.apk.sha256
          )
          (
            cd artifacts/android-test
            sha256sum --check app-release-androidTest.apk.sha256
          )
          unzip -l "$apk" | grep -F "assets/public/"
          echo "Verified $apk_count signed Android APK installer with versionCode $ANDROID_VERSION_CODE, versionName $ANDROID_VERSION_NAME, and SHA-256 $checksum."
          echo "Verified signed Android instrumentation APK with SHA-256 $test_checksum."

      - name: Resolve matching physical WireGuard evidence
        id: resolve-physical-wireguard-evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_ARTIFACT_URL: ${{ needs.build-android.outputs.android_apk_artifact_url || format('{0}/{1}/actions/runs/{2}#artifacts', github.server_url, github.repository, github.run_id) }}
        run: |
          set -uo pipefail

          release_dir="artifacts/release"
          evidence_dir="artifacts/android-physical-evidence"
          report="$release_dir/SafeNet-DNS-Android-physical-verification.txt"
          report_checksum="$release_dir/SafeNet-DNS-Android-physical-verification.sha256"
          mkdir -p "$release_dir"
          rm -rf "$evidence_dir"

          status="BLOCKED"
          blocker="PHYSICAL_RUN_MISSING"
          evidence_run_id="NONE"
          evidence_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/build.yml?query=workflow_dispatch"
          signed_apk_sha256="NOT_RECORDED"
          if [[ -s artifacts/android/app-release.apk ]]; then
            signed_apk_sha256="$(sha256sum artifacts/android/app-release.apk | awk '{ print $1 }')"
          fi

          run_json="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow build.yml \
            --event workflow_dispatch \
            --commit "$GITHUB_SHA" \
            --status completed \
            --json databaseId,url,headSha,headBranch \
            --limit 20 2>/dev/null || printf '[]')"
          evidence_run_id="$(jq -r --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF_NAME" \
            'map(select(.headSha == $sha and .headBranch == $ref))[0].databaseId // empty' <<< "$run_json" 2>/dev/null || true)"
          evidence_run_url="$(jq -r --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF_NAME" \
            'map(select(.headSha == $sha and .headBranch == $ref))[0].url // empty' <<< "$run_json" 2>/dev/null || true)"
          if [[ -z "$evidence_run_id" ]]; then
            evidence_run_id="NONE"
            evidence_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/build.yml?query=workflow_dispatch"
          elif [[ -z "$evidence_run_url" ]]; then
            evidence_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$evidence_run_id"
          fi

          blockers=()
          if [[ "$evidence_run_id" != "NONE" ]]; then
            if ! gh run download "$evidence_run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'SafeNet-DNS-Android-connectivity-physical-evidence-*' \
              --dir "$evidence_dir" >/dev/null 2>&1; then
              blockers+=("PHYSICAL_EVIDENCE_DOWNLOAD_FAILED")
            fi
          else
            blockers+=("PHYSICAL_RUN_MISSING")
          fi

          profiles=(pixel-android-14 samsung-android-13 motorola-android-12)
          for profile in "${profiles[@]}"; do
            profile_result="$(find "$evidence_dir" -type f -name result.txt -print 2>/dev/null | grep -F "$profile" | head -n 1 || true)"
            if [[ -z "$profile_result" ]]; then
              blockers+=("DEVICE_EVIDENCE_MISSING_${profile}")
              continue
            fi

            profile_result_value="$(awk -F= '$1 == "result" { print $2; exit }' "$profile_result" 2>/dev/null || true)"
            profile_failure_class="$(awk -F= '$1 == "failure_class" { print $2; exit }' "$profile_result" 2>/dev/null || true)"
            profile_failure_category="$(awk -F= '$1 == "failure_category" { print $2; exit }' "$profile_result" 2>/dev/null || true)"
            profile_apk_sha256="$(awk -F= '$1 == "application_apk_sha256" { print $2; exit }' "$profile_result" 2>/dev/null || true)"
            profile_device_evidence="$(awk -F= '$1 == "device_evidence" { print $2; exit }' "$profile_result" 2>/dev/null || true)"
            profile_physical_evidence="$(awk -F= '$1 == "physical_evidence" { print $2; exit }' "$profile_result" 2>/dev/null || true)"
            profile_handshake="$(awk -F= '$1 == "gateway_handshake_observed" { print $2; exit }' "$profile_result" 2>/dev/null || true)"
            profile_wireguard="$(awk -F= '$1 == "wireguard_internet" { print $2; exit }' "$profile_result" 2>/dev/null || true)"

            if [[ "$signed_apk_sha256" == "NOT_RECORDED" ||
              "$profile_apk_sha256" != "$signed_apk_sha256" ]]; then
              blockers+=("APK_EVIDENCE_MISMATCH_${profile}")
            fi
            if [[ "$profile_device_evidence" != "PASS" ||
              "$profile_physical_evidence" != "PASS" ]]; then
              blockers+=("DEVICE_EVIDENCE_MISSING_${profile}")
            elif [[ "$profile_result_value" != "PASS" ]]; then
              if [[ "$profile_failure_class" == "DEVICE_ACCESS" ]]; then
                blockers+=("RUNNER_OR_DEVICE_UNAVAILABLE_${profile}")
              elif [[ "$profile_handshake" != "PASS" ]]; then
                blockers+=("GATEWAY_HANDSHAKE_NOT_OBSERVED_${profile}")
              else
                case "$profile_failure_category" in
                  HANDSHAKE|GATEWAY_CONNECTIVITY|ROUTE|DNS|NAT)
                    blockers+=("WIREGUARD_${profile_failure_category}_${profile}")
                    ;;
                  *)
                    blockers+=("PHYSICAL_SMOKE_FAILED_${profile}")
                    ;;
                esac
              fi
            elif [[ "$profile_handshake" != "PASS" || "$profile_wireguard" != "PASS" ]]; then
              blockers+=("GATEWAY_HANDSHAKE_NOT_OBSERVED_${profile}")
            fi
          done

          if [[ "${#blockers[@]}" -eq 0 ]]; then
            status="PASS"
            blocker="NONE"
          else
            IFS=,
            blocker="${blockers[*]}"
          fi

          {
            echo "evidence_schema_version=1"
            echo "release_ref=$GITHUB_REF_NAME"
            echo "release_sha=$GITHUB_SHA"
            echo "signed_apk_sha256=$signed_apk_sha256"
            echo "signed_apk_artifact_url=${APK_ARTIFACT_URL:-unavailable}"
            echo "physical_evidence_run_id=$evidence_run_id"
            echo "physical_evidence_run_url=$evidence_run_url"
            echo "verification_status=$status"
            echo "verification_blocker=$blocker"
          } > "$report"
          printf '%s  %s\n' \
            "$(sha256sum "$report" | awk '{ print $1 }')" \
            "$(basename "$report")" > "$report_checksum"
          {
            echo "status=$status"
            echo "blocker=$blocker"
            echo "run_id=$evidence_run_id"
            echo "run_url=$evidence_run_url"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve matching physical Internet Share evidence
        id: resolve-physical-internet-share-evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_ARTIFACT_URL: ${{ needs.build-android.outputs.android_apk_artifact_url || format('{0}/{1}/actions/runs/{2}#artifacts', github.server_url, github.repository, github.run_id) }}
        run: |
          set -uo pipefail

          release_dir="artifacts/release"
          evidence_dir="artifacts/android-internet-share-physical-evidence"
          report="$release_dir/SafeNet-DNS-Android-internet-share-verification.txt"
          report_checksum="$release_dir/SafeNet-DNS-Android-internet-share-verification.sha256"
          mkdir -p "$release_dir"
          rm -rf "$evidence_dir"

          status="BLOCKED"
          blocker="INTERNET_SHARE_RUN_MISSING"
          evidence_run_id="NONE"
          evidence_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/build.yml?query=workflow_dispatch"
          signed_apk_sha256="NOT_RECORDED"
          signed_instrumentation_apk_sha256="NOT_RECORDED"
          if [[ -s artifacts/android/app-release.apk ]]; then
            signed_apk_sha256="$(sha256sum artifacts/android/app-release.apk | awk '{ print $1 }')"
          fi
          if [[ -s artifacts/android-test/app-release-androidTest.apk ]]; then
            signed_instrumentation_apk_sha256="$(sha256sum artifacts/android-test/app-release-androidTest.apk | awk '{ print $1 }')"
          fi

          run_json="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow build.yml \
            --event workflow_dispatch \
            --commit "$GITHUB_SHA" \
            --status completed \
            --json databaseId,url,headSha,headBranch,createdAt \
            --limit 20 2>/dev/null || printf '[]')"
          evidence_run_id="$(jq -r --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF_NAME" \
            'map(select(.headSha == $sha and .headBranch == $ref)) | sort_by(.createdAt) | reverse | .[0].databaseId // empty' <<< "$run_json" 2>/dev/null || true)"
          evidence_run_url="$(jq -r --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF_NAME" \
            'map(select(.headSha == $sha and .headBranch == $ref)) | sort_by(.createdAt) | reverse | .[0].url // empty' <<< "$run_json" 2>/dev/null || true)"
          if [[ -z "$evidence_run_id" ]]; then
            evidence_run_id="NONE"
            evidence_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/build.yml?query=workflow_dispatch"
          elif [[ -z "$evidence_run_url" ]]; then
            evidence_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$evidence_run_id"
          fi

          blockers=()
          if [[ "$evidence_run_id" != "NONE" ]]; then
            if ! gh run download "$evidence_run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'SafeNet-DNS-Android-internet-share-physical-evidence-*' \
              --dir "$evidence_dir" >/dev/null 2>&1; then
              blockers+=("INTERNET_SHARE_EVIDENCE_DOWNLOAD_FAILED")
            fi
          else
            blockers+=("INTERNET_SHARE_RUN_MISSING")
          fi

          profiles=(pixel-android-14 samsung-android-13 motorola-android-12)
          profile_index=0
          for profile in "${profiles[@]}"; do
            profile_index=$((profile_index + 1))
            profile_result="$(find "$evidence_dir" -type f -name result.txt -print 2>/dev/null | grep -F "$profile" | head -n 1 || true)"
            profile_result_value="NOT_RECORDED"
            profile_device_profile="$profile"
            profile_status="NOT_RECORDED"
            profile_apk_sha256="NOT_RECORDED"
            profile_instrumentation_apk_sha256="NOT_RECORDED"
            profile_device_evidence="NOT_RECORDED"
            profile_physical_evidence="NOT_RECORDED"
            profile_failure_class="NOT_RECORDED"
            profile_failure_category="NOT_RECORDED"
            profile_message="NOT_RECORDED"
            profile_start_result="NOT_RECORDED"
            profile_start_outcome="NOT_RECORDED"
            profile_stop_result="NOT_RECORDED"
            profile_notification_cleanup="NOT_RECORDED"
            profile_group_cleanup="NOT_RECORDED"
             profile_client_connection="NOT_RECORDED"
             profile_proxy_configuration="NOT_RECORDED"
             profile_proxy_response="NOT_RECORDED"
             profile_proxy_https_response="NOT_RECORDED"
             profile_proxy_http_diagnostic="NOT_RECORDED"
             profile_client_proxy_cleanup="NOT_RECORDED"
             profile_client_wifi_cleanup="NOT_RECORDED"
            profile_cleanup_result="NOT_RECORDED"

            if [[ -n "$profile_result" ]]; then
              read_result() {
                awk -F= -v key="$1" '$1 == key { print substr($0, index($0, "=") + 1); exit }' \
                  "$profile_result" 2>/dev/null || true
              }
              profile_result_value="$(read_result result)"
              profile_device_profile="$(read_result device_profile)"
              profile_status="$(read_result profile_status)"
              profile_apk_sha256="$(read_result application_apk_sha256)"
              profile_instrumentation_apk_sha256="$(read_result instrumentation_apk_sha256)"
              profile_device_evidence="$(read_result device_evidence)"
              profile_physical_evidence="$(read_result physical_evidence)"
              profile_failure_class="$(read_result failure_class)"
              profile_failure_category="$(read_result failure_category)"
              profile_message="$(read_result message)"
              profile_start_result="$(read_result start_result)"
              profile_start_outcome="$(read_result start_outcome)"
              profile_stop_result="$(read_result stop_result)"
              profile_notification_cleanup="$(read_result notification_cleanup)"
              profile_group_cleanup="$(read_result wifi_direct_group_cleanup)"
               profile_client_connection="$(read_result client_connection)"
               profile_proxy_configuration="$(read_result proxy_configuration)"
               profile_proxy_response="$(read_result proxy_response)"
                profile_proxy_https_response="$(read_result proxy_https_response)"
                profile_proxy_http_diagnostic="$(read_result proxy_http_diagnostic)"
               profile_client_proxy_cleanup="$(read_result client_proxy_cleanup)"
               profile_client_wifi_cleanup="$(read_result client_wifi_cleanup)"
              if [[ "$profile_stop_result" == "PASS" &&
                "$profile_notification_cleanup" == "PASS" &&
                 "$profile_group_cleanup" == "PASS" &&
                 "$profile_client_proxy_cleanup" == "PASS" &&
                 "$profile_client_wifi_cleanup" == "PASS" ]]; then
                profile_cleanup_result="PASS"
              elif [[ "$profile_stop_result" != "NOT_RECORDED" ||
                "$profile_notification_cleanup" != "NOT_RECORDED" ||
                 "$profile_group_cleanup" != "NOT_RECORDED" ||
                 "$profile_client_proxy_cleanup" != "NOT_RECORDED" ||
                 "$profile_client_wifi_cleanup" != "NOT_RECORDED" ]]; then
                profile_cleanup_result="FAIL"
              fi
            else
              blockers+=("INTERNET_SHARE_DEVICE_EVIDENCE_MISSING_${profile}")
            fi

            if [[ "$profile_device_profile" != "$profile" ]]; then
              blockers+=("INTERNET_SHARE_DEVICE_PROFILE_MISMATCH_${profile}")
            fi
            if [[ "$signed_apk_sha256" == "NOT_RECORDED" ||
              "$profile_apk_sha256" != "$signed_apk_sha256" ]]; then
              blockers+=("INTERNET_SHARE_APK_EVIDENCE_MISMATCH_${profile}")
            fi
            if [[ "$signed_instrumentation_apk_sha256" == "NOT_RECORDED" ||
              "$profile_instrumentation_apk_sha256" != "$signed_instrumentation_apk_sha256" ]]; then
              blockers+=("INTERNET_SHARE_INSTRUMENTATION_APK_EVIDENCE_MISMATCH_${profile}")
            fi
            if [[ "$profile_device_evidence" != "PASS" ||
              "$profile_physical_evidence" != "PASS" ]]; then
              blockers+=("INTERNET_SHARE_DEVICE_EVIDENCE_INVALID_${profile}")
            fi
            if [[ "$profile_start_result" != "PASS" ||
              "$profile_start_outcome" == "NOT_RECORDED" ]]; then
              blockers+=("INTERNET_SHARE_START_NOT_CONFIRMED_${profile}")
            fi
            if [[ "$profile_cleanup_result" != "PASS" ]]; then
              blockers+=("INTERNET_SHARE_CLEANUP_NOT_CONFIRMED_${profile}")
            fi
             if [[ "$profile_client_connection" != "PASS" ]]; then
               blockers+=("INTERNET_SHARE_CLIENT_CONNECTION_NOT_CONFIRMED_${profile}")
             fi
              if [[ "$profile_proxy_configuration" != "PASS" ||
                "$profile_proxy_https_response" != "PASS" ]]; then
               blockers+=("INTERNET_SHARE_PROXY_REQUEST_NOT_CONFIRMED_${profile}")
             fi
            if [[ "$profile_result_value" != "PASS" ]]; then
              blockers+=("INTERNET_SHARE_PROXY_CHECK_FAILED_${profile}")
            fi

            {
              echo "profile_${profile_index}_name=$profile"
              echo "profile_${profile_index}_device_profile=$profile_device_profile"
              echo "profile_${profile_index}_profile_status=${profile_status:-NOT_RECORDED}"
              echo "profile_${profile_index}_result=$profile_result_value"
              echo "profile_${profile_index}_application_apk_sha256=${profile_apk_sha256:-NOT_RECORDED}"
              echo "profile_${profile_index}_instrumentation_apk_sha256=${profile_instrumentation_apk_sha256:-NOT_RECORDED}"
              echo "profile_${profile_index}_failure_class=${profile_failure_class:-NOT_RECORDED}"
              echo "profile_${profile_index}_failure_category=${profile_failure_category:-NOT_RECORDED}"
              echo "profile_${profile_index}_message=${profile_message:-NOT_RECORDED}"
              echo "profile_${profile_index}_start_result=${profile_start_result:-NOT_RECORDED}"
              echo "profile_${profile_index}_start_outcome=${profile_start_outcome:-NOT_RECORDED}"
              echo "profile_${profile_index}_stop_result=${profile_stop_result:-NOT_RECORDED}"
              echo "profile_${profile_index}_notification_cleanup=${profile_notification_cleanup:-NOT_RECORDED}"
              echo "profile_${profile_index}_wifi_direct_group_cleanup=${profile_group_cleanup:-NOT_RECORDED}"
               echo "profile_${profile_index}_client_connection=${profile_client_connection:-NOT_RECORDED}"
               echo "profile_${profile_index}_proxy_configuration=${profile_proxy_configuration:-NOT_RECORDED}"
               echo "profile_${profile_index}_proxy_response=${profile_proxy_response:-NOT_RECORDED}"
                echo "profile_${profile_index}_proxy_https_response=${profile_proxy_https_response:-NOT_RECORDED}"
                echo "profile_${profile_index}_proxy_http_diagnostic=${profile_proxy_http_diagnostic:-NOT_RECORDED}"
               echo "profile_${profile_index}_client_proxy_cleanup=${profile_client_proxy_cleanup:-NOT_RECORDED}"
               echo "profile_${profile_index}_client_wifi_cleanup=${profile_client_wifi_cleanup:-NOT_RECORDED}"
              echo "profile_${profile_index}_cleanup_result=$profile_cleanup_result"
            } >> "$report.profiles"
          done

          if [[ "${#blockers[@]}" -eq 0 ]]; then
            status="PASS"
            blocker="NONE"
          else
            IFS=,
            blocker="${blockers[*]}"
          fi

          {
            echo "evidence_schema_version=1"
            echo "release_ref=$GITHUB_REF_NAME"
            echo "release_sha=$GITHUB_SHA"
            echo "signed_apk_sha256=$signed_apk_sha256"
            echo "signed_instrumentation_apk_sha256=$signed_instrumentation_apk_sha256"
            echo "signed_apk_artifact_url=${APK_ARTIFACT_URL:-unavailable}"
            echo "internet_share_evidence_run_id=$evidence_run_id"
            echo "internet_share_evidence_run_url=$evidence_run_url"
            echo "verification_status=$status"
            echo "verification_blocker=$blocker"
            echo "profile_count=${#profiles[@]}"
            cat "$report.profiles"
          } > "$report"
          rm -f "$report.profiles"
          printf '%s  %s\n' \
            "$(sha256sum "$report" | awk '{ print $1 }')" \
            "$(basename "$report")" > "$report_checksum"
          {
            echo "status=$status"
            echo "blocker=$blocker"
            echo "run_id=$evidence_run_id"
            echo "run_url=$evidence_run_url"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Android release summary
        if: always()
        shell: bash
        env:
          ANDROID_VERSION_NAME: ${{ steps.android_release_metadata.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.android_release_metadata.outputs.version_code }}
          APK_VERIFICATION_OUTCOME: ${{ steps.verify-android-release-apks.outcome }}
          APK_ARTIFACT_URL: ${{ needs.build-android.outputs.android_apk_artifact_url || format('{0}/{1}/actions/runs/{2}#artifacts', github.server_url, github.repository, github.run_id) }}
          INSTRUMENTATION_VERIFICATION_OUTCOME: ${{ steps.verify-android-release-apks.outcome }}
          INSTRUMENTATION_ARTIFACT_URL: ${{ needs.build-android.outputs.android_instrumentation_artifact_url || format('{0}/{1}/actions/runs/{2}#artifacts', github.server_url, github.repository, github.run_id) }}
          PHYSICAL_VERIFICATION_STATUS: ${{ steps.resolve-physical-wireguard-evidence.outputs.status || 'BLOCKED' }}
          PHYSICAL_VERIFICATION_BLOCKER: ${{ steps.resolve-physical-wireguard-evidence.outputs.blocker || 'PHYSICAL_RUN_MISSING' }}
          PHYSICAL_EVIDENCE_RUN_URL: ${{ steps.resolve-physical-wireguard-evidence.outputs.run_url || format('{0}/{1}/actions/workflows/build.yml?query=workflow_dispatch', github.server_url, github.repository) }}
          INTERNET_SHARE_VERIFICATION_STATUS: ${{ steps.resolve-physical-internet-share-evidence.outputs.status || 'BLOCKED' }}
          INTERNET_SHARE_VERIFICATION_BLOCKER: ${{ steps.resolve-physical-internet-share-evidence.outputs.blocker || 'INTERNET_SHARE_RUN_MISSING' }}
          INTERNET_SHARE_EVIDENCE_RUN_URL: ${{ steps.resolve-physical-internet-share-evidence.outputs.run_url || format('{0}/{1}/actions/workflows/build.yml?query=workflow_dispatch', github.server_url, github.repository) }}
        run: |
          set -euo pipefail
          version_name="${ANDROID_VERSION_NAME:-unresolved}"
          version_code="${ANDROID_VERSION_CODE:-unresolved}"
          apk_outcome="${APK_VERIFICATION_OUTCOME:-unavailable}"
          instrumentation_outcome="${INSTRUMENTATION_VERIFICATION_OUTCOME:-unavailable}"
          apk_url="${APK_ARTIFACT_URL:-unavailable}"
          instrumentation_url="${INSTRUMENTATION_ARTIFACT_URL:-unavailable}"
          physical_status="${PHYSICAL_VERIFICATION_STATUS:-BLOCKED}"
          physical_blocker="${PHYSICAL_VERIFICATION_BLOCKER:-PHYSICAL_RUN_MISSING}"
          physical_run_url="${PHYSICAL_EVIDENCE_RUN_URL:-unavailable}"
          internet_share_status="${INTERNET_SHARE_VERIFICATION_STATUS:-BLOCKED}"
          internet_share_blocker="${INTERNET_SHARE_VERIFICATION_BLOCKER:-INTERNET_SHARE_RUN_MISSING}"
          internet_share_run_url="${INTERNET_SHARE_EVIDENCE_RUN_URL:-unavailable}"
          internet_share_report="artifacts/release/SafeNet-DNS-Android-internet-share-verification.txt"
          {
            echo "## Android release verification"
            echo
            echo "- **Resolved versionName:** \`$version_name\`"
            echo "- **Resolved versionCode:** \`$version_code\`"
            echo "- **Expected application package:** \`com.safenet.dns\`"
            echo "- **Signed application APK verification:** \`$apk_outcome\` ([preserved APK artifact]($apk_url))"
            echo "- **Signed instrumentation APK verification:** \`$instrumentation_outcome\` ([preserved instrumentation artifact]($instrumentation_url))"
            echo "- **Physical WireGuard verification:** \`$physical_status\` (blocker: \`$physical_blocker\`; [matching physical evidence run]($physical_run_url))"
            echo "- **Physical Internet Share verification:** \`$internet_share_status\` (blocker: \`$internet_share_blocker\`; [matching physical evidence run]($internet_share_run_url))"
            if [[ -s "$internet_share_report" ]]; then
              signed_apk_sha256="$(awk -F= '$1 == "signed_apk_sha256" { print substr($0, index($0, "=") + 1); exit }' "$internet_share_report")"
              signed_instrumentation_apk_sha256="$(awk -F= '$1 == "signed_instrumentation_apk_sha256" { print substr($0, index($0, "=") + 1); exit }' "$internet_share_report")"
              profile_count="$(awk -F= '$1 == "profile_count" { print $2; exit }' "$internet_share_report")"
              for ((profile_index = 1; profile_index <= profile_count; profile_index++)); do
                profile_name="$(awk -F= -v key="profile_${profile_index}_name" '$1 == key { print substr($0, index($0, "=") + 1); exit }' "$internet_share_report")"
                profile_digest="$(awk -F= -v key="profile_${profile_index}_application_apk_sha256" '$1 == key { print substr($0, index($0, "=") + 1); exit }' "$internet_share_report")"
                profile_instrumentation_digest="$(awk -F= -v key="profile_${profile_index}_instrumentation_apk_sha256" '$1 == key { print substr($0, index($0, "=") + 1); exit }' "$internet_share_report")"
                profile_failure_class="$(awk -F= -v key="profile_${profile_index}_failure_class" '$1 == key { print substr($0, index($0, "=") + 1); exit }' "$internet_share_report")"
                profile_failure_category="$(awk -F= -v key="profile_${profile_index}_failure_category" '$1 == key { print substr($0, index($0, "=") + 1); exit }' "$internet_share_report")"
                profile_start="$(awk -F= -v key="profile_${profile_index}_start_result" '$1 == key { print substr($0, index($0, "=") + 1); exit }' "$internet_share_report")"
                profile_start_outcome="$(awk -F= -v key="profile_${profile_index}_start_outcome" '$1 == key { print substr($0, index($0, "=") + 1); exit }' "$internet_share_report")"
                profile_cleanup="$(awk -F= -v key="profile_${profile_index}_cleanup_result" '$1 == key { print substr($0, index($0, "=") + 1); exit }' "$internet_share_report")"
                 profile_client="$(awk -F= -v key="profile_${profile_index}_client_connection" '$1 == key { print substr($0, index($0, "=") + 1); exit }' "$internet_share_report")"
                 profile_proxy_config="$(awk -F= -v key="profile_${profile_index}_proxy_configuration" '$1 == key { print substr($0, index($0, "=") + 1); exit }' "$internet_share_report")"
                  profile_proxy_https_response="$(awk -F= -v key="profile_${profile_index}_proxy_https_response" '$1 == key { print substr($0, index($0, "=") + 1); exit }' "$internet_share_report")"
                  profile_proxy_http_diagnostic="$(awk -F= -v key="profile_${profile_index}_proxy_http_diagnostic" '$1 == key { print substr($0, index($0, "=") + 1); exit }' "$internet_share_report")"
                  echo "- **Internet Share $profile_name:** failure \`$profile_failure_class/$profile_failure_category\`; signed APK SHA-256 \`$profile_digest\`; instrumentation SHA-256 \`$profile_instrumentation_digest\`; start \`$profile_start\` (\`$profile_start_outcome\`); client \`$profile_client\`; proxy \`$profile_proxy_config\`; HTTPS \`$profile_proxy_https_response\`; HTTP diagnostic \`$profile_proxy_http_diagnostic\`; cleanup \`$profile_cleanup\`"
              done
              echo "- **Internet Share signed APK SHA-256:** \`$signed_apk_sha256\`"
              echo "- **Internet Share signed instrumentation APK SHA-256:** \`$signed_instrumentation_apk_sha256\`"
            fi
            echo "- **Release claim boundary:** a signed APK is not physically verified unless the matching run reports a real device and observed gateway handshake."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish hosted-only release assurance scope
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Release assurance scope"
            echo
            echo "- **Hosted Android smoke validation:** completed and its evidence is preserved with this release."
            echo "- **Signed APK and instrumentation APK:** independently verified before publication."
            echo "- **Physical WireGuard validation:** reported separately; missing runner, gateway handshake, or device evidence is a bounded blocker and does not prevent APK publication."
            echo "- **Physical Internet Share validation:** reported separately; missing runner, client/proxy evidence, or signed APK match is a bounded blocker and does not prevent APK publication."
            echo "- **Dedicated writable-system startup validation:** not run for this hosted-only release path."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare release-linked Android smoke evidence
        shell: bash
        run: |
          set -euo pipefail

          evidence_dir="artifacts/android-smoke-evidence"
          release_dir="artifacts/release"
          result_file="$evidence_dir/android-smoke-result.txt"
          archive="$release_dir/SafeNet-DNS-Android-smoke-evidence.tar.gz"
          result_asset="$release_dir/SafeNet-DNS-Android-smoke-result.txt"
          checksum_asset="$release_dir/SafeNet-DNS-Android-smoke-evidence.sha256"

          test -d "$evidence_dir"
          if [[ ! -s "$result_file" ]]; then
            result_file="$(find "$evidence_dir" -type f \( -name 'result.txt' -o -name 'android-smoke-result.txt' \) -size +0c | sort | head -n 1)"
          fi
          if [[ -z "$result_file" || ! -s "$result_file" ]]; then
            echo "::error::Android smoke result was not found in the downloaded evidence artifact."
            find "$evidence_dir" -maxdepth 4 -type f -print >&2 || true
            exit 1
          fi
          mkdir -p "$release_dir"
          tar -czf "$archive" -C "$evidence_dir" .
          cp "$result_file" "$result_asset"
          (
            cd "$release_dir"
            sha256sum "$(basename "$archive")" "$(basename "$result_asset")" > "$(basename "$checksum_asset")"
          )
          echo "Prepared release-linked Android smoke evidence:"
          ls -lh "$archive" "$result_asset" "$checksum_asset"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android/app-release.apk
            artifacts/android/app-release.apk.sha256
            artifacts/android-test/app-release-androidTest.apk
            artifacts/android-test/app-release-androidTest.apk.sha256
            artifacts/release/SafeNet-DNS-Android-smoke-evidence.tar.gz
            artifacts/release/SafeNet-DNS-Android-smoke-result.txt
            artifacts/release/SafeNet-DNS-Android-smoke-evidence.sha256
            artifacts/release/SafeNet-DNS-Android-physical-verification.txt
            artifacts/release/SafeNet-DNS-Android-physical-verification.sha256
            artifacts/release/SafeNet-DNS-Android-internet-share-verification.txt
            artifacts/release/SafeNet-DNS-Android-internet-share-verification.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-published-android-release:
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Keep the verifier aligned with the build job; "tools" was removed
          # from the Android SDK repository.
          packages: 'platform-tools'

      - name: Install and verify Android toolchain from Gradle pins
        shell: bash
        run: ./scripts/setup-android-sdk.sh

      - name: Resolve expected Android release metadata
        id: android_release_metadata
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${GITHUB_REF_NAME#v}"
          test -n "$expected_version" || {
            echo "::error::Could not resolve the release version from GITHUB_REF_NAME."
            exit 1
          }
          bash scripts/resolve-android-release-metadata.sh \
            --expected-version "$expected_version" \
            --expected-label tag \
            --mismatch-prefix "Published release version mismatch" \
            --output "$GITHUB_OUTPUT"

      - name: Download formal GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_dir="$GITHUB_WORKSPACE/published-release-assets"
          mkdir -p "$release_dir"
          assets=(
            app-release.apk
            app-release.apk.sha256
            app-release-androidTest.apk
            app-release-androidTest.apk.sha256
            SafeNet-DNS-Android-smoke-evidence.tar.gz
            SafeNet-DNS-Android-smoke-result.txt
            SafeNet-DNS-Android-smoke-evidence.sha256
            SafeNet-DNS-Android-physical-verification.txt
            SafeNet-DNS-Android-physical-verification.sha256
            SafeNet-DNS-Android-internet-share-verification.txt
            SafeNet-DNS-Android-internet-share-verification.sha256
          )
          for asset in "${assets[@]}"; do
            if ! gh release download "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" \
              --dir "$release_dir" \
              --clobber; then
              echo "::error title=Missing GitHub Release asset::$asset was not downloadable from release $GITHUB_REF_NAME."
              exit 1
            fi
            test -s "$release_dir/$asset" || {
              echo "::error title=Empty GitHub Release asset::$asset was downloaded empty."
              exit 1
            }
          done

      - name: Verify published Android Release assets
        id: verify_published_android_release
        shell: bash
        env:
          ANDROID_VERSION_NAME: ${{ steps.android_release_metadata.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.android_release_metadata.outputs.version_code }}
        run: |
          set -euo pipefail
          bash scripts/verify-android-release-assets.sh \
            --assets-dir "$GITHUB_WORKSPACE/published-release-assets" \
            --expected-version "$ANDROID_VERSION_NAME" \
            --expected-version-code "$ANDROID_VERSION_CODE" \
            --sdk-root "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
