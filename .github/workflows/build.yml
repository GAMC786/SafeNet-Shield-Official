        if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Decode Android release keystore
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 repository secret is required for release builds."
            exit 1
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/safenet-release.keystore"
          chmod 600 "${RUNNER_TEMP}/safenet-release.keystore"

      - name: Validate SafeNet WireGuard release configuration
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        shell: bash
        env:
          SAFENET_WIREGUARD_GATEWAY_ENDPOINT: ${{ secrets.SAFENET_WIREGUARD_GATEWAY_ENDPOINT }}
          SAFENET_WIREGUARD_GATEWAY_OWNER: ${{ secrets.SAFENET_WIREGUARD_GATEWAY_OWNER }}
          SAFENET_WIREGUARD_PEER_PUBLIC_KEY: ${{ secrets.SAFENET_WIREGUARD_PEER_PUBLIC_KEY }}
          SAFENET_WIREGUARD_CLIENT_PRIVATE_KEY: ${{ secrets.SAFENET_WIREGUARD_CLIENT_PRIVATE_KEY }}
          SAFENET_WIREGUARD_CLIENT_ADDRESS: ${{ secrets.SAFENET_WIREGUARD_CLIENT_ADDRESS }}
          SAFENET_WIREGUARD_ALLOWED_IPS: ${{ secrets.SAFENET_WIREGUARD_ALLOWED_IPS }}
          SAFENET_WIREGUARD_DNS_SERVERS: ${{ secrets.SAFENET_WIREGUARD_DNS_SERVERS }}
          SAFENET_WIREGUARD_PERSISTENT_KEEPALIVE: ${{ secrets.SAFENET_WIREGUARD_PERSISTENT_KEEPALIVE }}
        run: |
          set -euo pipefail
          missing=0
          for variable in \
            SAFENET_WIREGUARD_GATEWAY_ENDPOINT \
            SAFENET_WIREGUARD_GATEWAY_OWNER \
            SAFENET_WIREGUARD_PEER_PUBLIC_KEY \
            SAFENET_WIREGUARD_CLIENT_PRIVATE_KEY \
            SAFENET_WIREGUARD_CLIENT_ADDRESS \
            SAFENET_WIREGUARD_ALLOWED_IPS \
            SAFENET_WIREGUARD_DNS_SERVERS \
            SAFENET_WIREGUARD_PERSISTENT_KEEPALIVE; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::$variable repository secret is required for configured Android release builds."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          # The private key is intentionally available only to this validation
          # step and the Gradle packaging steps below, never to the web build.
          if [[ -d "$GITHUB_WORKSPACE/dist/public" ]] &&
            grep -R --binary-files=without-match --fixed-strings --quiet \
              "$SAFENET_WIREGUARD_CLIENT_PRIVATE_KEY" \
              "$GITHUB_WORKSPACE/dist/public"; then
            echo "::error::The WireGuard client private key must not be copied into frontend assets."
            exit 1
          fi
          echo "Validated complete SafeNet WireGuard release configuration presence without printing secret values."

      - name: Validate SafeNet WireGuard parser before APK packaging
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        working-directory: android
        shell: bash
