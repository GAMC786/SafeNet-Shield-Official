name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1-5'
    # Keep the scheduled Android release checks independent from manual runs.
    - cron: '47 4 1 * *'
  workflow_dispatch:
    inputs:
      android_resolver_mode:
        description: "Resolver mode for the Android smoke lane"
        required: true
        default: fixture
        type: choice
        options:
          - fixture
          - public
      android_resolver_failure_validation:
        description: "Intentionally exercise one bounded encrypted-resolver failure record"
        required: true
        default: false
        type: boolean
      dns_alert_validation:
        description: "Maintainer-only DNS alert lifecycle validation"
        required: true
        default: none
        type: choice
        options:
          - none
          - lifecycle
      cross_platform_workflow_lint:
        description: "Run the pinned workflow lint installer on Windows and macOS"
        required: true
        default: false
        type: boolean
      android_startup_validation:
        description: "Run the signed APK startup handoff check on the dedicated Android runner"
        required: true
        default: false
        type: boolean
      android_billing_validation:
        description: "Run the signed APK RevenueCat purchase and restore proof on a Play-enabled runner"
        required: true
        default: false
        type: boolean
      android_ai_shield_physical_validation:
        description: "Run the representative AI Shield physical-device matrix"
        required: true
        default: false
        type: boolean
      android_connectivity_physical_validation:
        description: "Run signed DNS-to-WireGuard handoff checks across the physical Android device matrix"
        required: true
        default: false
        type: boolean
      android_internet_share_physical_validation:
        description: "Run the signed Internet Share Wi-Fi Direct proxy check on physical Android devices"
        required: true
        default: false
        type: boolean
      android_internet_share_client_serials:
        description: "JSON map of profile names to separate client-phone ADB serials"
        required: false
        default: "{}"
        type: string

permissions:
  contents: read

jobs:
  validate-release-workflow:
    runs-on: ubuntu-latest
    outputs:
      workflow_lint_matrix: ${{ steps.workflow-lint-matrix.outputs.matrix }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read workflow lint versions from package.json
        id: workflow-lint-versions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from "node:fs";
          import { getRequiredVersions } from "./scripts/setup-workflow-lint.mjs";

          try {
            const manifest = JSON.parse(readFileSync("package.json", "utf8"));
            const versions = getRequiredVersions(manifest);
            for (const [tool, version] of Object.entries(versions)) {
              if (!/^\d+\.\d+\.\d+$/.test(version)) {
                throw new Error(
                  `package.json workflowLint.${tool} must be a complete semantic version; received "${version}".`,
                );
              }
              console.error(`Using workflowLint.${tool} ${version}.`);
              console.log(`${tool}_version=${version}`);
            }
          } catch (error) {
            console.error(
              `Workflow lint version check failed: ${error.message}`,
            );
            process.exit(1);
          }
          NODE

      - name: Install pinned ShellCheck
        shell: bash
        env:
          SHELLCHECK_VERSION: ${{ steps.workflow-lint-versions.outputs.shellcheck_version }}
        run: |
          set -euo pipefail
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl --fail --silent --show-error --location \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          tar -xJf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          install -m 0755 \
            "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            "${RUNNER_TEMP}/shellcheck"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/shellcheck" --version

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2
        with:
          version: ${{ steps.workflow-lint-versions.outputs.actionlint_version }}
          files: .github/workflows/*.yml, .github/workflows/*.yaml

      - name: Validate workflow lint matrix contract
        id: workflow-lint-matrix
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { getWorkflowLintMatrix } from "./scripts/workflow-lint-matrix.mjs";

          const matrix = getWorkflowLintMatrix();
          console.error(`Validated ${matrix.length} workflow lint matrix entries.`);
          console.log(`matrix=${JSON.stringify(matrix)}`);
          NODE

  cross-platform-workflow-lint:
    needs: validate-release-workflow
    name: Workflow lint (${{ matrix.platform }} ${{ matrix.architecture }} on ${{ matrix.runner }})
    if: >-
      needs.validate-release-workflow.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.cross_platform_workflow_lint) ||
      (github.event_name == 'schedule' && github.event.schedule == '47 4 1 * *'))
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.validate-release-workflow.outputs.workflow_lint_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      WORKFLOW_LINT_PLATFORM: ${{ matrix.platform }}
      WORKFLOW_LINT_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - name: Checkout disposable workflow lint workspace
        id: checkout_workspace
        uses: actions/checkout@v4
        with:
          path: workflow-lint-checkout

      - name: Setup Node.js
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned workflow lint tools
        id: setup_workflow_lint
        working-directory: workflow-lint-checkout
        shell: bash
        run: |
          set -o pipefail
          npm run setup:workflow-lint 2>&1 | tee "$RUNNER_TEMP/workflow-lint.log"

      - name: Lint workflows with installed tools
        id: lint_workflows
        working-directory: workflow-lint-checkout
        shell: bash
        run: |
          set -o pipefail
          npm run lint:workflows 2>&1 | tee -a "$RUNNER_TEMP/workflow-lint.log"

      - name: Report workflow lint failure stage
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout_workspace.outcome }}
          NODE_OUTCOME: ${{ steps.setup_node.outcome }}
          SETUP_OUTCOME: ${{ steps.setup_workflow_lint.outcome }}
          LINT_OUTCOME: ${{ steps.lint_workflows.outcome }}
        run: |
          set -u
          stage="completed"
          outcome="success"

          if [[ "$CHECKOUT_OUTCOME" != "success" ]]; then
            stage="checkout"
            outcome="$CHECKOUT_OUTCOME"
          elif [[ "$NODE_OUTCOME" != "success" ]]; then
            stage="node setup"
            outcome="$NODE_OUTCOME"
          elif [[ "$SETUP_OUTCOME" != "success" ]]; then
            stage="workflow lint setup"
            outcome="$SETUP_OUTCOME"
          elif [[ "$LINT_OUTCOME" != "success" ]]; then
            stage="workflow lint"
            outcome="$LINT_OUTCOME"
          fi

          if [[ "$stage" == "completed" ]]; then
            echo "Workflow lint passed on ${WORKFLOW_LINT_PLATFORM}/${WORKFLOW_LINT_ARCHITECTURE}."
            exit 0
          fi

          message="Workflow lint failed on ${WORKFLOW_LINT_PLATFORM}/${WORKFLOW_LINT_ARCHITECTURE} during ${stage} (outcome: ${outcome})."
          echo "::error title=${WORKFLOW_LINT_PLATFORM}/${WORKFLOW_LINT_ARCHITECTURE} workflow lint failure::${message}"
          {
            echo "## Cross-platform workflow lint failure"
            echo
            echo "- **Platform:** ${WORKFLOW_LINT_PLATFORM}"
            echo "- **Architecture:** ${WORKFLOW_LINT_ARCHITECTURE}"
            echo "- **Failed stage:** ${stage}"
            echo "- **Outcome:** ${outcome}"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "## Cross-platform workflow lint failure"
            echo
            echo "- **Platform:** ${WORKFLOW_LINT_PLATFORM}"
            echo "- **Architecture:** ${WORKFLOW_LINT_ARCHITECTURE}"
            echo "- **Failed stage:** ${stage}"
            echo "- **Outcome:** ${outcome}"
            if [[ -f "$RUNNER_TEMP/workflow-lint.log" ]]; then
              echo
              echo "### Recent captured output (bounded)"
              echo '```text'
              tail -n 120 "$RUNNER_TEMP/workflow-lint.log" | head -c 16000
              echo
              echo '```'
            fi
          } > "$RUNNER_TEMP/workflow-lint-failure-summary.md"
          exit 1

      - name: Record workflow lint outcome
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout_workspace.outcome }}
          NODE_OUTCOME: ${{ steps.setup_node.outcome }}
          SETUP_OUTCOME: ${{ steps.setup_workflow_lint.outcome }}
          LINT_OUTCOME: ${{ steps.lint_workflows.outcome }}
          WORKFLOW_LINT_RUNNER: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { join } from "node:path";

          const steps = [
            ["checkout", process.env.CHECKOUT_OUTCOME],
            ["node setup", process.env.NODE_OUTCOME],
            ["workflow lint setup", process.env.SETUP_OUTCOME],
            ["workflow lint", process.env.LINT_OUTCOME],
          ];
          const failedStep = steps.find(([, outcome]) => outcome !== "success");
          const result = {
            platform: process.env.WORKFLOW_LINT_PLATFORM,
            architecture: process.env.WORKFLOW_LINT_ARCHITECTURE,
            runner: process.env.WORKFLOW_LINT_RUNNER,
            stage: failedStep?.[0] ?? "completed",
            outcome: failedStep?.[1] ?? "success",
          };
          const filename =
            `workflow-lint-result-${result.platform}-${result.architecture}.json`;
          writeFileSync(
            join(process.env.RUNNER_TEMP, filename),
            `${JSON.stringify(result, null, 2)}\n`,
          );
          NODE

      - name: Upload workflow lint outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-workflow-lint-outcome-${{ matrix.platform }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/workflow-lint-result-*.json
          if-no-files-found: error

      - name: Upload workflow lint failure details
        id: upload_workflow_lint_failure_details
        if: >-
          always() &&
          (steps.checkout_workspace.outcome == 'failure' ||
          steps.setup_node.outcome == 'failure' ||
          steps.setup_workflow_lint.outcome == 'failure' ||
          steps.lint_workflows.outcome == 'failure')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-workflow-lint-failure-details-${{ matrix.platform }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/workflow-lint-failure-summary.md
          if-no-files-found: warn

      - name: Link workflow lint failure details
        if: >-
          always() &&
          (steps.checkout_workspace.outcome == 'failure' ||
          steps.setup_node.outcome == 'failure' ||
          steps.setup_workflow_lint.outcome == 'failure' ||
          steps.lint_workflows.outcome == 'failure')
        shell: bash
        env:
          EVIDENCE_URL: ${{ steps.upload_workflow_lint_failure_details.outputs.artifact-url || format('{0}/{1}/actions/runs/{2}#artifacts', github.server_url, github.repository, github.run_id) }}
        run: |
          set -u
          echo "- **Bounded failure details:** [Download the ${WORKFLOW_LINT_PLATFORM}/${WORKFLOW_LINT_ARCHITECTURE} summary]($EVIDENCE_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Failure details: $EVIDENCE_URL"

  cross-platform-workflow-lint-summary:
    name: Monthly workflow lint health
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.cross_platform_workflow_lint) ||
      (github.event_name == 'schedule' && github.event.schedule == '47 4 1 * *'))
    runs-on: ubuntu-latest
    # This coordinator must not wait on a matrix entry that is still queued.
    # It polls for a bounded window and records a failure for any missing
    # runner outcome so the monthly history can still be written.
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    concurrency:
      group: workflow-lint-history
      cancel-in-progress: false
    steps:
      - name: Checkout default branch for lint history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Wait for cross-platform workflow lint matrix
        id: wait_for_matrix
        uses: actions/github-script@v7
        env:
          MATRIX_WAIT_SECONDS: 600
        with:
          script: |
            const { writeFileSync } = require('node:fs');
            const { readFileSync } = require('node:fs');
            const { join } = require('node:path');

            const matrixContractPath = `${process.env.GITHUB_WORKSPACE}/.github/workflow-lint-matrix.json`;
            const expected = JSON.parse(readFileSync(matrixContractPath, 'utf8'));
            if (!Array.isArray(expected) || expected.length === 0) {
              throw new Error(`Workflow lint matrix contract ${matrixContractPath} is empty or invalid.`);
            }
            const waitSeconds = Number(process.env.MATRIX_WAIT_SECONDS);
            const deadline = Date.now() + waitSeconds * 1000;
            let jobs = [];

            while (true) {
              try {
                const response = await github.rest.actions.listJobsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: context.runId,
                  per_page: 100
                });
                jobs = response.data.jobs.filter((job) =>
                  expected.some((entry) => entry.name === job.name)
                );
              } catch (error) {
                core.warning(`Could not read matrix job status yet: ${error.message}`);
              }

              const complete = expected.every((entry) =>
                jobs.some((job) => entry.name === job.name && job.status === 'completed')
              );
              if (complete || Date.now() >= deadline) {
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 30000));
            }

            const records = expected.map((entry) => {
              const matchingJobs = jobs
                .filter((job) => job.name === entry.name)
                .sort((left, right) => Number(right.id) - Number(left.id));
              const job = matchingJobs[0];
              return {
                ...entry,
                job_id: job?.id ?? null,
                status: job?.status ?? 'queued',
                conclusion: job?.conclusion ?? null
              };
            });
            const timedOut = records.some((record) => record.status !== 'completed');
            if (timedOut) {
              core.warning(
                `Cross-platform workflow lint matrix did not complete within ${waitSeconds} seconds.`
              );
            }

            writeFileSync(
              join(process.env.RUNNER_TEMP, 'workflow-lint-matrix-jobs.json'),
              `${JSON.stringify(records, null, 2)}\n`
            );
            core.setOutput(
              'matrix_result',
              records.every(
                (record) =>
                  record.status === 'completed' && record.conclusion === 'success'
              )
                ? 'success'
                : 'failure'
            );

      - name: Download workflow lint outcomes
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: SafeNet-DNS-workflow-lint-outcome-*
          path: ${{ runner.temp }}/workflow-lint-results
          merge-multiple: true

      - name: Publish monthly workflow lint health
        shell: bash
        env:
          LINT_RESULT: ${{ steps.wait_for_matrix.outputs.matrix_result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$LINT_RESULT" == "success" ]]; then
            health="passed"
            message="Windows and macOS workflow lint installers completed successfully."
          else
            health="failed"
            message="At least one Windows or macOS workflow lint installer failed; inspect that matrix job's bounded details."
          fi

          {
            echo "## Monthly cross-platform workflow lint"
            echo
            echo "- **Health:** ${health}"
            echo "- **Matrix result:** \`${LINT_RESULT}\`"
            echo "- **Workflow run:** [Open run](${RUN_URL})"
            echo
            echo "$message"
            echo
            echo "Android build and release health is reported separately."
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$LINT_RESULT" != "success" ]]; then
            echo "::error title=Monthly cross-platform workflow lint failed::${message}"
            exit 1
          fi

      - name: Record workflow lint history
        if: always()
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RESULTS_DIRECTORY: ${{ runner.temp }}/workflow-lint-results
        run: |
          set -euo pipefail
          RECORDED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export RECORDED_AT
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          node --input-type=module <<'NODE'
          import {
            existsSync,
            mkdirSync,
            readdirSync,
            readFileSync,
            writeFileSync,
          } from "node:fs";

          const historyPath = ".github/workflow-lint-history.json";
          const resultsDirectory = process.env.RESULTS_DIRECTORY;
           const { getWorkflowLintMatrix } = await import(
             "./scripts/workflow-lint-matrix.mjs"
           );
           const expected = getWorkflowLintMatrix();
          const expectedKeys = new Set(
            expected.map(
              (entry) => `${entry.platform}/${entry.architecture}`,
            ),
          );
          const matrixJobsPath = `${process.env.RUNNER_TEMP}/workflow-lint-matrix-jobs.json`;
          const matrixJobs = existsSync(matrixJobsPath)
            ? JSON.parse(readFileSync(matrixJobsPath, "utf8"))
            : [];
          mkdirSync(resultsDirectory, { recursive: true });

          const resultFiles = readdirSync(resultsDirectory)
            .filter((file) => file.endsWith(".json"))
            .sort();

          const resultByKey = new Map();
          for (const file of resultFiles) {
            const result = JSON.parse(
              readFileSync(`${resultsDirectory}/${file}`, "utf8"),
            );
            const key = `${result.platform}/${result.architecture}`;
            if (!expectedKeys.has(key) || resultByKey.has(key)) {
              throw new Error(`Unexpected or duplicate workflow lint outcome ${file}.`);
            }
            resultByKey.set(key, result);
          }

          for (const entry of expected) {
            const key = `${entry.platform}/${entry.architecture}`;
            if (resultByKey.has(key)) {
              continue;
            }
            const job = matrixJobs.find((candidate) => candidate.name === entry.name);
            const runnerUnavailable = job?.status !== "completed";
            const result = {
              platform: entry.platform,
              architecture: entry.architecture,
              runner: entry.runner,
              stage: runnerUnavailable
                ? "runner allocation timeout"
                : "matrix outcome unavailable",
              outcome: "failure",
            };
            const filename =
              `workflow-lint-result-${entry.platform}-${entry.architecture}.json`;
            writeFileSync(
              `${resultsDirectory}/${filename}`,
              `${JSON.stringify(result, null, 2)}\n`,
            );
            resultByKey.set(key, result);
          }

          const normalizedResultFiles = readdirSync(resultsDirectory)
            .filter((file) => file.endsWith(".json"))
            .sort();
          if (normalizedResultFiles.length !== expected.length) {
            throw new Error(
              `Expected ${expected.length} workflow lint outcomes, found ${normalizedResultFiles.length}.`,
            );
          }

          const results = normalizedResultFiles.map((file) => {
            const result = JSON.parse(
              readFileSync(`${resultsDirectory}/${file}`, "utf8"),
            );
            for (const field of [
              "platform",
              "architecture",
              "runner",
              "stage",
              "outcome",
            ]) {
              if (typeof result[field] !== "string" || result[field].length === 0) {
                throw new Error(`Workflow lint outcome ${file} is missing ${field}.`);
              }
            }
            const key = `${result.platform}/${result.architecture}`;
            if (!expectedKeys.has(key)) {
              throw new Error(`Workflow lint outcome ${file} has an unsupported matrix entry.`);
            }
            return result;
          });

          const previous = existsSync(historyPath)
            ? JSON.parse(readFileSync(historyPath, "utf8"))
            : { schema_version: 1, retention_runs: 24, runs: [] };
          if (
            previous.schema_version !== 1 ||
            !Number.isInteger(previous.retention_runs) ||
            previous.retention_runs < 1 ||
            !Array.isArray(previous.runs)
          ) {
            throw new Error(`${historyPath} has an unsupported schema.`);
          }

          const run = {
            run_id: String(process.env.RUN_ID),
            run_attempt: Number(process.env.RUN_ATTEMPT),
            event: process.env.EVENT_NAME,
            recorded_at: process.env.RECORDED_AT,
            ref: process.env.REF_NAME,
            commit: process.env.COMMIT_SHA,
            results,
          };
          const existingRuns = previous.runs.filter(
            (previousRun) => String(previousRun.run_id) === run.run_id,
          );
          const latestExistingRun = existingRuns.reduce(
            (latest, previousRun) =>
              !latest ||
              Number(previousRun.run_attempt) > Number(latest.run_attempt)
                ? previousRun
                : latest,
            undefined,
          );
          const authoritativeRun =
            latestExistingRun &&
            Number(latestExistingRun.run_attempt) > run.run_attempt
              ? latestExistingRun
              : run;
          const independentRuns = previous.runs.filter(
            (previousRun) => String(previousRun.run_id) !== run.run_id,
          );
          const history = {
            schema_version: 1,
            retention_runs: previous.retention_runs,
            runs: [authoritativeRun, ...independentRuns].slice(0, previous.retention_runs),
          };
          writeFileSync(historyPath, `${JSON.stringify(history, null, 2)}\n`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflow-lint-history.json
          if git diff --cached --quiet; then
            echo "Workflow lint history is already current."
            exit 0
          fi
          git commit -m "Record hosted-runner workflow lint health"
          git push origin "HEAD:$DEFAULT_BRANCH"

  build-android:
    needs: validate-release-workflow
    outputs:
      android_apk_artifact_url: ${{ steps.upload-signed-release-apk.outputs.artifact-url }}
      android_instrumentation_artifact_url: ${{ steps.upload-release-instrumentation-apk.outputs.artifact-url }}
      android_sdk_setup_category: ${{ steps.android-sdk-setup-report.outputs.category }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      ANDROID_SMOKE_RESOLVER_MODE: ${{ github.event_name == 'schedule' && 'public' || github.event.inputs.android_resolver_mode || 'fixture' }}
      ANDROID_SMOKE_RESOLVER_FAILURE_VALIDATION: ${{ github.event_name == 'workflow_dispatch' && inputs.android_resolver_failure_validation || 'false' }}
      ANDROID_SMOKE_COVERAGE: ${{ github.event_name == 'schedule' && 'external-network' || github.event.inputs.android_resolver_mode == 'public' && 'external-network' || 'controlled-fixture' }}
      ANDROID_SMOKE_VALIDATION_MODE: hosted-emulator-full
      ANDROID_SMOKE_DEVICE_KIND: hosted-emulator
      ANDROID_SDK_SETUP_OUTPUT_DIR: ${{ github.workspace }}/android/app/build/reports/android-sdk-setup
      DNS_ALERT_VALIDATION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dns_alert_validation || 'none' }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_REVENUECAT_ANDROID_API_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_API_KEY }}
      ANDROID_SMOKE_CLERK_ORIGIN: ${{ secrets.AUTH_SMOKE_BASE_URL || 'https://safe-net-shield-official.replit.app' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies with bounded retry
        run: bash scripts/npm-ci-with-retry.sh

      - name: Check TypeScript
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      - name: Run browser UI tests
        if: env.ANDROID_SMOKE_RESOLVER_FAILURE_VALIDATION != 'true'
        run: npm run test:ui

      - name: Require RevenueCat Android key for release builds
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VITE_REVENUECAT_ANDROID_API_KEY}" || {
            echo "::error::VITE_REVENUECAT_ANDROID_API_KEY is required for signed Android release builds."
            exit 1
          }

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        id: setup-android-sdk-action
        uses: android-actions/setup-android@v3
        with:
          # setup-android defaults to the removed "tools" package. The
          # pinned installer below installs the complete Gradle toolchain.
          packages: 'platform-tools'

      - name: Install and verify Android toolchain from Gradle pins
        id: install-android-sdk
        shell: bash
        run: |
          set -o pipefail
          ./scripts/setup-android-sdk.sh 2>&1 | tee "$RUNNER_TEMP/android-sdk-setup.log"

      - name: Publish Android SDK setup status
        id: android-sdk-setup-report
        if: always()
        shell: bash
        env:
          SETUP_ACTION_OUTCOME: ${{ steps.setup-android-sdk-action.outcome }}
          INSTALL_STEP_OUTCOME: ${{ steps.install-android-sdk.outcome }}
        run: |
          set -u
          output_dir="${ANDROID_SDK_SETUP_OUTPUT_DIR}"
          mkdir -p "$output_dir"
          category="PASS"
          stage="completed"
          reason="NONE"
          attempts="0"
          exit_status="0"
          if [[ "$SETUP_ACTION_OUTCOME" != "success" ]]; then
            category="ANDROID_SDK_SETUP_FAILURE"
            stage="android-actions/setup-android"
            reason="SETUP_ACTION_FAILURE"
          elif [[ "$INSTALL_STEP_OUTCOME" != "success" ]]; then
            category="ANDROID_SDK_SETUP_FAILURE"
            stage="pinned-sdk-install"
            result_file="$output_dir/result.txt"
            if [[ -f "$result_file" ]]; then
              reason="$(sed -n 's/^failure_reason=//p' "$result_file" | head -n 1)"
              attempts="$(sed -n 's/^attempts=//p' "$result_file" | head -n 1)"
              exit_status="$(sed -n 's/^exit_status=//p' "$result_file" | head -n 1)"
            fi
            reason="${reason:-UNCLASSIFIED_INSTALL_FAILURE}"
            attempts="${attempts:-0}"
            exit_status="${exit_status:-1}"
          fi

          if [[ "$category" == "ANDROID_SDK_SETUP_FAILURE" ]]; then
            if [[ -f "$RUNNER_TEMP/android-sdk-setup.log" ]]; then
              tail -c 16000 "$RUNNER_TEMP/android-sdk-setup.log" > "$output_dir/diagnostics.log"
            else
              printf '%s\n' \
                "The Android SDK action failed before the pinned installer produced a log." \
                "Inspect the failed Setup Android SDK step and retry the hosted runner." \
                > "$output_dir/diagnostics.log"
            fi
            printf '%s\n' "$category" > "$output_dir/failure-category.txt"
          else
            printf '%s\n' "$category" > "$output_dir/failure-category.txt"
          fi

          {
            printf 'failure_class=%s\n' "$([[ "$category" == "PASS" ]] && echo "NONE" || echo "INFRASTRUCTURE")"
            printf 'failure_category=%s\n' "$category"
            printf 'failure_stage=%s\n' "$stage"
            printf 'failure_reason=%s\n' "$reason"
            printf 'attempts=%s\n' "$attempts"
            printf 'exit_status=%s\n' "$exit_status"
            printf 'setup_action_outcome=%s\n' "$SETUP_ACTION_OUTCOME"
            printf 'install_step_outcome=%s\n' "$INSTALL_STEP_OUTCOME"
          } > "$output_dir/result.txt"
          printf 'category=%s\n' "$category" >> "$GITHUB_OUTPUT"

          {
            echo "## Android SDK setup"
            echo
            echo "- **Infrastructure category:** \`$category\`"
            echo "- **Failed stage:** \`$stage\`"
            echo "- **Failure reason:** \`$reason\`"
            echo "- **Install attempts:** \`$attempts\`"
            echo "- **Setup action:** \`$SETUP_ACTION_OUTCOME\`"
            echo "- **Pinned SDK install:** \`$INSTALL_STEP_OUTCOME\`"
            if [[ "$category" == "ANDROID_SDK_SETUP_FAILURE" ]]; then
              echo "- **Resolver smoke proof:** \`NOT_RUN\` — blocked by Android SDK setup infrastructure."
              echo "- **Bounded diagnostics:** preserved in the Android SDK setup evidence artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android SDK setup evidence
        id: upload-android-sdk-setup-evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Android-sdk-setup-evidence
          path: android/app/build/reports/android-sdk-setup
          if-no-files-found: warn

      - name: Preflight Android emulator system trust
        id: android-system-trust-preflight
        if: "!startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && env.ANDROID_SMOKE_RESOLVER_MODE == 'fixture'"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Manual and scheduled checks retain the hosted preflight. Tagged
          # releases use the hosted emulator smoke lane below.
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -writable-system
          script: ./scripts/android-smoke-test.sh --preflight --output "$GITHUB_WORKSPACE/android/app/build/reports/android-smoke/latest/preflight"
        env:
          ANDROID_EMULATOR_API_LEVEL: 34
          ANDROID_EMULATOR_TARGET: google_apis
          ANDROID_EMULATOR_ARCH: x86_64
          ANDROID_EMULATOR_SYSTEM_IMAGE: system-images;android-34;google_apis;x86_64

      - name: Build and sync mobile web assets
        run: ./scripts/build-android.sh
        env:
          MOBILE_API_URL: ${{ secrets.AUTH_SMOKE_BASE_URL || 'https://safe-net-shield-official.replit.app' }}

