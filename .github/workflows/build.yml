name: Build Android APK and Windows MSI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1-5'
  workflow_dispatch:
    inputs:
      android_resolver_mode:
        description: "Resolver mode for the Android smoke lane"
        required: true
        default: fixture
        type: choice
        options:
          - fixture
          - public
      dns_alert_validation:
        description: "Maintainer-only DNS alert lifecycle validation"
        required: true
        default: none
        type: choice
        options:
          - none
          - lifecycle

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      ANDROID_SMOKE_RESOLVER_MODE: ${{ github.event_name == 'schedule' && 'public' || github.event.inputs.android_resolver_mode || 'fixture' }}
      ANDROID_SMOKE_COVERAGE: ${{ github.event_name == 'schedule' && 'external-network' || github.event.inputs.android_resolver_mode == 'public' && 'external-network' || 'controlled-fixture' }}
      DNS_ALERT_VALIDATION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dns_alert_validation || 'none' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install and verify Android toolchain from Gradle pins
        shell: bash
        run: ./scripts/setup-android-sdk.sh

      - name: Build and sync mobile web assets
        run: ./scripts/build-android.sh
        env:
          MOBILE_API_URL: https://safe-net-shield-official.replit.app

      - name: Build debug APK
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Decode Android release keystore
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 repository secret is required for release builds."
            exit 1
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/safenet-release.keystore"
          chmod 600 "${RUNNER_TEMP}/safenet-release.keystore"

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        working-directory: android
        run: ./gradlew assembleRelease
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/safenet-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload signed release APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Android
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Build release instrumentation APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        working-directory: android
        # The application release was already built and signed above. The
        # instrumentation APK uses the test signing configuration, so do not
        # re-run the application release-signing guard for this task.
        run: ./gradlew :app:assembleReleaseAndroidTest -x verifyReleaseSigning
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/safenet-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify release instrumentation APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          test_apk="android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk"
          if [[ ! -f "$test_apk" ]]; then
            echo "::error::Release instrumentation APK is missing: $test_apk"
            exit 1
          fi
          echo "Verified release instrumentation APK: $test_apk"

      - name: Run Android DNS smoke tests on emulator (${{ env.ANDROID_SMOKE_COVERAGE }})
        id: android-dns-smoke
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        continue-on-error: ${{ github.event_name == 'schedule' || env.DNS_ALERT_VALIDATION == 'lifecycle' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # The API 34 google_apis image can boot and install APKs but has
          # repeatedly reported an unavailable gsiservice during adb remount.
          # API 28's legacy AOSP default image avoids the dynamic-partition
          # reboot failures seen on newer hosted images while retaining the
          # userdebug root/remount flow required for the temporary fixture CA.
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -writable-system
          # Release/tag smoke checks use the local fixture by default so a
          # public resolver outage cannot fail the release lane. Scheduled
          # checks intentionally use public resolvers and are non-blocking.
          script: ./scripts/android-smoke-test.sh --apk "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk" --test-apk "$GITHUB_WORKSPACE/android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk"

      - name: Upload Android DNS smoke evidence
        id: upload-android-dns-smoke-evidence
        if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Android-smoke-evidence-${{ env.ANDROID_SMOKE_COVERAGE }}
          path: android/app/build/reports/android-smoke/latest
          if-no-files-found: warn

      - name: Alert maintainers about public DNS smoke failure
        # workflow_dispatch is only enabled for the explicit lifecycle choice.
        # Ordinary fixture dispatches retain the schedule-only production path.
        if: always() && ((github.event_name == 'schedule' && env.ANDROID_SMOKE_COVERAGE == 'external-network' && steps.android-dns-smoke.outcome == 'failure') || (github.event_name == 'workflow_dispatch' && env.DNS_ALERT_VALIDATION == 'lifecycle'))
        uses: actions/github-script@v7
        env:
          ALERT_TITLE: "[Maintainer alert] Scheduled public DNS smoke failure"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVIDENCE_URL: ${{ steps.upload-android-dns-smoke-evidence.outputs.artifact-url || format('{0}/{1}/actions/runs/{2}#artifacts', github.server_url, github.repository, github.run_id) }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = process.env.ALERT_TITLE;
            const runUrl = process.env.RUN_URL;
            const evidenceUrl = process.env.EVIDENCE_URL;
            const body = [
              'The scheduled public-network Android DNS smoke check failed.',
              '',
              `Workflow run: [View run](${runUrl})`,
              `Evidence artifact: ${evidenceUrl ? `[Download smoke evidence](${evidenceUrl})` : 'The evidence artifact URL was not returned; see the run artifacts.'}`,
              '',
              'This alert is informational and does not block releases.'
            ].join('\n');

            const labelName = 'maintainer-alert';
            const labelColor = 'b60205';
            const maxAttempts = 3;
            const isTransientGitHubError = (error) => {
              const status = Number(error?.status);
              const transientCodes = ['ECONNRESET', 'ETIMEDOUT', 'EAI_AGAIN', 'ENOTFOUND'];
              const rateLimitRemaining = error?.response?.headers?.['x-ratelimit-remaining'];
              return status === 408 ||
                status === 429 ||
                status >= 500 ||
                transientCodes.includes(error?.code) ||
                (status === 403 && rateLimitRemaining === '0');
            };
            const withGitHubRetry = async (operation, request, reconcile) => {
              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                try {
                  const result = await request();
                  if (attempt > 1) {
                    core.info(`${operation} succeeded after ${attempt} attempts.`);
                  }
                  return result;
                } catch (error) {
                  if (!isTransientGitHubError(error)) {
                    throw error;
                  }
                  if (reconcile) {
                    try {
                      const reconciled = await reconcile();
                      if (reconciled) {
                        core.info(`${operation} response was ambiguous; reconciled with GitHub.`);
                        return reconciled;
                      }
                    } catch {
                      core.warning(`${operation} reconciliation check failed; retrying original request.`);
                    }
                  }
                  if (attempt === maxAttempts) {
                    core.error(`${operation} failed after ${attempt} attempt(s).`);
                    throw error;
                  }
                  core.warning(
                    `${operation} hit a transient GitHub API failure on attempt ${attempt}/${maxAttempts}; retrying.`,
                  );
                  await new Promise((resolve) => setTimeout(resolve, 1000 * 2 ** (attempt - 1)));
                }
              }
              throw new Error(`${operation} exhausted its retry attempts.`);
            };

            try {
              await withGitHubRetry('Failure alert: check maintainer-alert label', () =>
                github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName
                })
              );
            } catch (error) {
              if (error.status !== 404) throw error;
              await withGitHubRetry('Failure alert: create maintainer-alert label', () =>
                github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName,
                  color: labelColor,
                  description: 'Action required from maintainers'
                })
              );
            }

            const listOpenAlerts = () => withGitHubRetry('Failure alert: list open maintainer alerts', () =>
              github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: labelName,
                per_page: 100
              })
            );
            const { data: openAlerts } = await listOpenAlerts();
            const alert = openAlerts.find((issue) => issue.title === title);

            if (alert) {
              await withGitHubRetry(
                'Failure alert: comment on existing alert',
                () => github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: alert.number,
                  body
                }),
                async () => {
                  const { data: comments } = await withGitHubRetry('Failure alert: reconcile existing alert comment', () =>
                    github.rest.issues.listComments({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: alert.number,
                      per_page: 100
                    })
                  );
                  const existingComment = comments.find((comment) => comment.body === body);
                  return existingComment ? { data: existingComment } : undefined;
                }
              );
              core.info(`Updated existing maintainer alert #${alert.number}.`);
            } else {
              const { data: created } = await withGitHubRetry(
                'Failure alert: create issue',
                () => github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: [labelName]
                }),
                async () => {
                  const { data: currentOpenAlerts } = await listOpenAlerts();
                  const existingAlert = currentOpenAlerts.find((issue) => issue.title === title);
                  return existingAlert ? { data: existingAlert } : undefined;
                }
              );
              core.info(`Created maintainer alert #${created.number}.`);
            }

      - name: Close recovered public DNS smoke alert
        if: always() && ((github.event_name == 'schedule' && env.ANDROID_SMOKE_COVERAGE == 'external-network' && steps.android-dns-smoke.outcome == 'success') || (github.event_name == 'workflow_dispatch' && env.DNS_ALERT_VALIDATION == 'lifecycle'))
        uses: actions/github-script@v7
        env:
          ALERT_TITLE: "[Maintainer alert] Scheduled public DNS smoke failure"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = process.env.ALERT_TITLE;
            const runUrl = process.env.RUN_URL;
            const labelName = 'maintainer-alert';
            const body = [
              'The scheduled public-network Android DNS smoke check recovered successfully.',
              '',
              `Successful workflow run: [View run](${runUrl})`,
              '',
              'Closing this alert while preserving the previous failure history.'
            ].join('\n');
            const maxAttempts = 3;
            const isTransientGitHubError = (error) => {
              const status = Number(error?.status);
              const transientCodes = ['ECONNRESET', 'ETIMEDOUT', 'EAI_AGAIN', 'ENOTFOUND'];
              const rateLimitRemaining = error?.response?.headers?.['x-ratelimit-remaining'];
              return status === 408 ||
                status === 429 ||
                status >= 500 ||
                transientCodes.includes(error?.code) ||
                (status === 403 && rateLimitRemaining === '0');
            };
            const withGitHubRetry = async (operation, request, reconcile) => {
              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                try {
                  const result = await request();
                  if (attempt > 1) {
                    core.info(`${operation} succeeded after ${attempt} attempts.`);
                  }
                  return result;
                } catch (error) {
                  if (!isTransientGitHubError(error)) {
                    throw error;
                  }
                  if (reconcile) {
                    try {
                      const reconciled = await reconcile();
                      if (reconciled) {
                        core.info(`${operation} response was ambiguous; reconciled with GitHub.`);
                        return reconciled;
                      }
                    } catch {
                      core.warning(`${operation} reconciliation check failed; retrying original request.`);
                    }
                  }
                  if (attempt === maxAttempts) {
                    core.error(`${operation} failed after ${attempt} attempt(s).`);
                    throw error;
                  }
                  core.warning(
                    `${operation} hit a transient GitHub API failure on attempt ${attempt}/${maxAttempts}; retrying.`,
                  );
                  await new Promise((resolve) => setTimeout(resolve, 1000 * 2 ** (attempt - 1)));
                }
              }
              throw new Error(`${operation} exhausted its retry attempts.`);
            };

            const listOpenAlerts = () => withGitHubRetry('Recovery alert: list open maintainer alerts', () =>
              github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: labelName,
                per_page: 100
              })
            );
            let alert;
            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const { data: openAlerts } = await listOpenAlerts();
              alert = openAlerts.find((issue) => issue.title === title);
              if (alert || attempt === maxAttempts) break;
              core.warning(`Recovery alert: no open alert found yet; retrying lookup (${attempt}/${maxAttempts}).`);
              await new Promise((resolve) => setTimeout(resolve, 1000 * attempt));
            }

            if (!alert) {
              core.info('No open public DNS smoke alert found; nothing to close.');
              return;
            }

            await withGitHubRetry(
              'Recovery alert: comment on recovered alert',
              () => github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: alert.number,
                body
              }),
              async () => {
                const { data: comments } = await withGitHubRetry('Recovery alert: reconcile recovered alert comment', () =>
                  github.rest.issues.listComments({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: alert.number,
                    per_page: 100
                  })
                );
                const existingComment = comments.find((comment) => comment.body === body);
                return existingComment ? { data: existingComment } : undefined;
              }
            );
            await withGitHubRetry(
              'Recovery alert: close recovered alert',
              () => github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: alert.number,
                state: 'closed',
                state_reason: 'completed'
              }),
              async () => {
                const { data: currentAlert } = await withGitHubRetry('Recovery alert: reconcile recovered alert closure', () =>
                  github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: alert.number
                  })
                );
                return currentAlert.state === 'closed' ? { data: currentAlert } : undefined;
              }
            );
            core.info(`Closed recovered maintainer alert #${alert.number}.`);

  build-windows:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Windows Android SDK setup
        shell: pwsh
        run: ./scripts/test-setup-android-sdk.ps1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install and verify Android toolchain from Gradle pins
        shell: pwsh
        run: ./scripts/setup-android-sdk.ps1

      - name: Verify Windows application metadata
        shell: pwsh
        run: |
          $expectedDescription = "SafeNet DNS is a secure DNS management application with AI Shield protection, firewall rules, dynamic DNS updating, and access logging."
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $description = $package.description

          if ([string]::IsNullOrWhiteSpace($description)) {
            Write-Error "package.json is missing a non-empty description. Expected: $expectedDescription"
            exit 1
          }

          if ($description -cne $expectedDescription) {
            Write-Error "package.json description changed unexpectedly. Expected: $expectedDescription"
            exit 1
          }

          Write-Host "Verified package.json contains the intended SafeNet DNS description."

      - name: Check TypeScript
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build web app for Windows
        shell: pwsh
        env:
          DESKTOP_API_URL: https://safe-net-shield-official.replit.app
        run: |
          $apiOrigin = node scripts/validate-mobile-api.mjs $env:DESKTOP_API_URL
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $env:VITE_API_URL = $apiOrigin
          npm run build

      - name: Sync Android web assets for Windows
        shell: bash
        env:
          MOBILE_API_URL: https://safe-net-shield-official.replit.app
        run: ./scripts/build-android.sh

      - name: Build debug APK on Windows
        id: build-windows-android
        working-directory: android
        shell: pwsh
        run: .\gradlew.bat assembleDebug

      - name: Upload Windows Android build evidence
        if: ${{ failure() && steps.build-windows-android.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Windows-Android-build-evidence
          path: |
            android/app/build/reports
            android/app/build/outputs/apk
          if-no-files-found: warn

      - name: Verify Windows debug APK
        shell: pwsh
        run: |
          $apkPath = Join-Path $env:GITHUB_WORKSPACE "android\app\build\outputs\apk\debug\app-debug.apk"
          if (-not (Test-Path -LiteralPath $apkPath -PathType Leaf)) {
            Write-Error "Expected Windows Android debug APK was not produced: $apkPath"
            exit 1
          }

          $apk = Get-Item -LiteralPath $apkPath
          if ($apk.Length -le 0) {
            Write-Error "Windows Android debug APK is empty: $apkPath"
            exit 1
          }

          Write-Host "Verified Windows Android debug APK: $apkPath ($($apk.Length) bytes)"

      - name: Build Windows installer
        id: build-windows-installer
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP "electron-builder.log"

          & npx electron-builder --win --x64 --publish never 2>&1 |
            Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
            Write-Error "Electron builder failed with exit code $exitCode. See $logPath for captured output."
            exit $exitCode
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer build evidence
        if: ${{ failure() && steps.build-windows-installer.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Windows-installer-build-evidence
          path: |
            ${{ runner.temp }}/electron-builder.log
            dist-electron/**/*.log
            dist-electron/*.msi
          if-no-files-found: warn

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Windows
          path: dist-electron/*.msi

  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android
          path: artifacts/android

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Windows
          path: artifacts/windows

      - name: Verify release installers
        shell: bash
        run: |
          set -euo pipefail

          apk_count=$(find artifacts/android -maxdepth 1 -type f -name 'app-release.apk' | wc -l)
          msi_count=$(find artifacts/windows -maxdepth 1 -type f -name '*.msi' | wc -l)

          if [[ "$apk_count" -eq 0 ]]; then
            echo "::error::Android APK installer is missing from artifacts/android"
            exit 1
          fi

          if [[ "$msi_count" -eq 0 ]]; then
            echo "::error::Windows MSI installer is missing from artifacts/windows"
            exit 1
          fi

          echo "Verified $apk_count APK installer(s) and $msi_count MSI installer(s)."

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/android/*.apk
            artifacts/windows/*.msi
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
