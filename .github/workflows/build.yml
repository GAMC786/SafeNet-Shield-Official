name: Build Android APK and Windows MSI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build and sync mobile web assets
        run: ./scripts/build-android.sh
        env:
          MOBILE_API_URL: https://safe-net-shield-official.replit.app

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Windows application metadata
        shell: pwsh
        run: |
          $expectedDescription = "SafeNet DNS is a secure DNS management application with AI Shield protection, firewall rules, dynamic DNS updating, and access logging."
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $description = $package.description

          if ([string]::IsNullOrWhiteSpace($description)) {
            Write-Error "package.json is missing a non-empty description. Expected: $expectedDescription"
            exit 1
          }

          if ($description -cne $expectedDescription) {
            Write-Error "package.json description changed unexpectedly. Expected: $expectedDescription"
            exit 1
          }

          Write-Host "Verified package.json contains the intended SafeNet DNS description."

      - name: Check TypeScript
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build web app for Windows
        shell: pwsh
        env:
          DESKTOP_API_URL: https://safe-net-shield-official.replit.app
        run: |
          $apiOrigin = node scripts/validate-mobile-api.mjs $env:DESKTOP_API_URL
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $env:VITE_API_URL = $apiOrigin
          npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Windows
          path: dist-electron/*.msi

  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android
          path: artifacts/android

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Windows
          path: artifacts/windows

      - name: Verify release installers
        shell: bash
        run: |
          set -euo pipefail

          apk_count=$(find artifacts/android -maxdepth 1 -type f -name '*.apk' | wc -l)
          msi_count=$(find artifacts/windows -maxdepth 1 -type f -name '*.msi' | wc -l)

          if [[ "$apk_count" -eq 0 ]]; then
            echo "::error::Android APK installer is missing from artifacts/android"
            exit 1
          fi

          if [[ "$msi_count" -eq 0 ]]; then
            echo "::error::Windows MSI installer is missing from artifacts/windows"
            exit 1
          fi

          echo "Verified $apk_count APK installer(s) and $msi_count MSI installer(s)."

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/android/*.apk
            artifacts/windows/*.msi
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
