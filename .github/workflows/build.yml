name: Build Android APK and Windows MSI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build and sync mobile web assets
        run: ./scripts/build-android.sh
        env:
          MOBILE_API_URL: https://safe-net-shield-official.replit.app

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  android-smoke:
    name: Android API 33 smoke test
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      MOBILE_API_URL: https://safe-net-shield-official.replit.app
      ANDROID_SMOKE_EVIDENCE_DIR: android/app/build/android-smoke
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify authenticated smoke backend
        shell: bash
        run: |
          set -euo pipefail

          node scripts/validate-mobile-api.mjs "$MOBILE_API_URL" >/dev/null
          status="$(curl --fail --silent --show-error --max-time 20 \
            -H 'Accept: application/json' \
            "$MOBILE_API_URL/api/auth/status")"
          export AUTH_STATUS="$status"
          node <<'NODE'
          const status = JSON.parse(process.env.AUTH_STATUS);
          if (status.authenticated !== true || status.pinRequired !== false) {
            console.error(
              "The release smoke backend must be authenticated without an interactive PIN.",
              status,
            );
            process.exit(1);
          }
          console.log("Smoke backend is reachable and non-interactively authenticated.");
          NODE

      - name: Prepare Android test project
        run: ./scripts/build-android.sh

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android
          path: android/app/build/outputs/apk/debug

      - name: Run Android smoke test on API 33 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./scripts/android-smoke-test.sh --apk android/app/build/outputs/apk/debug/app-debug.apk --reset-data

      - name: Require a real smoke-test pass
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result_file="android/app/build/android-smoke/run.log"
          if [[ ! -f "$result_file" ]]; then
            echo "::error::Android smoke test did not produce run.log."
            exit 1
          fi
          if [[ "$(tail -n 1 "$result_file")" != "RESULT: PASS" ]]; then
            echo "::error::Android smoke test did not end with RESULT: PASS."
            tail -n 20 "$result_file"
            exit 1
          fi

      - name: Upload Android smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Android-Smoke-Evidence
          if-no-files-found: warn
          retention-days: 30
          path: |
            android/app/build/android-smoke/run.log
            android/app/build/android-smoke/active-ui.xml
            android/app/build/android-smoke/dns-query.txt
            android/app/build/android-smoke/https-test.txt

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Windows application metadata
        shell: pwsh
        run: |
          $expectedDescription = "SafeNet DNS is a secure DNS management application with AI Shield protection, firewall rules, dynamic DNS updating, and access logging."
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $description = $package.description

          if ([string]::IsNullOrWhiteSpace($description)) {
            Write-Error "package.json is missing a non-empty description. Expected: $expectedDescription"
            exit 1
          }

          if ($description -cne $expectedDescription) {
            Write-Error "package.json description changed unexpectedly. Expected: $expectedDescription"
            exit 1
          }

          Write-Host "Verified package.json contains the intended SafeNet DNS description."

      - name: Check TypeScript
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build web app for Windows
        shell: pwsh
        env:
          DESKTOP_API_URL: https://safe-net-shield-official.replit.app
        run: |
          $apiOrigin = node scripts/validate-mobile-api.mjs $env:DESKTOP_API_URL
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $env:VITE_API_URL = $apiOrigin
          npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Windows
          path: dist-electron/*.msi

  release:
    needs: [build-android, build-windows, android-smoke]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android
          path: artifacts/android

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Windows
          path: artifacts/windows

      - name: Download Android smoke evidence
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android-Smoke-Evidence
          path: artifacts/android-smoke

      - name: Verify release installers
        shell: bash
        run: |
          set -euo pipefail

          apk_count=$(find artifacts/android -maxdepth 1 -type f -name '*.apk' | wc -l)
          msi_count=$(find artifacts/windows -maxdepth 1 -type f -name '*.msi' | wc -l)
          required_evidence=(
            artifacts/android-smoke/run.log
            artifacts/android-smoke/active-ui.xml
            artifacts/android-smoke/dns-query.txt
            artifacts/android-smoke/https-test.txt
          )

          if [[ "$apk_count" -eq 0 ]]; then
            echo "::error::Android APK installer is missing from artifacts/android"
            exit 1
          fi

          if [[ "$msi_count" -eq 0 ]]; then
            echo "::error::Windows MSI installer is missing from artifacts/windows"
            exit 1
          fi

          for evidence_file in "${required_evidence[@]}"; do
            if [[ ! -s "$evidence_file" ]]; then
              echo "::error::Android smoke evidence is missing: $evidence_file"
              exit 1
            fi
          done

          if [[ "$(tail -n 1 artifacts/android-smoke/run.log)" != "RESULT: PASS" ]]; then
            echo "::error::Android smoke evidence does not end with RESULT: PASS"
            exit 1
          fi

          echo "Verified $apk_count APK installer(s), $msi_count MSI installer(s), and all Android smoke evidence."

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/android/*.apk
            artifacts/windows/*.msi
            artifacts/android-smoke/run.log
            artifacts/android-smoke/active-ui.xml
            artifacts/android-smoke/dns-query.txt
            artifacts/android-smoke/https-test.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
