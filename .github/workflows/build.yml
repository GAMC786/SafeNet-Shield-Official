name: Build Android APK and Windows MSI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1-5'
    # Keep hosted Windows and macOS workflow-lint installers exercised without
    # adding the matrix to every weekday release smoke run.
    - cron: '47 4 1 * *'
  workflow_dispatch:
    inputs:
      android_resolver_mode:
        description: "Resolver mode for the Android smoke lane"
        required: true
        default: fixture
        type: choice
        options:
          - fixture
          - public
      dns_alert_validation:
        description: "Maintainer-only DNS alert lifecycle validation"
        required: true
        default: none
        type: choice
        options:
          - none
          - lifecycle
      cross_platform_workflow_lint:
        description: "Run the pinned workflow lint installer on Windows and macOS"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-release-workflow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read workflow lint versions from package.json
        id: workflow-lint-versions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from "node:fs";
          import { getRequiredVersions } from "./scripts/setup-workflow-lint.mjs";

          try {
            const manifest = JSON.parse(readFileSync("package.json", "utf8"));
            const versions = getRequiredVersions(manifest);
            for (const [tool, version] of Object.entries(versions)) {
              if (!/^\d+\.\d+\.\d+$/.test(version)) {
                throw new Error(
                  `package.json workflowLint.${tool} must be a complete semantic version; received "${version}".`,
                );
              }
              console.error(`Using workflowLint.${tool} ${version}.`);
              console.log(`${tool}_version=${version}`);
            }
          } catch (error) {
            console.error(
              `Workflow lint version check failed: ${error.message}`,
            );
            process.exit(1);
          }
          NODE

      - name: Install pinned ShellCheck
        shell: bash
        env:
          SHELLCHECK_VERSION: ${{ steps.workflow-lint-versions.outputs.shellcheck_version }}
        run: |
          set -euo pipefail
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl --fail --silent --show-error --location \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          tar -xJf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          install -m 0755 \
            "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            "${RUNNER_TEMP}/shellcheck"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/shellcheck" --version

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2
        with:
          version: ${{ steps.workflow-lint-versions.outputs.actionlint_version }}
          files: .github/workflows/*.yml, .github/workflows/*.yaml

  cross-platform-workflow-lint:
    name: Workflow lint (${{ matrix.platform }} ${{ matrix.architecture }} on ${{ matrix.runner }})
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.cross_platform_workflow_lint) ||
      (github.event_name == 'schedule' && github.event.schedule == '47 4 1 * *')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the hosted runner label, platform, and architecture together.
          # Update the entry as a unit when GitHub retires or replaces an image.
          - runner: windows-latest
            platform: Windows
            architecture: x64
          - runner: macos-13
            platform: macOS
            architecture: x64
          - runner: macos-14
            platform: macOS
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      WORKFLOW_LINT_PLATFORM: ${{ matrix.platform }}
      WORKFLOW_LINT_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - name: Checkout disposable workflow lint workspace
        id: checkout_workspace
        uses: actions/checkout@v4
        with:
          path: workflow-lint-checkout

      - name: Setup Node.js
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned workflow lint tools
        id: setup_workflow_lint
        working-directory: workflow-lint-checkout
        shell: bash
        run: |
          set -o pipefail
          npm run setup:workflow-lint 2>&1 | tee "$RUNNER_TEMP/workflow-lint.log"

      - name: Lint workflows with installed tools
        id: lint_workflows
        working-directory: workflow-lint-checkout
        shell: bash
        run: |
          set -o pipefail
          npm run lint:workflows 2>&1 | tee -a "$RUNNER_TEMP/workflow-lint.log"

      - name: Report workflow lint failure stage
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout_workspace.outcome }}
          NODE_OUTCOME: ${{ steps.setup_node.outcome }}
          SETUP_OUTCOME: ${{ steps.setup_workflow_lint.outcome }}
          LINT_OUTCOME: ${{ steps.lint_workflows.outcome }}
        run: |
          set -u
          stage="completed"
          outcome="success"

          if [[ "$CHECKOUT_OUTCOME" != "success" ]]; then
            stage="checkout"
            outcome="$CHECKOUT_OUTCOME"
          elif [[ "$NODE_OUTCOME" != "success" ]]; then
            stage="node setup"
            outcome="$NODE_OUTCOME"
          elif [[ "$SETUP_OUTCOME" != "success" ]]; then
            stage="workflow lint setup"
            outcome="$SETUP_OUTCOME"
          elif [[ "$LINT_OUTCOME" != "success" ]]; then
            stage="workflow lint"
            outcome="$LINT_OUTCOME"
          fi

          if [[ "$stage" == "completed" ]]; then
            echo "Workflow lint passed on ${WORKFLOW_LINT_PLATFORM}/${WORKFLOW_LINT_ARCHITECTURE}."
            exit 0
          fi

          message="Workflow lint failed on ${WORKFLOW_LINT_PLATFORM}/${WORKFLOW_LINT_ARCHITECTURE} during ${stage} (outcome: ${outcome})."
          echo "::error title=${WORKFLOW_LINT_PLATFORM}/${WORKFLOW_LINT_ARCHITECTURE} workflow lint failure::${message}"
          {
            echo "## Cross-platform workflow lint failure"
            echo
            echo "- **Platform:** ${WORKFLOW_LINT_PLATFORM}"
            echo "- **Architecture:** ${WORKFLOW_LINT_ARCHITECTURE}"
            echo "- **Failed stage:** ${stage}"
            echo "- **Outcome:** ${outcome}"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "## Cross-platform workflow lint failure"
            echo
            echo "- **Platform:** ${WORKFLOW_LINT_PLATFORM}"
            echo "- **Architecture:** ${WORKFLOW_LINT_ARCHITECTURE}"
            echo "- **Failed stage:** ${stage}"
            echo "- **Outcome:** ${outcome}"
            if [[ -f "$RUNNER_TEMP/workflow-lint.log" ]]; then
              echo
              echo "### Recent captured output (bounded)"
              echo '```text'
              tail -n 120 "$RUNNER_TEMP/workflow-lint.log" | head -c 16000
              echo
              echo '```'
            fi
          } > "$RUNNER_TEMP/workflow-lint-failure-summary.md"
          exit 1

      - name: Record workflow lint outcome
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout_workspace.outcome }}
          NODE_OUTCOME: ${{ steps.setup_node.outcome }}
          SETUP_OUTCOME: ${{ steps.setup_workflow_lint.outcome }}
          LINT_OUTCOME: ${{ steps.lint_workflows.outcome }}
          WORKFLOW_LINT_RUNNER: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { join } from "node:path";

          const steps = [
            ["checkout", process.env.CHECKOUT_OUTCOME],
            ["node setup", process.env.NODE_OUTCOME],
            ["workflow lint setup", process.env.SETUP_OUTCOME],
            ["workflow lint", process.env.LINT_OUTCOME],
          ];
          const failedStep = steps.find(([, outcome]) => outcome !== "success");
          const result = {
            platform: process.env.WORKFLOW_LINT_PLATFORM,
            architecture: process.env.WORKFLOW_LINT_ARCHITECTURE,
            runner: process.env.WORKFLOW_LINT_RUNNER,
            stage: failedStep?.[0] ?? "completed",
            outcome: failedStep?.[1] ?? "success",
          };
          const filename =
            `workflow-lint-result-${result.platform}-${result.architecture}.json`;
          writeFileSync(
            join(process.env.RUNNER_TEMP, filename),
            `${JSON.stringify(result, null, 2)}\n`,
          );
          NODE

      - name: Upload workflow lint outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-workflow-lint-outcome-${{ matrix.platform }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/workflow-lint-result-*.json
          if-no-files-found: error

      - name: Upload workflow lint failure details
        id: upload_workflow_lint_failure_details
        if: >-
          always() &&
          (steps.checkout_workspace.outcome == 'failure' ||
          steps.setup_node.outcome == 'failure' ||
          steps.setup_workflow_lint.outcome == 'failure' ||
          steps.lint_workflows.outcome == 'failure')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-workflow-lint-failure-details-${{ matrix.platform }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/workflow-lint-failure-summary.md
          if-no-files-found: warn

      - name: Link workflow lint failure details
        if: >-
          always() &&
          (steps.checkout_workspace.outcome == 'failure' ||
          steps.setup_node.outcome == 'failure' ||
          steps.setup_workflow_lint.outcome == 'failure' ||
          steps.lint_workflows.outcome == 'failure')
        shell: bash
        env:
          EVIDENCE_URL: ${{ steps.upload_workflow_lint_failure_details.outputs.artifact-url || format('{0}/{1}/actions/runs/{2}#artifacts', github.server_url, github.repository, github.run_id) }}
        run: |
          set -u
          echo "- **Bounded failure details:** [Download the ${WORKFLOW_LINT_PLATFORM}/${WORKFLOW_LINT_ARCHITECTURE} summary]($EVIDENCE_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Failure details: $EVIDENCE_URL"

  cross-platform-workflow-lint-summary:
    name: Monthly workflow lint health
    needs: cross-platform-workflow-lint
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.cross_platform_workflow_lint) ||
      (github.event_name == 'schedule' && github.event.schedule == '47 4 1 * *'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: workflow-lint-history
      cancel-in-progress: false
    steps:
      - name: Checkout default branch for lint history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Download workflow lint outcomes
        uses: actions/download-artifact@v4
        with:
          pattern: SafeNet-DNS-workflow-lint-outcome-*
          path: ${{ runner.temp }}/workflow-lint-results
          merge-multiple: true

      - name: Publish monthly workflow lint health
        shell: bash
        env:
          LINT_RESULT: ${{ needs.cross-platform-workflow-lint.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$LINT_RESULT" == "success" ]]; then
            health="passed"
            message="Windows and macOS workflow lint installers completed successfully."
          else
            health="failed"
            message="At least one Windows or macOS workflow lint installer failed; inspect that matrix job's bounded details."
          fi

          {
            echo "## Monthly cross-platform workflow lint"
            echo
            echo "- **Health:** ${health}"
            echo "- **Matrix result:** \`${LINT_RESULT}\`"
            echo "- **Workflow run:** [Open run](${RUN_URL})"
            echo
            echo "$message"
            echo
            echo "Android build and release health is reported separately."
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$LINT_RESULT" != "success" ]]; then
            echo "::error title=Monthly cross-platform workflow lint failed::${message}"
            exit 1
          fi

      - name: Record workflow lint history
        if: always()
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RESULTS_DIRECTORY: ${{ runner.temp }}/workflow-lint-results
        run: |
          set -euo pipefail
          RECORDED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export RECORDED_AT
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          node --input-type=module <<'NODE'
          import {
            existsSync,
            readdirSync,
            readFileSync,
            writeFileSync,
          } from "node:fs";

          const historyPath = ".github/workflow-lint-history.json";
          const resultsDirectory = process.env.RESULTS_DIRECTORY;
          const resultFiles = readdirSync(resultsDirectory)
            .filter((file) => file.endsWith(".json"))
            .sort();

          if (resultFiles.length !== 3) {
            throw new Error(
              `Expected 3 workflow lint outcomes, found ${resultFiles.length}.`,
            );
          }

          const results = resultFiles.map((file) => {
            const result = JSON.parse(
              readFileSync(`${resultsDirectory}/${file}`, "utf8"),
            );
            for (const field of [
              "platform",
              "architecture",
              "runner",
              "stage",
              "outcome",
            ]) {
              if (typeof result[field] !== "string" || result[field].length === 0) {
                throw new Error(`Workflow lint outcome ${file} is missing ${field}.`);
              }
            }
            return result;
          });

          const previous = existsSync(historyPath)
            ? JSON.parse(readFileSync(historyPath, "utf8"))
            : { schema_version: 1, retention_runs: 24, runs: [] };
          if (
            previous.schema_version !== 1 ||
            !Number.isInteger(previous.retention_runs) ||
            previous.retention_runs < 1 ||
            !Array.isArray(previous.runs)
          ) {
            throw new Error(`${historyPath} has an unsupported schema.`);
          }

          const run = {
            run_id: String(process.env.RUN_ID),
            run_attempt: Number(process.env.RUN_ATTEMPT),
            event: process.env.EVENT_NAME,
            recorded_at: process.env.RECORDED_AT,
            ref: process.env.REF_NAME,
            commit: process.env.COMMIT_SHA,
            results,
          };
          const existingRuns = previous.runs.filter(
            (previousRun) => String(previousRun.run_id) === run.run_id,
          );
          const latestExistingRun = existingRuns.reduce(
            (latest, previousRun) =>
              !latest ||
              Number(previousRun.run_attempt) > Number(latest.run_attempt)
                ? previousRun
                : latest,
            undefined,
          );
          const authoritativeRun =
            latestExistingRun &&
            Number(latestExistingRun.run_attempt) > run.run_attempt
              ? latestExistingRun
              : run;
          const independentRuns = previous.runs.filter(
            (previousRun) => String(previousRun.run_id) !== run.run_id,
          );
          const history = {
            schema_version: 1,
            retention_runs: previous.retention_runs,
            runs: [authoritativeRun, ...independentRuns].slice(0, previous.retention_runs),
          };
          writeFileSync(historyPath, `${JSON.stringify(history, null, 2)}\n`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflow-lint-history.json
          if git diff --cached --quiet; then
            echo "Workflow lint history is already current."
            exit 0
          fi
          git commit -m "Record hosted-runner workflow lint health"
          git push origin "HEAD:$DEFAULT_BRANCH"

  build-android:
    needs: validate-release-workflow
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      ANDROID_SMOKE_RESOLVER_MODE: ${{ github.event_name == 'schedule' && 'public' || github.event.inputs.android_resolver_mode || 'fixture' }}
      ANDROID_SMOKE_COVERAGE: ${{ github.event_name == 'schedule' && 'external-network' || github.event.inputs.android_resolver_mode == 'public' && 'external-network' || 'controlled-fixture' }}
      DNS_ALERT_VALIDATION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dns_alert_validation || 'none' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install and verify Android toolchain from Gradle pins
        shell: bash
        run: ./scripts/setup-android-sdk.sh

      - name: Preflight Android emulator system trust
        id: android-system-trust-preflight
        if: "!startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && env.ANDROID_SMOKE_RESOLVER_MODE == 'fixture'"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Manual and scheduled checks retain the hosted preflight. Tagged
          # releases use the dedicated writable-system runner below.
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -writable-system
          script: ./scripts/android-smoke-test.sh --preflight --output "$GITHUB_WORKSPACE/android/app/build/reports/android-smoke/latest/preflight"
        env:
          ANDROID_EMULATOR_API_LEVEL: 34
          ANDROID_EMULATOR_TARGET: google_apis
          ANDROID_EMULATOR_ARCH: x86_64
          ANDROID_EMULATOR_SYSTEM_IMAGE: system-images;android-34;google_apis;x86_64

      - name: Build and sync mobile web assets
        run: ./scripts/build-android.sh
        env:
          MOBILE_API_URL: https://safe-net-shield-official.replit.app

      - name: Build debug APK
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Decode Android release keystore
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 repository secret is required for release builds."
            exit 1
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/safenet-release.keystore"
          chmod 600 "${RUNNER_TEMP}/safenet-release.keystore"

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        working-directory: android
        run: ./gradlew assembleRelease
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/safenet-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload signed release APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Android
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Build release instrumentation APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        working-directory: android
        # The application release was already built and signed above. The
        # instrumentation APK uses the test signing configuration, so do not
        # re-run the application release-signing guard for this task.
        run: ./gradlew :app:assembleReleaseAndroidTest -x verifyReleaseSigning
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/safenet-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify release instrumentation APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          test_apk="android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk"
          if [[ ! -f "$test_apk" ]]; then
            echo "::error::Release instrumentation APK is missing: $test_apk"
            exit 1
          fi
          echo "Verified release instrumentation APK: $test_apk"

      - name: Upload release instrumentation APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Android-instrumentation
          path: android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk

      - name: Run Android DNS smoke tests on emulator (${{ env.ANDROID_SMOKE_COVERAGE }})
        id: android-dns-smoke
        if: "!startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')"
        continue-on-error: ${{ github.event_name == 'schedule' || env.DNS_ALERT_VALIDATION == 'lifecycle' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 34 avoids the hosted API 35 image's intermittent offline boot
          # and storage-service failures while still exercising the minSdk 24 app.
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -writable-system
          # Release/tag smoke checks use the local fixture by default so a
          # public resolver outage cannot fail the release lane. Scheduled
          # checks intentionally use public resolvers and are non-blocking.
          script: ./scripts/android-smoke-test.sh --apk "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk" --test-apk "$GITHUB_WORKSPACE/android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk"
        env:
          ANDROID_EMULATOR_API_LEVEL: 34
          ANDROID_EMULATOR_TARGET: google_apis
          ANDROID_EMULATOR_ARCH: x86_64
          ANDROID_EMULATOR_SYSTEM_IMAGE: system-images;android-34;google_apis;x86_64

      - name: Upload Android DNS smoke evidence
        id: upload-android-dns-smoke-evidence
        if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Android-smoke-evidence-${{ env.ANDROID_SMOKE_COVERAGE }}
          path: android/app/build/reports/android-smoke/latest
          if-no-files-found: warn

      - name: Alert maintainers about public DNS smoke failure
        # workflow_dispatch is only enabled for the explicit lifecycle choice.
        # Ordinary fixture dispatches retain the schedule-only production path.
        if: always() && ((github.event_name == 'schedule' && env.ANDROID_SMOKE_COVERAGE == 'external-network' && steps.android-dns-smoke.outcome == 'failure') || (github.event_name == 'workflow_dispatch' && env.DNS_ALERT_VALIDATION == 'lifecycle'))
        uses: actions/github-script@v7
        env:
          ALERT_TITLE: "[Maintainer alert] Scheduled public DNS smoke failure"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVIDENCE_URL: ${{ steps.upload-android-dns-smoke-evidence.outputs.artifact-url || format('{0}/{1}/actions/runs/{2}#artifacts', github.server_url, github.repository, github.run_id) }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = process.env.ALERT_TITLE;
            const runUrl = process.env.RUN_URL;
            const evidenceUrl = process.env.EVIDENCE_URL;
            const body = [
              'The scheduled public-network Android DNS smoke check failed.',
              '',
              `Workflow run: [View run](${runUrl})`,
              `Evidence artifact: ${evidenceUrl ? `[Download smoke evidence](${evidenceUrl})` : 'The evidence artifact URL was not returned; see the run artifacts.'}`,
              '',
              'This alert is informational and does not block releases.'
            ].join('\n');

            const labelName = 'maintainer-alert';
            const labelColor = 'b60205';
            const maxAttempts = 3;
            const isTransientGitHubError = (error) => {
              const status = Number(error?.status);
              const transientCodes = ['ECONNRESET', 'ETIMEDOUT', 'EAI_AGAIN', 'ENOTFOUND'];
              const rateLimitRemaining = error?.response?.headers?.['x-ratelimit-remaining'];
              return status === 408 ||
                status === 429 ||
                status >= 500 ||
                transientCodes.includes(error?.code) ||
                (status === 403 && rateLimitRemaining === '0');
            };
            const withGitHubRetry = async (operation, request, reconcile) => {
              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                try {
                  const result = await request();
                  if (attempt > 1) {
                    core.info(`${operation} succeeded after ${attempt} attempts.`);
                  }
                  return result;
                } catch (error) {
                  if (!isTransientGitHubError(error)) {
                    throw error;
                  }
                  if (reconcile) {
                    try {
                      const reconciled = await reconcile();
                      if (reconciled) {
                        core.info(`${operation} response was ambiguous; reconciled with GitHub.`);
                        return reconciled;
                      }
                    } catch {
                      core.warning(`${operation} reconciliation check failed; retrying original request.`);
                    }
                  }
                  if (attempt === maxAttempts) {
                    core.error(`${operation} failed after ${attempt} attempt(s).`);
                    throw error;
                  }
                  core.warning(
                    `${operation} hit a transient GitHub API failure on attempt ${attempt}/${maxAttempts}; retrying.`,
                  );
                  await new Promise((resolve) => setTimeout(resolve, 1000 * 2 ** (attempt - 1)));
                }
              }
              throw new Error(`${operation} exhausted its retry attempts.`);
            };

            try {
              await withGitHubRetry('Failure alert: check maintainer-alert label', () =>
                github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName
                })
              );
            } catch (error) {
              if (error.status !== 404) throw error;
              await withGitHubRetry('Failure alert: create maintainer-alert label', () =>
                github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName,
                  color: labelColor,
                  description: 'Action required from maintainers'
                })
              );
            }

            const listOpenAlerts = () => withGitHubRetry('Failure alert: list open maintainer alerts', () =>
              github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: labelName,
                per_page: 100
              })
            );
            const { data: openAlerts } = await listOpenAlerts();
            const alert = openAlerts.find((issue) => issue.title === title);

            if (alert) {
              await withGitHubRetry(
                'Failure alert: comment on existing alert',
                () => github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: alert.number,
                  body
                }),
                async () => {
                  const { data: comments } = await withGitHubRetry('Failure alert: reconcile existing alert comment', () =>
                    github.rest.issues.listComments({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: alert.number,
                      per_page: 100
                    })
                  );
                  const existingComment = comments.find((comment) => comment.body === body);
                  return existingComment ? { data: existingComment } : undefined;
                }
              );
              core.info(`Updated existing maintainer alert #${alert.number}.`);
            } else {
              const { data: created } = await withGitHubRetry(
                'Failure alert: create issue',
                () => github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: [labelName]
                }),
                async () => {
                  const { data: currentOpenAlerts } = await listOpenAlerts();
                  const existingAlert = currentOpenAlerts.find((issue) => issue.title === title);
                  return existingAlert ? { data: existingAlert } : undefined;
                }
              );
              core.info(`Created maintainer alert #${created.number}.`);
            }

      - name: Close recovered public DNS smoke alert
        if: always() && ((github.event_name == 'schedule' && env.ANDROID_SMOKE_COVERAGE == 'external-network' && steps.android-dns-smoke.outcome == 'success') || (github.event_name == 'workflow_dispatch' && env.DNS_ALERT_VALIDATION == 'lifecycle'))
        uses: actions/github-script@v7
        env:
          ALERT_TITLE: "[Maintainer alert] Scheduled public DNS smoke failure"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = process.env.ALERT_TITLE;
            const runUrl = process.env.RUN_URL;
            const labelName = 'maintainer-alert';
            const body = [
              'The scheduled public-network Android DNS smoke check recovered successfully.',
              '',
              `Successful workflow run: [View run](${runUrl})`,
              '',
              'Closing this alert while preserving the previous failure history.'
            ].join('\n');
            const maxAttempts = 3;
            const isTransientGitHubError = (error) => {
              const status = Number(error?.status);
              const transientCodes = ['ECONNRESET', 'ETIMEDOUT', 'EAI_AGAIN', 'ENOTFOUND'];
              const rateLimitRemaining = error?.response?.headers?.['x-ratelimit-remaining'];
              return status === 408 ||
                status === 429 ||
                status >= 500 ||
                transientCodes.includes(error?.code) ||
                (status === 403 && rateLimitRemaining === '0');
            };
            const withGitHubRetry = async (operation, request, reconcile) => {
              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                try {
                  const result = await request();
                  if (attempt > 1) {
                    core.info(`${operation} succeeded after ${attempt} attempts.`);
                  }
                  return result;
                } catch (error) {
                  if (!isTransientGitHubError(error)) {
                    throw error;
                  }
                  if (reconcile) {
                    try {
                      const reconciled = await reconcile();
                      if (reconciled) {
                        core.info(`${operation} response was ambiguous; reconciled with GitHub.`);
                        return reconciled;
                      }
                    } catch {
                      core.warning(`${operation} reconciliation check failed; retrying original request.`);
                    }
                  }
                  if (attempt === maxAttempts) {
                    core.error(`${operation} failed after ${attempt} attempt(s).`);
                    throw error;
                  }
                  core.warning(
                    `${operation} hit a transient GitHub API failure on attempt ${attempt}/${maxAttempts}; retrying.`,
                  );
                  await new Promise((resolve) => setTimeout(resolve, 1000 * 2 ** (attempt - 1)));
                }
              }
              throw new Error(`${operation} exhausted its retry attempts.`);
            };

            const listOpenAlerts = () => withGitHubRetry('Recovery alert: list open maintainer alerts', () =>
              github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: labelName,
                per_page: 100
              })
            );
            let alert;
            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const { data: openAlerts } = await listOpenAlerts();
              alert = openAlerts.find((issue) => issue.title === title);
              if (alert || attempt === maxAttempts) break;
              core.warning(`Recovery alert: no open alert found yet; retrying lookup (${attempt}/${maxAttempts}).`);
              await new Promise((resolve) => setTimeout(resolve, 1000 * attempt));
            }

            if (!alert) {
              core.info('No open public DNS smoke alert found; nothing to close.');
              return;
            }

            await withGitHubRetry(
              'Recovery alert: comment on recovered alert',
              () => github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: alert.number,
                body
              }),
              async () => {
                const { data: comments } = await withGitHubRetry('Recovery alert: reconcile recovered alert comment', () =>
                  github.rest.issues.listComments({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: alert.number,
                    per_page: 100
                  })
                );
                const existingComment = comments.find((comment) => comment.body === body);
                return existingComment ? { data: existingComment } : undefined;
              }
            );
            await withGitHubRetry(
              'Recovery alert: close recovered alert',
              () => github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: alert.number,
                state: 'closed',
                state_reason: 'completed'
              }),
              async () => {
                const { data: currentAlert } = await withGitHubRetry('Recovery alert: reconcile recovered alert closure', () =>
                  github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: alert.number
                  })
                );
                return currentAlert.state === 'closed' ? { data: currentAlert } : undefined;
              }
            );
            core.info(`Closed recovered maintainer alert #${alert.number}.`);

  android-runner-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Keep this independent from the build and release jobs so a broken
    # runner is visible even when no release is waiting for it.
    runs-on: [self-hosted, linux, x64, android-writable-system]
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ANDROID_EMULATOR_API_LEVEL: 35
      ANDROID_AVD_NAME: safenet-writable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check dedicated Android release runner
        shell: bash
        run: |
          set -o pipefail
          ./scripts/provision-android-runner.sh --check 2>&1 |
            tee "$RUNNER_TEMP/android-runner-health.log"

  workflow-lint-history-watchdog:
    name: Verify monthly workflow lint record
    # The weekday schedule gives this check a chance to notice that the
    # first-of-month schedule was skipped, while keeping it independent from
    # both the matrix and the history commit job.
    if: github.event_name == 'schedule' && github.event.schedule == '17 4 * * 1-5'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Capture watchdog timestamp
        id: watchdog-time
        shell: bash
        run: echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Alert when the monthly workflow lint record is missing
        uses: actions/github-script@v7
        env:
          ALERT_TITLE: "[Maintainer alert] Monthly workflow lint record missing"
          CHECKED_AT: ${{ steps.watchdog-time.outputs.checked_at }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HISTORY_PATH: ".github/workflow-lint-history.json"
          HISTORY_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/.github/workflow-lint-history.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_FILE: "build.yml"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const checkedAt = new Date(process.env.CHECKED_AT);
            if (Number.isNaN(checkedAt.getTime())) {
              throw new Error(`Invalid watchdog timestamp: ${process.env.CHECKED_AT}`);
            }

            // The daily schedule runs before the monthly schedule on the
            // first day. Defer until the next weekday so that the expected
            // monthly run has had time to start and publish its artifacts.
            if (checkedAt.getUTCDate() === 1) {
              core.info('Deferring monthly workflow lint verification until after the first day of the month.');
              return;
            }

            const month = checkedAt.toISOString().slice(0, 7);
            const boundedScheduleWindow = `${month}-03`;
            const expectedOutcomes = [
              'Windows/x64',
              'macOS/x64',
              'macOS/arm64'
            ];
            const currentRunUrl = process.env.RUN_URL;
            const historyUrl = process.env.HISTORY_URL;
            const { owner, repo } = context.repo;

            const { data: runList } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: process.env.WORKFLOW_FILE,
              event: 'schedule',
              branch: process.env.DEFAULT_BRANCH,
              per_page: 100
            });

            // A monthly run is distinguished from the weekday schedule by
            // the presence of the conditional cross-platform lint matrix.
            // Only inspect the first three UTC days, keeping API work bounded
            // even if the workflow runs frequently for other reasons.
            const candidateRuns = runList.workflow_runs
              .filter((run) => {
                const createdDate = String(run.created_at).slice(0, 10);
                return createdDate >= `${month}-01` && createdDate <= boundedScheduleWindow;
              })
              .sort((left, right) =>
                String(right.created_at).localeCompare(String(left.created_at)),
              )
              .slice(0, 10);

            let monthlyRun;
            for (const candidate of candidateRuns) {
              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: candidate.id,
                per_page: 100
              });
              if (jobs.jobs.some((job) => String(job.name).startsWith('Workflow lint ('))) {
                monthlyRun = candidate;
                break;
              }
            }

            const findings = [];
            if (!monthlyRun) {
              const nearestRun = candidateRuns[0];
              findings.push(
                `No scheduled workflow run containing the cross-platform lint matrix was found for ${month}.`,
              );
              if (nearestRun?.html_url) {
                findings.push(`The nearest scheduled run was [${nearestRun.id}](${nearestRun.html_url}); inspect why the monthly matrix was skipped.`);
              }
            }

            let history;
            try {
              const { data: historyFile } = await github.rest.repos.getContent({
                owner,
                repo,
                path: process.env.HISTORY_PATH,
                ref: process.env.DEFAULT_BRANCH
              });
              if (Array.isArray(historyFile) || !historyFile.content) {
                throw new Error('history path did not return a file');
              }
              history = JSON.parse(
                Buffer.from(historyFile.content, historyFile.encoding || 'base64').toString('utf8'),
              );
            } catch (error) {
              const reason = error.status === 404
                ? 'the file was not found'
                : 'the file could not be read or parsed';
              findings.push(`The history file ${process.env.HISTORY_PATH} ${reason}.`);
            }

            if (monthlyRun && history) {
              const historyRun = Array.isArray(history.runs)
                ? history.runs.find((run) => String(run.run_id) === String(monthlyRun.id))
                : undefined;
              if (!historyRun) {
                findings.push(`The history file has no record for monthly workflow run ${monthlyRun.id}.`);
              } else if (!Array.isArray(historyRun.results)) {
                findings.push(`Monthly workflow run ${monthlyRun.id} has no outcome records in the history file.`);
              } else {
                const recordedOutcomes = new Set(
                  historyRun.results.map((result) =>
                    `${result?.platform}/${result?.architecture}`,
                  ),
                );
                const missingOutcomes = expectedOutcomes.filter(
                  (outcome) => !recordedOutcomes.has(outcome),
                );
                if (historyRun.results.length !== expectedOutcomes.length || missingOutcomes.length > 0) {
                  findings.push(
                    `Monthly workflow run ${monthlyRun.id} is missing outcome records: ${
                      missingOutcomes.length > 0 ? missingOutcomes.join(', ') : 'the expected three-record set'
                    }.`,
                  );
                }
              }
            }

            const labelName = 'maintainer-alert';
            if (findings.length === 0) {
              core.info(`Monthly workflow lint run ${monthlyRun.id} and all three history outcomes are present.`);

              const { data: openAlerts } = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'open',
                labels: labelName,
                per_page: 100
              });
              const alert = openAlerts.find((issue) => issue.title === process.env.ALERT_TITLE);

              if (!alert) {
                core.info('No open monthly workflow lint history alert found; nothing to close.');
                return;
              }

              const recoveryBody = [
                'The monthly hosted-runner workflow lint record recovered successfully.',
                '',
                `Successful workflow run: [${monthlyRun.id}](${monthlyRun.html_url || currentRunUrl})`,
                `History file: [Open ${process.env.HISTORY_PATH}](${historyUrl})`,
                '',
                'Closing this alert while preserving the previous finding history.'
              ].join('\n');
              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: alert.number,
                per_page: 100
              });
              if (!comments.some((comment) => comment.body === recoveryBody)) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: alert.number,
                  body: recoveryBody
                });
              }
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: alert.number,
                state: 'closed',
                state_reason: 'completed'
              });
              core.info(`Closed recovered monthly workflow lint history alert #${alert.number}.`);
              return;
            }

            const affectedRun = monthlyRun || candidateRuns[0];
            const affectedRunLink = affectedRun?.html_url
              ? `[View affected workflow run](${affectedRun.html_url})`
              : `No monthly run was found; [view the watchdog run](${currentRunUrl})`;
            const body = [
              'The monthly hosted-runner workflow lint record is missing or incomplete.',
              '',
              `Affected workflow run: ${affectedRunLink}`,
              `Watchdog run: [View check run](${currentRunUrl})`,
              `History file: [Open ${process.env.HISTORY_PATH}](${historyUrl})`,
              '',
              '**Findings:**',
              ...findings.map((finding) => `- ${finding}`),
              '',
              'No synthetic history entry was created. Rerun or repair the monthly schedule and verify the Windows/x64, macOS/x64, and macOS/arm64 outcome records.'
            ].join('\n');

            try {
              await github.rest.issues.getLabel({
                owner,
                repo,
                name: labelName
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: labelName,
                color: 'b60205',
                description: 'Action required from maintainers'
              });
            }

            const { data: openAlerts } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: labelName,
              per_page: 100
            });
            const alert = openAlerts.find((issue) => issue.title === process.env.ALERT_TITLE);

            if (!alert) {
              await github.rest.issues.create({
                owner,
                repo,
                title: process.env.ALERT_TITLE,
                body,
                labels: [labelName]
              });
              core.warning(`Created monthly workflow lint history alert for ${month}.`);
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: alert.number,
              per_page: 100
            });
            if (comments.some((comment) => comment.body === body)) {
              core.info(`Monthly workflow lint history alert #${alert.number} already contains this finding.`);
              return;
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: alert.number,
              body
            });
            core.warning(`Updated monthly workflow lint history alert #${alert.number}.`);

  android-release-smoke:
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    # This label is intentionally exclusive to a runner with KVM, adb root,
    # writable system overlays, and a disposable Android system image. A
    # hosted runner must not silently replace it for a signed release.
    runs-on: [self-hosted, linux, x64, android-writable-system]
    permissions:
      contents: read
    env:
      ANDROID_SMOKE_RESOLVER_MODE: fixture
      ANDROID_SMOKE_COVERAGE: controlled-fixture
      ANDROID_AVD_NAME: safenet-writable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify writable Android runner
        shell: bash
        run: ./scripts/provision-android-runner.sh --check

      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android
          path: artifacts/android

      - name: Download release instrumentation APK
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android-instrumentation
          path: artifacts/android-test

      - name: Verify release APK inputs
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/artifacts/android/app-release.apk"
          test_apk="$GITHUB_WORKSPACE/artifacts/android-test/app-release-androidTest.apk"
          test -s "$apk" || { echo "::error::Signed release APK is missing: $apk"; exit 1; }
          test -s "$test_apk" || { echo "::error::Release instrumentation APK is missing: $test_apk"; exit 1; }
          echo "Verified release APK inputs."

      - name: Run controlled-fixture smoke test on writable emulator
        id: android-release-dns-smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # AOSP ATD is a userdebug test image intended for instrumentation.
          # Unlike the hosted Google APIs image, the dedicated runner is
          # qualified for adb root and writable-system CA installation.
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          avd-name: ${{ env.ANDROID_AVD_NAME }}
          force-avd-creation: false
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -writable-system
          script: |
            set -euo pipefail
            ./scripts/android-smoke-test.sh \
              --preflight \
              --output "$GITHUB_WORKSPACE/android/app/build/reports/android-smoke/latest/preflight"
            ./scripts/android-smoke-test.sh \
              --apk "$GITHUB_WORKSPACE/artifacts/android/app-release.apk" \
              --test-apk "$GITHUB_WORKSPACE/artifacts/android-test/app-release-androidTest.apk" \
              --output "$GITHUB_WORKSPACE/android/app/build/reports/android-smoke/latest"
        env:
          ANDROID_EMULATOR_API_LEVEL: 35
          ANDROID_EMULATOR_TARGET: aosp_atd
          ANDROID_EMULATOR_ARCH: x86_64
          ANDROID_EMULATOR_SYSTEM_IMAGE: system-images;android-35;aosp_atd;x86_64

      - name: Upload release Android smoke evidence
        id: upload-release-android-smoke-evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Android-smoke-evidence-release
          path: android/app/build/reports/android-smoke/latest
          if-no-files-found: warn

      - name: Publish release Android smoke summary
        if: always()
        shell: bash
        env:
          SMOKE_STEP_OUTCOME: ${{ steps.android-release-dns-smoke.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVIDENCE_URL: ${{ steps.upload-release-android-smoke-evidence.outputs.artifact-url || format('{0}/{1}/actions/runs/{2}#artifacts', github.server_url, github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          evidence_dir="$GITHUB_WORKSPACE/android/app/build/reports/android-smoke/latest"
          category_file="$evidence_dir/failure-category.txt"
          category="EMULATOR_RUNNER_FAILURE"

          # The emulator action can fail before its script starts. Keep the
          # summary useful in that case, and only publish categories emitted
          # by the smoke script rather than arbitrary evidence-file content.
          if [[ -f "$category_file" ]]; then
            candidate="$(head -n 1 "$category_file" | tr -d '\r')"
            case "$candidate" in
              PASS|FIXTURE_FAILURE|ENETUNREACH|UNRELATED_NETWORK_FAILURE|NON_NETWORK_FAILURE)
                category="$candidate"
                ;;
              *)
                category="UNKNOWN_FAILURE"
                ;;
            esac
          fi

          {
            echo "## Android release smoke"
            echo
            echo "- **Failure category:** \`$category\`"
            echo "- **Smoke step:** \`$SMOKE_STEP_OUTCOME\`"
            echo "- **Workflow run:** [Open run]($RUN_URL)"
            echo "- **Evidence artifact:** [Download smoke evidence]($EVIDENCE_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Windows Android SDK setup
        shell: pwsh
        run: ./scripts/test-setup-android-sdk.ps1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install and verify Android toolchain from Gradle pins
        shell: pwsh
        run: ./scripts/setup-android-sdk.ps1

      - name: Verify Windows application metadata
        shell: pwsh
        run: |
          $expectedDescription = "SafeNet DNS is a secure DNS management application with AI Shield protection, firewall rules, dynamic DNS updating, and access logging."
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $description = $package.description

          if ([string]::IsNullOrWhiteSpace($description)) {
            Write-Error "package.json is missing a non-empty description. Expected: $expectedDescription"
            exit 1
          }

          if ($description -cne $expectedDescription) {
            Write-Error "package.json description changed unexpectedly. Expected: $expectedDescription"
            exit 1
          }

          Write-Host "Verified package.json contains the intended SafeNet DNS description."

      - name: Check TypeScript
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build web app for Windows
        shell: pwsh
        env:
          DESKTOP_API_URL: https://safe-net-shield-official.replit.app
        run: |
          $apiOrigin = node scripts/validate-mobile-api.mjs $env:DESKTOP_API_URL
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $env:VITE_API_URL = $apiOrigin
          npm run build

      - name: Sync Android web assets for Windows
        shell: bash
        env:
          MOBILE_API_URL: https://safe-net-shield-official.replit.app
        run: ./scripts/build-android.sh

      - name: Build debug APK on Windows
        id: build-windows-android
        working-directory: android
        shell: pwsh
        run: .\gradlew.bat assembleDebug

      - name: Upload Windows Android build evidence
        if: ${{ failure() && steps.build-windows-android.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Windows-Android-build-evidence
          path: |
            android/app/build/reports
            android/app/build/outputs/apk
          if-no-files-found: warn

      - name: Verify Windows debug APK
        shell: pwsh
        run: |
          $apkPath = Join-Path $env:GITHUB_WORKSPACE "android\app\build\outputs\apk\debug\app-debug.apk"
          if (-not (Test-Path -LiteralPath $apkPath -PathType Leaf)) {
            Write-Error "Expected Windows Android debug APK was not produced: $apkPath"
            exit 1
          }

          $apk = Get-Item -LiteralPath $apkPath
          if ($apk.Length -le 0) {
            Write-Error "Windows Android debug APK is empty: $apkPath"
            exit 1
          }

          Write-Host "Verified Windows Android debug APK: $apkPath ($($apk.Length) bytes)"

      - name: Build Windows installer
        id: build-windows-installer
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP "electron-builder.log"

          & npx electron-builder --win --x64 --publish never 2>&1 |
            Tee-Object -FilePath $logPath
          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
            Write-Error "Electron builder failed with exit code $exitCode. See $logPath for captured output."
            exit $exitCode
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer build evidence
        if: ${{ failure() && steps.build-windows-installer.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Windows-installer-build-evidence
          path: |
            ${{ runner.temp }}/electron-builder.log
            dist-electron/**/*.log
            dist-electron/*.msi
          if-no-files-found: warn

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-DNS-Windows
          path: dist-electron/*.msi

  release:
    needs: [build-android, build-windows, android-release-smoke]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Android
          path: artifacts/android

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SafeNet-DNS-Windows
          path: artifacts/windows

      - name: Verify release installers
        shell: bash
        run: |
          set -euo pipefail

          apk_count=$(find artifacts/android -maxdepth 1 -type f -name 'app-release.apk' | wc -l)
          msi_count=$(find artifacts/windows -maxdepth 1 -type f -name '*.msi' | wc -l)

          if [[ "$apk_count" -eq 0 ]]; then
            echo "::error::Android APK installer is missing from artifacts/android"
            exit 1
          fi

          if [[ "$msi_count" -eq 0 ]]; then
            echo "::error::Windows MSI installer is missing from artifacts/windows"
            exit 1
          fi

          echo "Verified $apk_count APK installer(s) and $msi_count MSI installer(s)."

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android/*.apk
            artifacts/windows/*.msi
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
