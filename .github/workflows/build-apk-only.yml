name: Build SafeNet Android APK only

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: build-apk
    runs-on: ubuntu-latest
    env:
      MOBILE_API_URL: https://safe-net-shield-official.replit.app
      VITE_REVENUECAT_ANDROID_API_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_API_KEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve and verify Android release version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node --input-type=module -e "import fs from 'node:fs'; process.stdout.write(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)")"
          if [[ -z "$package_version" ]]; then
            echo 'Could not resolve the app version metadata from package.json.' >&2
            exit 1
          fi
          bash scripts/resolve-android-release-metadata.sh \
            --expected-version "$package_version" \
            --expected-label package.json \
            --mismatch-prefix "App version mismatch" \
            --output "$GITHUB_OUTPUT"

      - name: Install dependencies with bounded retry
        id: npm_ci
        shell: bash
        run: bash scripts/npm-ci-with-retry.sh

      - name: Upload npm install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-Android-npm-ci-diagnostics
          path: ${{ runner.temp }}/npm-ci-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify production API availability
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 "$MOBILE_API_URL/api/settings")"
          RESPONSE="$response" node --input-type=module <<'NODE'
          const status = JSON.parse(process.env.RESPONSE);
          if (!status || typeof status.id !== 'number') {
            throw new Error(`Production API response is invalid: ${JSON.stringify(status)}`);
          }
          console.log('Production public API is available.');
          NODE

      - name: Build web assets and sync Android
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VITE_REVENUECAT_ANDROID_API_KEY" || {
            echo "::error::VITE_REVENUECAT_ANDROID_API_KEY is required for signed Android release builds." >&2
            exit 1
          }
          api_origin="$(node scripts/validate-mobile-api.mjs "$MOBILE_API_URL")"
          export VITE_API_URL="$api_origin"
          npm run build
          printf '{\n  "apiOrigin": "%s"\n}\n' "$api_origin" > dist/public/mobile-build.json
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default "tools" package was removed from the
          # Android SDK repository. The pinned installer below owns the
          # rest of the SDK toolchain.
          packages: 'platform-tools'

      - name: Install and verify Android toolchain from Gradle pins
        shell: bash
        run: ./scripts/setup-android-sdk.sh

      - name: Compile Android native sources before APK packaging
        id: android-native-compile
        shell: bash
        run: ./scripts/check-android-native-build.sh

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo 'ANDROID_KEYSTORE_BASE64 repository secret is required.' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/safenet-release.keystore"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/safenet-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK bundle
        id: verify-apk
        shell: bash
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
          APP_VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$apksigner" verify --verbose "$apk"
          "$aapt" dump badging "$apk" | grep -F "package: name='com.safenet.dns' versionCode='$APP_VERSION_CODE' versionName='$APP_VERSION'"
          stat -c '%n %s bytes' "$apk"

      - name: Generate APK SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          checksum_file="$RUNNER_TEMP/app-release.apk.sha256"
          checksum="$(sha256sum "$apk" | cut -d ' ' -f1)"
          printf '%s  app-release.apk\n' "$checksum" > "$checksum_file"
          (
            cd "$(dirname "$apk")"
            sha256sum --check "$checksum_file"
          )
          {
            echo '## Android APK release'
            echo
            echo "- APK: \`app-release.apk\`"
            echo "- SHA-256: \`$checksum\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare formal release assets
        id: prepare-release-assets
        shell: bash
        env:
          ANDROID_VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
          RELEASE_TAG: ${{ steps.app_version.outputs.release_tag }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/android-release-assets"
          apk="android/app/build/outputs/apk/release/app-release.apk"
          apk_asset="SafeNet-Android-APK-${RELEASE_TAG}.apk"
          checksum_asset="${apk_asset}.sha256"
          mkdir -p "$release_dir"
          cp "$apk" "$release_dir/$apk_asset"
          (
            cd "$release_dir"
            sha256sum "$apk_asset" > "$checksum_asset"
            sha256sum --check "$checksum_asset"
          )
          {
            echo "release_tag=$RELEASE_TAG"
            echo "apk_asset=$apk_asset"
            echo "checksum_asset=$checksum_asset"
            echo "release_dir=$release_dir"
          } >> "$GITHUB_OUTPUT"
          echo "Prepared formal release assets for Android version $ANDROID_VERSION_NAME:"
          ls -lh "$release_dir/$apk_asset" "$release_dir/$checksum_asset"

      - name: Upload APK only
        id: upload-apk-only
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-Android-APK-v${{ steps.app_version.outputs.version }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload APK SHA-256 checksum
        id: upload-apk-sha256
        uses: actions/upload-artifact@v4
        with:
          name: SafeNet-Android-APK-v${{ steps.app_version.outputs.version }}-SHA256
          path: ${{ runner.temp }}/app-release.apk.sha256
          if-no-files-found: error

      - name: Create or update formal GitHub Release
        id: publish-android-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: SafeNet Android ${{ steps.app_version.outputs.release_tag }}
          files: |
            ${{ steps.prepare-release-assets.outputs.release_dir }}/${{ steps.prepare-release-assets.outputs.apk_asset }}
            ${{ steps.prepare-release-assets.outputs.release_dir }}/${{ steps.prepare-release-assets.outputs.checksum_asset }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify formal GitHub Release assets
        id: verify-android-release
        if: always() && steps.publish-android-release.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
          RELEASE_TAG: ${{ steps.app_version.outputs.release_tag }}
          APK_ASSET: ${{ steps.prepare-release-assets.outputs.apk_asset }}
          CHECKSUM_ASSET: ${{ steps.prepare-release-assets.outputs.checksum_asset }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/published-android-release-assets"
          mkdir -p "$release_dir"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          RELEASE_JSON="$release_json" EXPECTED_TAG="$RELEASE_TAG" EXPECTED_APK="$APK_ASSET" EXPECTED_CHECKSUM="$CHECKSUM_ASSET" node --input-type=module <<'NODE'
          const release = JSON.parse(process.env.RELEASE_JSON);
          const expectedTag = process.env.EXPECTED_TAG;
          const expectedAssets = [
            process.env.EXPECTED_APK,
            process.env.EXPECTED_CHECKSUM,
          ];
          if (release.tag_name !== expectedTag) {
            throw new Error(
              `Formal release tag mismatch: expected ${expectedTag}, received ${release.tag_name ?? "missing"}.`,
            );
          }
          const assetNames = new Set((release.assets ?? []).map((asset) => asset.name));
          for (const asset of expectedAssets) {
            if (!assetNames.has(asset)) {
              throw new Error(
                `Formal release ${expectedTag} is missing expected asset ${asset}.`,
              );
            }
          }
          console.log(
            `Formal release ${release.tag_name} contains the versioned APK and checksum assets.`,
          );
          NODE
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$APK_ASSET" \
            --pattern "$CHECKSUM_ASSET" \
            --dir "$release_dir" \
            --clobber
          (
            cd "$release_dir"
            sha256sum --check "$CHECKSUM_ASSET"
          )
          apk="$release_dir/$APK_ASSET"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -n 1)"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -perm -u+x | sort -V | tail -n 1)"
          test -n "$apksigner"
          test -n "$aapt"
          "$apksigner" verify --verbose "$apk"
          "$aapt" dump badging "$apk" |
            grep -F "package: name='com.safenet.dns' versionCode='$ANDROID_VERSION_CODE' versionName='$ANDROID_VERSION_NAME'"
          echo "Verified formal release assets for $RELEASE_TAG against Android versionName $ANDROID_VERSION_NAME and versionCode $ANDROID_VERSION_CODE."

      - name: Publish Android APK summary
        if: always()
        shell: bash
        env:
          ANDROID_VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
          APK_VERIFICATION_OUTCOME: ${{ steps.verify-apk.outcome }}
          NATIVE_COMPILE_OUTCOME: ${{ steps.android-native-compile.outcome }}
          RELEASE_PUBLISH_OUTCOME: ${{ steps.publish-android-release.outcome }}
          RELEASE_VERIFY_OUTCOME: ${{ steps.verify-android-release.outcome }}
          RELEASE_TAG: ${{ steps.app_version.outputs.release_tag }}
          APK_ARTIFACT_URL: ${{ steps.upload-apk-only.outputs.artifact-url || format('{0}/{1}/actions/runs/{2}#artifacts', github.server_url, github.repository, github.run_id) }}
          CHECKSUM_ARTIFACT_URL: ${{ steps.upload-apk-sha256.outputs.artifact-url || format('{0}/{1}/actions/runs/{2}#artifacts', github.server_url, github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          version_name="${ANDROID_VERSION_NAME:-unresolved}"
          version_code="${ANDROID_VERSION_CODE:-unresolved}"
          apk_outcome="${APK_VERIFICATION_OUTCOME:-unavailable}"
          native_compile_outcome="${NATIVE_COMPILE_OUTCOME:-unavailable}"
          release_publish_outcome="${RELEASE_PUBLISH_OUTCOME:-unavailable}"
          release_verify_outcome="${RELEASE_VERIFY_OUTCOME:-not_run}"
          release_tag="${RELEASE_TAG:-unresolved}"
          apk_url="${APK_ARTIFACT_URL:-unavailable}"
          checksum_url="${CHECKSUM_ARTIFACT_URL:-unavailable}"
          {
            echo "## Android APK verification"
            echo
            echo "- **Resolved versionName:** \`$version_name\`"
            echo "- **Resolved versionCode:** \`$version_code\`"
            echo "- **Expected application package:** \`com.safenet.dns\`"
            echo "- **Native Android compile:** \`$native_compile_outcome\`"
            echo "- **Signed application APK verification:** \`$apk_outcome\` ([preserved APK artifact]($apk_url))"
            echo "- **APK checksum:** [preserved SHA-256 artifact]($checksum_url)"
            echo "- **Formal GitHub Release:** \`$release_publish_outcome\` (tag \`$release_tag\`)"
            echo "- **Formal release asset verification:** \`$release_verify_outcome\`"
            echo "- **Instrumentation APK verification:** \`not run in APK-only workflow\`"
          } >> "$GITHUB_STEP_SUMMARY"
