name: Print Android signing certificate SHA-1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  print-signing-fingerprint:
    name: Print signing fingerprint
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo 'ANDROID_KEYSTORE_BASE64 repository secret is required.' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/safenet-release.keystore"
          chmod 600 "$RUNNER_TEMP/safenet-release.keystore"

      - name: Print release signing certificate SHA-1
        shell: bash
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/safenet-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" ]]; then
            echo 'ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS repository secrets are required.' >&2
            exit 1
          fi
          fingerprint="$(
            keytool -list -v \
              -keystore "$ANDROID_KEYSTORE_FILE" \
              -alias "$ANDROID_KEY_ALIAS" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" |
              awk '/SHA-?1:/ {
                sub(/^.*SHA-?1:[[:space:]]*/, "")
                print
                found = 1
              }
              END {
                if (!found) exit 1
              }'
          )"
          printf 'Release signing certificate SHA-1: %s\n' "$fingerprint"

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/safenet-release.keystore"
