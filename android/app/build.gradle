apply plugin: 'com.android.application'

def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_FILE")
def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def releaseSigningConfigured = [
    releaseKeystorePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { value -> value != null && !value.trim().isEmpty() }

def wireGuardValue = { String environmentName, String propertyName ->
    def environmentValue = System.getenv(environmentName)
    if (environmentValue != null) {
        return environmentValue
    }
    def propertyValue = project.findProperty(propertyName)
    return propertyValue == null ? "" : propertyValue.toString()
}

def wireGuardBuildConfigString = { String value ->
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n') + '"'
}

def wireGuardGatewayEndpoint = wireGuardValue(
    "SAFENET_WIREGUARD_GATEWAY_ENDPOINT",
    "safenetWireguardGatewayEndpoint"
)
def wireGuardGatewayOwner = wireGuardValue(
    "SAFENET_WIREGUARD_GATEWAY_OWNER",
    "safenetWireguardGatewayOwner"
)
def wireGuardPeerPublicKey = wireGuardValue(
    "SAFENET_WIREGUARD_PEER_PUBLIC_KEY",
    "safenetWireguardPeerPublicKey"
)
def wireGuardClientPrivateKey = wireGuardValue(
    "SAFENET_WIREGUARD_CLIENT_PRIVATE_KEY",
    "safenetWireguardClientPrivateKey"
)
def wireGuardClientAddress = wireGuardValue(
    "SAFENET_WIREGUARD_CLIENT_ADDRESS",
    "safenetWireguardClientAddress"
)
def wireGuardAllowedIps = wireGuardValue(
    "SAFENET_WIREGUARD_ALLOWED_IPS",
    "safenetWireguardAllowedIps"
)
def wireGuardDnsServers = wireGuardValue(
    "SAFENET_WIREGUARD_DNS_SERVERS",
    "safenetWireguardDnsServers"
)
def wireGuardPersistentKeepalive = wireGuardValue(
    "SAFENET_WIREGUARD_PERSISTENT_KEEPALIVE",
    "safenetWireguardPersistentKeepalive"
)

android {
    namespace "com.safenet.dns"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.androidBuildToolsVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.safenet.dns"
        testApplicationId "com.safenet.dns.test"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 60
        versionName "1.0.68"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "SAFENET_WIREGUARD_GATEWAY_ENDPOINT", wireGuardBuildConfigString(wireGuardGatewayEndpoint)
        buildConfigField "String", "SAFENET_WIREGUARD_GATEWAY_OWNER", wireGuardBuildConfigString(wireGuardGatewayOwner)
        buildConfigField "String", "SAFENET_WIREGUARD_PEER_PUBLIC_KEY", wireGuardBuildConfigString(wireGuardPeerPublicKey)
        buildConfigField "String", "SAFENET_WIREGUARD_CLIENT_PRIVATE_KEY", wireGuardBuildConfigString(wireGuardClientPrivateKey)
        buildConfigField "String", "SAFENET_WIREGUARD_CLIENT_ADDRESS", wireGuardBuildConfigString(wireGuardClientAddress)
        buildConfigField "String", "SAFENET_WIREGUARD_ALLOWED_IPS", wireGuardBuildConfigString(wireGuardAllowedIps)
        buildConfigField "String", "SAFENET_WIREGUARD_DNS_SERVERS", wireGuardBuildConfigString(wireGuardDnsServers)
        buildConfigField "String", "SAFENET_WIREGUARD_PERSISTENT_KEEPALIVE", wireGuardBuildConfigString(wireGuardPersistentKeepalive)
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            noCompress "tflite"
        }
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
    testBuildType "release"
}

tasks.register("verifyAndroidToolchain") {
    doLast {
        def requiredPackages = [
            "platforms;android-${rootProject.ext.compileSdkVersion}",
            "platforms;android-${rootProject.ext.targetSdkVersion}",
            "build-tools;${rootProject.ext.androidBuildToolsVersion}"
        ].unique()
        def sdkDirectory = android.sdkDirectory
        if (sdkDirectory == null || !sdkDirectory.isDirectory()) {
            throw new GradleException(
                "Android toolchain unavailable. The Android SDK directory could not be found. " +
                "Configure ANDROID_SDK_ROOT or local.properties before building."
            )
        }
        def missingPackages = requiredPackages.findAll { packageName ->
            def packagePath = packageName.replace(';', File.separator)
            !new File(sdkDirectory, packagePath).isDirectory()
        }

        if (!missingPackages.isEmpty()) {
            throw new GradleException(
                "Android toolchain unavailable. SafeNet requires " +
                "compileSdkVersion=${rootProject.ext.compileSdkVersion}, " +
                "targetSdkVersion=${rootProject.ext.targetSdkVersion}, and " +
                "buildToolsVersion=${rootProject.ext.androidBuildToolsVersion}. " +
                "Missing SDK package(s): ${missingPackages.join(', ')}. " +
                "Install the pinned Android SDK packages before building."
            )
        }
    }
}

tasks.register("verifyReleaseSigning") {
    doLast {
        if (!releaseSigningConfigured) {
            throw new GradleException(
                "Release signing is not configured. Set ANDROID_KEYSTORE_FILE, " +
                "ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
            )
        }
        if (!file(releaseKeystorePath).isFile()) {
            throw new GradleException("Release keystore was not found: ${releaseKeystorePath}")
        }
    }
}

tasks.configureEach {
    if (name == "preReleaseBuild") {
        dependsOn "verifyReleaseSigning"
    }
}

tasks.register("verifyMobileWebAssets") {
    doLast {
        def marker = file("src/main/assets/public/mobile-build.json")
        if (!marker.exists()) {
            throw new GradleException(
                "Android web assets are not configured. Run scripts/build-android.sh with MOBILE_API_URL before building the APK."
            )
        }
        def config = new groovy.json.JsonSlurper().parse(marker)
        if (!(config.apiOrigin instanceof String) || !config.apiOrigin.startsWith("https://")) {
            throw new GradleException("Android mobile-build.json contains an invalid API origin.")
        }
    }
}

preBuild.dependsOn verifyMobileWebAssets
preBuild.dependsOn verifyAndroidToolchain
tasks.configureEach {
    if (name == "assembleRelease" || name == "assembleReleaseAndroidTest") {
        dependsOn "verifyAndroidToolchain"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "com.wireguard.android:tunnel:1.0.20250531"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.3.0"
    implementation "org.tensorflow:tensorflow-lite:2.17.0"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
