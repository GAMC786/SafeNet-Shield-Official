// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.0.21'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// SafeNet ships the Google Play RevenueCat path. Exclude RevenueCat's optional
// Amazon store module from every Android subproject because its Amazon SDK
// dependency contains bytecode rejected by the pinned D8 toolchain.
subprojects {
    configurations.configureEach {
        exclude group: "com.revenuecat.purchases", module: "purchases-store-amazon"
        exclude group: "com.amazon.device", module: "amazon-appstore-sdk"
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
