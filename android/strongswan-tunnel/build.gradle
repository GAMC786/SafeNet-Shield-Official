apply plugin: 'com.android.library'

def strongSwanSourceDir = rootProject.file("../third_party/strongswan/src/frontends/android/app/src/main")
def sdnsSourceDir = rootProject.file("../android/windscribe-sdns")
def sdnsOutputDir = layout.buildDirectory.dir("generated/safenetsdns")
def abiGoSettings = [
    "arm64-v8a": [goarch: "arm64", triple: "aarch64-linux-android"],
    "armeabi-v7a": [goarch: "arm", triple: "armv7a-linux-androideabi"],
    "x86": [goarch: "386", triple: "i686-linux-android"],
    "x86_64": [goarch: "amd64", triple: "x86_64-linux-android"]
]

def sdnsTasks = abiGoSettings.collect { abi, settings ->
    tasks.register("buildSafeNetSdns${abi.replace('-', '').replace('_', '')}", Exec) {
        def outputDir = sdnsOutputDir.get().dir(abi).asFile
        def api = rootProject.ext.minSdkVersion
        workingDir sdnsSourceDir
        commandLine "go", "build", "-buildmode=c-shared", "-trimpath", "-o",
            new File(outputDir, "libsafenetsdns.so").absolutePath, "./cshared"
        environment "GOOS", "android"
        environment "GOARCH", settings.goarch
        environment "CGO_ENABLED", "1"
        inputs.dir sdnsSourceDir
        outputs.dir outputDir
        doFirst {
            def hostTag = org.gradle.internal.os.OperatingSystem.current().isWindows() ?
                "windows-x86_64" : "linux-x86_64"
            def clang = new File(android.sdkDirectory,
                "ndk/${rootProject.ext.strongswanNdkVersion}/toolchains/llvm/prebuilt/${hostTag}/bin/${settings.triple}${api}-clang")
            environment "CC", clang.absolutePath
            environment "CXX", clang.absolutePath + "++"
            outputDir.mkdirs()
        }
    }
}
def buildSafeNetSdns = tasks.register("buildSafeNetSdns") {
    dependsOn sdnsTasks
    outputs.dir sdnsOutputDir
}

tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn buildSafeNetSdns
}
tasks.configureEach {
    if (name.startsWith("configureNdkBuild") || name.startsWith("buildNdkBuild") ||
        name.startsWith("externalNativeBuild")) {
        dependsOn buildSafeNetSdns
    }
}

android {
    namespace "org.strongswan.android"
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.strongswanNdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
        externalNativeBuild {
            ndkBuild {
                arguments "-j${Runtime.runtime.availableProcessors()}"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        ndkBuild {
            path new File(strongSwanSourceDir, "jni/Android.mk")
        }
    }
    sourceSets {
        main {
            java.srcDirs = [new File(strongSwanSourceDir, "java")]
            res.srcDirs = [new File(strongSwanSourceDir, "res")]
            manifest.srcFile file("src/main/AndroidManifest.xml")
        }
    }
}

def opensslOutputDir = new File(strongSwanSourceDir, "jni/openssl")
def opensslVersion = rootProject.ext.strongswanOpenSSLVersion
def opensslChecksum = rootProject.ext.strongswanOpenSSLSha256
def opensslAbis = abiGoSettings.keySet().toList()
def prepareStrongSwanOpenSSL = tasks.register("prepareStrongSwanOpenSSL", Exec) {
    def prepareScript = rootProject.file("../scripts/prepare-strongswan-android-openssl.sh")
    def opensslMarker = new File(opensslOutputDir, ".safenet-openssl-version")
    def expectedMarker = "${opensslVersion} ${opensslChecksum}"

    commandLine "bash", prepareScript.absolutePath
    environment "ANDROID_SDK_ROOT", android.sdkDirectory.absolutePath
    environment "ANDROID_HOME", android.sdkDirectory.absolutePath
    environment "ANDROID_NDK_ROOT",
        new File(android.sdkDirectory, "ndk/${rootProject.ext.strongswanNdkVersion}").absolutePath
    environment "SAFENET_STRONGSWAN_ANDROID_ABIS", opensslAbis.join(" ")
    environment "SAFENET_STRONGSWAN_MIN_SDK", rootProject.ext.minSdkVersion.toString()

    inputs.file prepareScript
    inputs.file rootProject.file("variables.gradle")
    inputs.property("opensslVersion", opensslVersion)
    inputs.property("opensslSha256", opensslChecksum)
    inputs.property("strongswanNdkVersion", rootProject.ext.strongswanNdkVersion)
    outputs.dir opensslOutputDir

    onlyIf {
        def markerVersion = opensslMarker.isFile() ?
            opensslMarker.getText("UTF-8").trim() : ""
        !(markerVersion == expectedMarker &&
            new File(opensslOutputDir, "Android.mk").isFile() &&
            new File(opensslOutputDir, "include/openssl/opensslv.h").isFile() &&
            opensslAbis.every { abi ->
                def archive = new File(opensslOutputDir, "${abi}/libcrypto.a")
                archive.isFile() && archive.length() > 0
            })
    }
}

tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn prepareStrongSwanOpenSSL
}
tasks.configureEach {
    if (name.startsWith("configureNdkBuild") || name.startsWith("buildNdkBuild") ||
        name.startsWith("externalNativeBuild")) {
        dependsOn prepareStrongSwanOpenSSL
    }
}

// ndk-build executes once per ABI. Select the matching c-shared output from
// the ABI-specific generated project directory.
android.defaultConfig.externalNativeBuild.ndkBuild.arguments(
    "SAFENET_SDNS_LIB=${new File(sdnsOutputDir.get().asFile, "\$(TARGET_ARCH_ABI)/libsafenetsdns.so").absolutePath}",
    "SAFENET_SDNS_INCLUDE=${new File(sdnsOutputDir.get().asFile, "\$(TARGET_ARCH_ABI)").absolutePath}"
)

dependencies {
    implementation "androidx.appcompat:appcompat:$rootProject.ext.androidxAppCompatVersion"
    implementation "androidx.core:core:$rootProject.ext.androidxCoreVersion"
    implementation "androidx.lifecycle:lifecycle-process:2.9.4"
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"
    implementation "com.google.android.material:material:1.13.0"
}