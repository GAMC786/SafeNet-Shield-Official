include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')
include ':windscribe-tunnel'
project(':windscribe-tunnel').projectDir = new File('./windscribe-tunnel/')
include ':strongswan-tunnel'
project(':strongswan-tunnel').projectDir = new File('./strongswan-tunnel/')

includeBuild('../third_party/trusttunnel-client/platform/android') {
    dependencySubstitution {
        substitute module('com.adguard.trusttunnel:trusttunnel-client-android') using project(':lib')
    }
}

apply from: 'capacitor.settings.gradle'